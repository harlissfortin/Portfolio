<script>
"use strict";
/* ---------- storage (per-viewer convenience only) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("wb1:"+k); return v===null? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("wb1:"+k, JSON.stringify(v)); }catch(e){} }
};
let done = store.get("done", {});          // screenKey -> true
let kcState = store.get("kc", {best:0, passed:false, attempts:0});
let drafts = store.get("drafts", {});      // field drafts

/* ============================================================
   COURSE DATA — condensed from the module source scripts
   Screen types: les (lesson), quiz, classify, reflect, form
============================================================ */
const M = [];

M.push({ id:"m1", n:1, t:"Why Processes Fail People", time:"15 min", screens:[
{k:"les", label:"The idea", h:"Blame the process, not the person", html:`
<p>Think of the last time your workday went sideways — the missing information, the system that made you enter the same thing twice, the approval that sat in an inbox for three days. Was that a <strong>lazy person</strong> problem, or a <strong>badly designed process</strong> problem?</p>
<div class="quote">W. Edwards Deming's famous rule of thumb: about <b>94% of performance problems belong to the system</b> — the way work is designed and managed — and only about 6% to special causes such as one person's actions on one day. (Juran's earlier estimate was 85/15; the direction is what matters.)</div>
<p>People generally come to work wanting to do a good job. When they can't, it's usually because the process makes the wrong thing easy and the right thing hard. The mindset shift that starts all continuous improvement: <strong>blame the process, not the person — then fix the process.</strong></p>
<p>This matters twice over. It's <strong>more accurate</strong>: swap the person and the next person inherits the same broken process and produces the same result. And it's <strong>safer to talk about</strong>: when problems are framed as process flaws, people stop hiding them — and a workplace where problems are hidden cannot improve.</p>`,
tk:["Most recurring problems are built into the process; changing people rarely fixes them.","Framing problems as process flaws makes them safe to surface.","Your frustrations are data. This course teaches you to read them."]},
{k:"les", label:"In practice", h:"Same story, three workplaces", html:`
<div class="tablewrap"><table>
<tr><th>What it looks like</th><th>What it really is</th></tr>
<tr><td>A packer keeps shipping the wrong variant</td><td>Two near-identical part bins sit side by side with tiny labels. New packer, same errors.</td></tr>
<tr><td>A nurse "forgets" a discharge step</td><td>The discharge checklist lives in a different system than the one nurses chart in.</td></tr>
<tr><td>An analyst sends stale figures</td><td>Three "final" versions of the spreadsheet exist and nothing marks which is current.</td></tr>
</table></div>
<p>In each case, replacing the person changes nothing. Redesigning the setup — distinct bins, one system, one marked current version — changes everything.</p>`},
{k:"reflect", label:"Try it", h:"Reframe one of your own frustrations",
 prompt:"Describe one recurring frustration in your work. Write it once as a person problem, and once as a process problem. Which framing gives you something you could actually fix?",
 dk:"m1_reflect"}
]});

M.push({ id:"m2", n:2, t:"What Is a Process?", time:"15 min", screens:[
{k:"les", label:"The idea", h:"SIPOC: five questions about any work", html:`
<p>A <strong>process</strong> is any repeatable sequence of steps that turns inputs into outputs for a customer. Making coffee. Admitting a patient. Closing the monthly books. If it happens more than once and has steps, it's a process — and anything that's a process can be studied and improved.</p>
<div class="tablewrap"><table>
<tr><th></th><th>Means</th><th>Ask yourself</th></tr>
<tr><td><b>S</b> — Suppliers</td><td>Who provides what the process needs</td><td>Where do my inputs come from?</td></tr>
<tr><td><b>I</b> — Inputs</td><td>Materials, information, requests</td><td>What do I need to start?</td></tr>
<tr><td><b>P</b> — Process</td><td>The 4–7 major steps</td><td>What happens, at a high level?</td></tr>
<tr><td><b>O</b> — Outputs</td><td>What the process produces</td><td>What leaves this process?</td></tr>
<tr><td><b>C</b> — Customers</td><td>Who receives the output</td><td>Who uses what I produce — and what do they need it to be?</td></tr>
</table></div>
<p>Two ideas inside SIPOC do most of the work: <strong>customers are often internal</strong> — whoever receives your output is your customer, and their requirements define your quality. And <strong>you are someone's supplier</strong> — your sloppy output is someone else's defective input.</p>`,
tk:["Everything repeatable is a process with suppliers, inputs, steps, outputs, customers.","Quality is defined by the customer of the output — often the next person in the chain."]},
{k:"classify", label:"Try it", h:"Sort the pharmacy pickup", intro:"A patient picks up a prescription. Sort each item into its SIPOC column.",
 buckets:["Supplier","Input","Process step","Output","Customer"],
 items:[
  {t:"The prescribing physician", b:0, w:"They provide the prescription the process needs — a supplier."},
  {t:"The prescription itself", b:1, w:"What the process needs to start — an input."},
  {t:"Verify insurance coverage", b:2, w:"A step the pharmacy performs — process."},
  {t:"Count and fill the medication", b:2, w:"A step that transforms inputs — process."},
  {t:"The filled, labeled prescription", b:3, w:"What the process produces — an output."},
  {t:"The patient", b:4, w:"Receives the output — the customer."},
  {t:"The drug wholesaler", b:0, w:"Provides the medication stock — a supplier."},
  {t:"Counsel the patient at pickup", b:2, w:"A step performed as part of the service — process."},
  {t:"The updated medication record", b:3, w:"A second output — many processes have several."},
  {t:"The patient's insurer", b:4, w:"Also receives an output (the claim) — customers can be multiple, and internal or external."}
]}
]});

M.push({ id:"m3", n:3, t:"TPS, Deming & Variation", time:"15 min", screens:[
{k:"les", label:"The idea", h:"Two traditions, one enemy", html:`
<p><strong>Lean</strong> grew from the <strong>Toyota Production System</strong>, built when Toyota could not afford warehouses of inventory or armies of inspectors. Its core question: <em>of everything we do, what does the customer actually value — and how do we eliminate the rest?</em> Lean is the discipline of <strong>removing waste and making work flow</strong>.</p>
<p><strong>Six Sigma</strong> was born at Motorola and scaled at GE. Its core question: <em>why doesn't the process give the same good result every time?</em> Six Sigma is the discipline of <strong>reducing variation using data</strong> — the name comes from a statistical goal so consistent that defects are vanishingly rare (about 3.4 per million opportunities).</p>
<p>Why is <strong>variation</strong> the enemy? Because customers experience the <em>spread</em>, not the average. A café whose espresso takes "3 minutes on average" but ranges from 1 to 9 minutes feels unreliable. A lab that returns results in 2–14 days can't be planned around. <strong>Averages hide the pain; variation is the pain.</strong></p>
<p><strong>Deming</strong> ties them together: improve the system using data and the Plan-Do-Check-Act learning cycle — and treat quality as management's responsibility, not the inspector's. (Deming himself called it Plan-Do-<em>Study</em>-Act: the third step is for learning what happened, not ticking a box.)</p>
<div class="quote">Lean makes work flow; Six Sigma makes results consistent. Speed without consistency is chaos delivered faster; consistency without speed is reliable disappointment.</div>`,
tk:["Lean = remove waste, create flow (from Toyota).","Six Sigma = reduce variation with data (from Motorola/GE).","Customers feel variation, not averages."]},
{k:"quiz", label:"Check", h:"Three quick checks", items:[
 {q:"A hospital lab averages 24 hours for results, but individual results range from 4 to 96 hours. Which discipline most directly targets the 4-to-96 problem?",
  o:["Lean","Six Sigma","5S","Neither — the average is fine"], a:1,
  w:"The spread is a variation problem — Six Sigma's home turf. The average hides it."},
 {q:"Lean's core contribution, in one phrase:",
  o:["Reduce variation using statistics","Eliminate waste and create flow","Inspect quality into the product","Automate manual work"], a:1,
  w:"Lean removes non-value-added work and makes value flow."},
 {q:"Why do customers “feel variation, not averages”?",
  o:["Customers can't do math","Each customer experiences one instance from the spread, not the mean","Averages are always wrong","Variation is caused by staff"], a:1,
  w:"A 3-minute average espresso means nothing to the customer who waited 9 minutes."}
]}
]});

M.push({ id:"m4", n:4, t:"Value-Added vs. Non-Value-Added", time:"15 min", screens:[
{k:"les", label:"The idea", h:"The three-part value test", html:`
<p>An activity is <strong>value-added (VA)</strong> only if it passes <strong>all three</strong> tests:</p>
<ol>
<li><strong>The customer would pay for it</strong> (or cares that it happened).</li>
<li><strong>It changes the thing</strong> being worked on — physically or informationally.</li>
<li><strong>It's done right the first time</strong> — rework never counts, even rework of a value step.</li>
</ol>
<p>Everything else is <strong>non-value-added (NVA)</strong> — waste. One important subcategory: <strong>necessary non-value-added (NNVA)</strong> — things the customer doesn't value but regulation, safety, or current business reality requires (compliance documentation, some inspections, payroll). You <em>minimize</em> NNVA; you <em>eliminate</em> NVA; you protect and improve VA.</p>
<div class="note"><span class="dot"></span><span>The startling finding, consistent across industries: in a typical unimproved process, <b>less than 10% of elapsed time is value-added</b>. A 30-day mortgage contains a few hours of actual work. This is great news — enormous improvement is available without asking anyone to work faster.</span></div>`,
tk:["Value = customer values it + it transforms the work + right first time.","Most process time — often 90%+ — is non-value-added. That's the opportunity.","Necessary NVA is minimized; pure NVA is eliminated."]},
{k:"classify", label:"Try it", h:"Grade the blood test", intro:"Classify each step of “get a blood test” — and a few office cousins.",
 buckets:["Value-added","Non-value-added","Necessary NVA"],
 items:[
  {t:"Drawing the blood sample", b:0, w:"The customer needs it, it advances the work, done once — VA."},
  {t:"Patient waiting 40 minutes in the lobby", b:1, w:"Waiting is pure waste — nothing changes, nobody would pay for it."},
  {t:"Labeling the sample per safety protocol", b:2, w:"The patient doesn't value the label itself, but safety requires it — minimize, don't eliminate."},
  {t:"Re-drawing because the first tube was mislabeled", b:1, w:"Rework never counts as value — even though drawing blood is normally VA."},
  {t:"Analyzing the sample", b:0, w:"Transforms the sample into the answer the customer wants — VA."},
  {t:"Filing the compliance copy required by regulation", b:2, w:"Required but not valued — necessary NVA."},
  {t:"Triple-checking a form that one check would catch", b:1, w:"Checking beyond what adds scrutiny is extra-processing — NVA."},
  {t:"Entering the same order into a second system", b:1, w:"Re-entry changes nothing about the work item — NVA."},

M.push({ id:"m5", n:5, t:"The 8 Wastes: D-O-W-N", time:"20 min", screens:[
{k:"les", label:"The idea", h:"DOWNTIME, first half", html:`
<p>The 8 wastes spell <strong>DOWNTIME</strong>. Here are the first four.</p>
<div class="wastegrid">
<div class="waste"><span class="lt">D</span><span class="nm">Defects</span><p>Work that is wrong, incomplete, or unusable — plus everything that follows: rework, scrap, corrections, apologies. The most expensive waste, because defects multiply downstream.</p></div>
<div class="waste"><span class="lt">O</span><span class="nm">Overproduction</span><p>Making more, sooner, or faster than the next step needs. The worst waste — it manufactures the others: overproduced items must be stored, moved, and often fixed later.</p></div>
<div class="waste"><span class="lt">W</span><span class="nm">Waiting</span><p>People or work items idle — for approvals, information, machines, the previous step. Usually the single largest component of lead time.</p></div>
<div class="waste"><span class="lt">N</span><span class="nm">Non-utilized talent</span><p>Failing to use people's skills, knowledge, and ideas. The operator who knows why the line jams but is never asked. A belt program is, at its core, an attack on this waste.</p></div>
</div>`,
tk:["DOWN: Defects, Overproduction, Waiting, Non-utilized talent.","Overproduction breeds other wastes; defects multiply cost downstream.","Unused ideas are the most human waste of all."]},
{k:"quiz", label:"Spot it", h:"Name the waste", items:[
 {q:"A print shop runs 5,000 brochures for a customer who ordered 3,000 — “the press was already set up.” First and foremost, this is:",
  o:["Inventory","Overproduction","Extra-processing","Motion"], a:1,
  w:"Making more than the customer needs is overproduction. The extra 2,000 then become inventory — which is why it's called the waste that breeds other wastes."},
 {q:"Completed insurance claims sit four days in a queue before an adjuster opens them. For the claim itself:",
  o:["Waiting","Motion","Defects","Non-utilized talent"], a:0,
  w:"The work item is idle. Queue time is waiting — typically the largest share of total lead time."},
 {q:"An invoice goes out with the wrong purchase-order number and comes back for correction:",
  o:["Extra-processing","Transportation","Defects","Overproduction"], a:2,
  w:"Wrong or incomplete work is a defect; the correction loop is the rework it generates."},
 {q:"A machinist with ten years of fixture-improvement ideas is never asked for input:",
  o:["Waiting","Non-utilized talent","Motion","Extra-processing"], a:1,
  w:"Unused skills, knowledge, and ideas — the 8th waste, and the one CI most directly attacks."}
]}
]});

M.push({ id:"m6", n:6, t:"The 8 Wastes: T-I-M-E", time:"20 min", screens:[
{k:"les", label:"The idea", h:"DOWNTIME, second half", html:`
<div class="wastegrid">
<div class="waste"><span class="lt">T</span><span class="nm">Transportation</span><p>Moving the <b>work item</b> — product, patient, document, file — between locations or systems. Every move adds delay and risk; none adds value.</p></div>
<div class="waste"><span class="lt">I</span><span class="nm">Inventory</span><p>Work piling up between steps — and its office forms: full inboxes, ticket backlogs, unread reports. It ties up cash, hides problems, and goes stale.</p></div>
<div class="waste"><span class="lt">M</span><span class="nm">Motion</span><p>Movement of the <b>person</b> doing the work: reaching, walking, searching, clicking through six screens. It wears people out without advancing the work.</p></div>
<div class="waste"><span class="lt">E</span><span class="nm">Extra-processing</span><p>Doing more than the customer requires: polishing beyond spec, triple-checking, signatures that add no scrutiny, the beautiful 30-slide deck when the decision needed one number.</p></div>
</div>
<div class="quote">Rule of thumb: <b>Transportation moves the work; Motion moves the worker.</b></div>`,
tk:["TIME: Transportation, Inventory, Motion, Extra-processing.","Inventory hides problems; extra-processing is effort the customer never asked for."]},
{k:"quiz", label:"Spot it", h:"Work or worker?", items:[
 {q:"A nurse walks to a supply room at the far end of the unit six times per shift because gloves aren't stocked at the bedside:",

 {q:"Lab samples are couriered between two hospital buildings three times a day:",

  o:["Waiting","Inventory","Defects","Motion"], a:1,
  w:"Work-in-progress piling up between steps is inventory — including backlogs and full inboxes. (Each ticket also experiences waiting; the pile is inventory.)"},

M.push({ id:"m8", n:8, t:"5S: A Place for Everything", time:"15 min", screens:[
{k:"les", label:"The idea", h:"Five S's, one purpose", html:`
<ol>
<li><strong>Sort</strong> — remove what isn't needed. Red-tag doubtful items; when in doubt, move it out.</li>
<li><strong>Set in Order</strong> — a place for everything, arranged by frequency of use; label, outline, make the <em>absence</em> of something instantly visible.</li>
<li><strong>Shine</strong> — clean and inspect. Cleaning is inspection in disguise: wiping down the machine is how you notice the oil leak early.</li>
<li><strong>Standardize</strong> — make the first three the documented norm: photo standards, checklists, labeled layouts.</li>
<li><strong>Sustain</strong> — build the habit: audits, leader walk-throughs, team ownership. This is where most 5S efforts die.</li>
</ol>
<p><strong>Digital 5S</strong> applies the same logic to shared drives, inboxes, and dashboards: archive what's stale, adopt naming conventions, fix broken links, keep one marked current version, schedule the cleanup cadence.</p>
<div class="quote">5S is not housekeeping. Its purpose is <b>making abnormality visible</b>: in a 5S'd workspace, the missing tool, the extra part, and the growing backlog announce themselves.</div>`,
tk:["Sort, Set in Order, Shine, Standardize, Sustain.","The point is visible abnormality, not tidiness.","Sustain is the hard one — it belongs to leaders and teams, not posters."]},
{k:"classify", label:"Try it", h:"Which S produced this change?", intro:"Each before/after change below came from one S. Name it.",
 buckets:["Sort","Set in Order","Shine","Standardize","Sustain"],
 items:[
  {t:"A dated red-tag zone now holds items nobody could vouch for", b:0, w:"Red-tagging is Sort — turning 'we might need it' into a time-boxed experiment."},
  {t:"A shadow board shows one missing wrench outline at a glance", b:1, w:"A visible home for everything — Set in Order."},
  {t:"While wiping down the press, the team logged a slow hydraulic leak", b:2, w:"Cleaning as inspection — Shine's real deliverable is the anomaly list."},
  {t:"A photo of 'ready for shift' is posted at the workstation", b:3, w:"Making the new state the documented norm — Standardize."},
  {t:"A 5-minute weekly self-audit is on the calendar with an owner's name", b:4, w:"Scheduled, owned, visible — Sustain."},
  {t:"The shared drive now has one 'Current' folder; 'final_v3_USE_THIS' is gone", b:1, w:"Digital Set in Order — current-ness marked structurally, never by filename adjectives."}
]}
]});

M.push({ id:"m9", n:9, t:"DMAIC as a Storyline", time:"20 min", screens:[
{k:"les", label:"The idea", h:"Five phases, five questions", html:`
<p>When a problem is too big for "just fix it," Lean Six Sigma uses a five-phase roadmap: <strong>DMAIC</strong>. Don't memorize tools — memorize the <em>questions</em>:</p>
<div class="tablewrap"><table>
<tr><th>Phase</th><th>The question it answers</th></tr>
<tr><td><b>Define</b></td><td>What problem are we solving, and why does it matter?</td></tr>
<tr><td><b>Measure</b></td><td>How bad is it, really — in numbers?</td></tr>
<tr><td><b>Analyze</b></td><td>What is actually causing it?</td></tr>
<tr><td><b>Improve</b></td><td>What change fixes the cause — and does it work?</td></tr>
<tr><td><b>Control</b></td><td>How do we make sure it stays fixed?</td></tr>
</table></div>
<p>Two disciplines make DMAIC different from ordinary problem-solving. <strong>No jumping to solutions</strong> — the most common failure is landing in Improve on day one; DMAIC forces the boring, decisive middle. And <strong>no walking away after the fix</strong> — the second most common failure is improvement that evaporates in 90 days. Control is a full phase for a reason.</p>
<p>White Belts aren't expected to lead DMAIC — but you'll be invited into these projects as the people who know the real work, and knowing the storyline lets you contribute from day one.</p>`,
tk:["Define → Measure → Analyze → Improve → Control; each phase answers one question.","The discipline is resisting the leap to solutions — and not abandoning the fix."]},
{k:"classify", label:"Try it", h:"Which phase is this?", intro:"Place each project activity in its DMAIC phase.",
 buckets:["Define","Measure","Analyze","Improve","Control"],
 items:[
  {t:"Interview customers about what a 'good' turnaround means", b:0, w:"Understanding the problem and why it matters — Define."},
  {t:"Agree the project scope: order receipt to shipment, one product line", b:0, w:"Scoping is Define work — start/stop points settle the arguments."},
  {t:"Collect two weeks of baseline timing data with an agreed definition of 'late'", b:1, w:"Establishing how bad it really is, in numbers — Measure."},
  {t:"Check that two auditors count 'incomplete' the same way", b:1, w:"Trustworthy measurement is Measure's whole job."},
  {t:"Build a fishbone of possible causes, then go verify the top three", b:2, w:"Finding and verifying causes — Analyze."},
  {t:"Test whether error rates differ by shift using the collected data", b:2, w:"Testing cause theories against evidence — Analyze."},
  {t:"Run a two-week pilot of the new intake form on one team", b:3, w:"Piloting a fix aimed at a verified cause — Improve."},
  {t:"Mistake-proof the form so the field can't be skipped", b:3, w:"Implementing the solution — Improve."},
  {t:"Set up a weekly metric review with a response plan if it drifts", b:4, w:"Locking in the gain — Control."},
  {t:"Hand the process back to its owner with the updated standard", b:4, w:"Closure and handover — Control."}
]}
]});

M.push({ id:"m10", n:10, t:"Process vs. People Problems", time:"15 min", screens:[
{k:"les", label:"The idea", h:"Three diagnostic questions", html:`
<p>Saying "it's the process" isn't the same as knowing <em>how to tell</em>. Ask three questions about any recurring problem:</p>
<ol>
<li><strong>Does it happen across different people?</strong> If three different techs make the same error, the error is designed into the work.</li>
<li><strong>Would a conscientious new hire eventually make the same mistake?</strong> If yes, it's the process — the "set up to fail" test.</li>
<li><strong>Does the process make the right way the easy way?</strong> If the correct method requires heroics — extra clicks, memory, workarounds — expect failure at scale.</li>
</ol>
<p>Genuine people problems exist — skill gaps, conduct issues — and they're handled by management, not process tools. The tell: a genuine people problem is <em>specific to the person and persists when the process is sound</em>. But the honest sequence is: <strong>rule out the process first.</strong> Most "people problems" dissolve under that examination.</p>
<div class="quote">When something goes wrong near you, the first question changes from <b>"who?"</b> to <b>"what about how this is set up made that likely?"</b> Asked out loud, that question changes the room.</div>`,
tk:["Test: multiple people? new hire would too? is the right way the easy way?","Rule out the process before concluding 'people problem.'","“What made that likely?” beats “who did that?”"]},
{k:"quiz", label:"Try it", h:"Process, people — or too early to tell?", items:[
 {q:"Three different employees make the same data-entry error in the same field over one month:",
  o:["All three need retraining","The process or interface makes the error likely — examine it","Hiring standards have slipped","The error rate is acceptable"], a:1,
  w:"Repetition across different people is the signature of a process-designed error."},
 {q:"One team member repeatedly misses deadlines that everyone else on the same workflow meets comfortably:",
  o:["Clearly a process problem","Possibly a genuine people matter — but verify the process is truly the same for everyone first","Redesign the workflow for everyone","Ignore it"], a:1,
  w:"Person-specific and persisting under a sound process is the tell — but the honest sequence still rules out the process first (same tools? same inputs? same load?)."},
 {q:"A new report format was rolled out yesterday and one analyst got it wrong this morning:",
  o:["Process problem — redesign the format","People problem — coach the analyst","Can't tell yet — one instance, one day in; go look at how the change was introduced","Both"], a:2,
  w:"One data point on day one tells you almost nothing. 'Can't tell yet — go look' is a legitimate and often correct answer."},
 {q:"The right way to log a sample takes 11 clicks across two systems; the wrong way takes 2. Errors are common:",
  o:["Enforce the 11-click method harder","The process fails the 'right way = easy way' test; redesign it","Hire more careful staff","Audit and discipline"], a:1,
  w:"When correctness requires heroics, expect failure at scale — that's a design problem."}
]}
]});

M.push({ id:"m11", n:11, t:"The Belt System & Your Role", time:"10 min", screens:[
{k:"les", label:"The idea", h:"The ladder runs on its base", html:`
<div class="tablewrap"><table>
<tr><th>Belt</th><th>In one line</th></tr>
<tr><td><b>White Belt</b> (you)</td><td>Speaks the language; spots and reports waste; contributes ideas</td></tr>
<tr><td><b>Yellow Belt</b></td><td>Serves on project teams; maps processes; runs small local improvements</td></tr>
<tr><td><b>Green Belt</b></td><td>Leads a DMAIC project on a real process, part-time</td></tr>
<tr><td><b>Black Belt</b></td><td>Leads major cross-functional projects; advanced statistics; coaches Green Belts</td></tr>
<tr><td><b>Master Black Belt</b></td><td>Designs the whole improvement program; ties CI to strategy</td></tr>
</table></div>
<p>The system only works because of its base. Green and Black Belts do not know where the problems are — <strong>you do</strong>. Every strong CI culture runs on frontline eyes:</p>
<ul>
<li><strong>Report problems without fear</strong> — a surfaced problem is a gift, and the culture must treat it that way.</li>
<li><strong>Contribute ideas</strong> — nobody knows the job like the person doing it.</li>
<li><strong>Join projects when invited</strong> — as the expert witness on how work really happens.</li>
<li><strong>Protect improvements</strong> — follow the new standard, and speak up when it isn't working rather than quietly reverting.</li>
</ul>`,
tk:["Each belt has a distinct job; the ladder runs on frontline participation.","Your contributions start today: surface problems, offer ideas, join projects, hold standards."]}
]});

M.push({ id:"m12", n:12, t:"See a Waste: Field Exercise", time:"20 min", screens:[
{k:"les", label:"The idea", h:"Your first real contribution", html:`
<p>Certification requires one real observation from your own work — because a White Belt who has <em>done it once</em> is different from one who watched videos. A good observation has five parts:</p>
<ol>
<li><strong>Where</strong> — the process and place.</li>
<li><strong>What I observed</strong> — facts only, what you'd see on video. No blame, no guessed causes, no solutions.</li>
<li><strong>Which waste(s)</strong> — named from DOWNTIME; many observations contain two or three.</li>
<li><strong>Who it affects</strong> — the customer of that step, and how they feel it.</li>
<li><strong>An idea</strong> (optional) — one sentence, offered humbly as a hypothesis.</li>
</ol>
<h4>A worked example</h4>
<div class="quote"><b>Where:</b> Invoice processing, accounts payable. <b>Observed:</b> Invoices arriving by email are printed, then re-typed into the ERP by hand. About one in ten comes back from the approver over a mistyped field. <b>Wastes:</b> Extra-processing, Defects, Waiting. <b>Who it affects:</b> Suppliers paid late call to chase; AP spends part of each afternoon on corrections. <b>Idea:</b> I wonder if attachments could go straight into the ERP intake instead of being printed first.</div>
<p>Note what it <em>doesn't</em> do: no "because IT never fixed the integration," no "the team doesn't care." Blame kills observations; vagueness starves them.</p>`},
{k:"form", label:"Submit", h:"See a Waste — your observation"}
]});

function skey(mi, si){ return M[mi].id + ":" + si; }
function modDone(mi){ return M[mi].screens.every((_,si)=> done[skey(mi,si)]); }
function screensTotal(){ return M.reduce((n,m)=>n+m.screens.length,0); }
function screensDone(){ let n=0; M.forEach((m,mi)=>m.screens.forEach((_,si)=>{ if(done[skey(mi,si)]) n++; })); return n; }
function overallPct(){
  const t = screensTotal()+1, d = screensDone() + (kcState.passed?1:0);
  return Math.round(100*d/t);
}
function save(){ store.set("done",done); store.set("kc",kcState); store.set("cur",cur); store.set("drafts",drafts); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderNav(){
  modlist.innerHTML = "";
  M.forEach((m,mi)=>{
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.setAttribute("aria-current", cur.m===mi ? "true":"false");
    b.innerHTML = `<span class="num">${String(m.n).padStart(2,"0")}</span><span>${esc(m.t)}</span>
      <span class="st ${modDone(mi)?"done":""}">${modDone(mi)?"✓":""}</span>`;
    b.addEventListener("click",()=>{ cur={m:mi,s:0}; save(); render(); window.scrollTo({top:0}); });
    li.appendChild(b); modlist.appendChild(li);
  });
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.className="kcrow"; b.classList.add("kcbtn");
  b.setAttribute("aria-current", cur.m===M.length ? "true":"false");
  b.innerHTML = `<span class="num">KC</span><span>Knowledge Check</span>
    <span class="st ${kcState.passed?"done":""}">${kcState.passed?"✓":""}</span>`;
  b.addEventListener("click",()=>{ if(kcRun && kcRun.finished) kcRun=null; cur={m:M.length,s:0}; save(); render(); window.scrollTo({top:0}); });
  li.appendChild(b); modlist.appendChild(li);
  document.getElementById("pfill").style.width = overallPct()+"%";
  document.getElementById("ppct").textContent = overallPct()+"%";
}

function footNav(container, mi, si, extraBtn){
  const nav = document.createElement("div"); nav.className="footnav";
  const back = document.createElement("button"); back.className="btn sec"; back.textContent="← Back";
  back.disabled = (mi===0 && si===0);
  back.addEventListener("click",()=>{
    if(si>0) cur={m:mi,s:si-1}; else cur={m:mi-1,s:M[mi-1].screens.length-1};
    save(); render(); window.scrollTo({top:0});
  });
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  if(extraBtn) nav.appendChild(extraBtn);
  container.appendChild(nav);
  return nav;
}
function nextBtn(mi, si, label){
  const b = document.createElement("button"); b.className="btn";
  const last = si===M[mi].screens.length-1;
  b.textContent = label || (last ? (mi===M.length-1 ? "Finish → Knowledge Check" : "Next module →") : "Continue →");
  b.addEventListener("click",()=>{
    done[skey(mi,si)] = true;
    if(!last) cur={m:mi,s:si+1};
    else if(mi===M.length-1) cur={m:M.length,s:0};
    else cur={m:mi+1,s:0};
    save(); render(); window.scrollTo({top:0});
  });
  return b;
}
function takeaways(el, list){
  if(!list) return;
  const d=document.createElement("div"); d.className="tk";
  d.innerHTML = "<h5>Takeaways</h5><ul>"+list.map(t=>`<li>${esc(t)}</li>`).join("")+"</ul>";
  el.appendChild(d);
}

/* ---------- screen renderers ---------- */
function rLesson(card, sc, mi, si){
  card.insertAdjacentHTML("beforeend", `<h3>${esc(sc.h)}</h3>` + sc.html);
  takeaways(card, sc.tk);
  footNav(card, mi, si, nextBtn(mi, si));
}

function rReflect(card, sc, mi, si){
  card.insertAdjacentHTML("beforeend", `<h3>${esc(sc.h)}</h3><p>${esc(sc.prompt)}</p>`);
  const ta = document.createElement("textarea"); ta.rows=6; ta.id = "ta_"+sc.dk;
  ta.value = drafts[sc.dk] || "";
  ta.addEventListener("input", ()=>{ drafts[sc.dk]=ta.value; save(); });
  card.appendChild(ta);
  const hint=document.createElement("p"); hint.className="protonote";
  hint.textContent="Saved as you type, on this device. In the full course, reflections build into your personal workbook.";
  card.appendChild(hint);
  const b = nextBtn(mi, si);
  footNav(card, mi, si, b);
}

function rQuiz(card, sc, mi, si){
  card.insertAdjacentHTML("beforeend", `<h3>${esc(sc.h)}</h3>`);
  let idx = 0, right = 0, answered = 0;
  const zone = document.createElement("div"); card.appendChild(zone);
  const navHolder = document.createElement("div"); card.appendChild(navHolder);

  function show(){
    zone.innerHTML = "";
    const it = sc.items[idx];
    zone.insertAdjacentHTML("beforeend",
      `<div class="scorechip">Question ${idx+1} / ${sc.items.length}</div><p class="qtext">${esc(it.q)}</p>`);
    const opts=document.createElement("div"); opts.className="opts";
    it.o.forEach((o,oi)=>{
      const b=document.createElement("button"); b.className="opt"; b.textContent=o;
      b.addEventListener("click",()=>{
        if(b.disabled) return;
        [...opts.children].forEach(x=>x.disabled=true);
        answered++;
        const ok = oi===it.a;
        if(ok){ right++; b.classList.add("right"); }
        else { b.classList.add("wrong"); opts.children[it.a].classList.add("right"); }
        const why=document.createElement("div"); why.className="why "+(ok?"good":"bad");
        why.innerHTML = `<b>${ok?"Right.":"Not quite."}</b> ${esc(it.w)}`;
        zone.appendChild(why);
        const nb=document.createElement("button"); nb.className="btn sec";
        nb.textContent = idx<sc.items.length-1 ? "Next question →" : "See result";
        nb.addEventListener("click",()=>{ idx++; idx<sc.items.length ? show() : finish(); });
        zone.appendChild(nb);
      });
      opts.appendChild(b);
    });
    zone.appendChild(opts);
  }
  function finish(){
    zone.innerHTML = `<p class="qtext">You got <strong>${right} of ${sc.items.length}</strong>.</p>
      <p>${right===sc.items.length ? "Clean sweep — the distinctions are landing." :
         "Review the explanations above any misses — the distinctions matter more than the score here."}</p>`;
    navHolder.innerHTML="";
    footNav(navHolder, mi, si, nextBtn(mi, si));
  }
  show();
  if(done[skey(mi,si)]){ /* allow retake but show shortcut */
    const b = nextBtn(mi, si, "Skip (already completed) →");
    footNav(navHolder, mi, si, b);
  }
}

function rClassify(card, sc, mi, si){
  card.insertAdjacentHTML("beforeend", `<h3>${esc(sc.h)}</h3><p>${esc(sc.intro)}</p>`);
  let idx=0, right=0;
  const zone=document.createElement("div"); card.appendChild(zone);
  const navHolder=document.createElement("div"); card.appendChild(navHolder);

  function show(){
    zone.innerHTML="";
    const it = sc.items[idx];
    zone.insertAdjacentHTML("beforeend",
      `<div class="scorechip">Item ${idx+1} / ${sc.items.length}</div><div class="itemcard">${esc(it.t)}</div>`);
    const bk=document.createElement("div"); bk.className="buckets";
    sc.buckets.forEach((b,bi)=>{
      const btn=document.createElement("button"); btn.className="bucket"; btn.textContent=b;
      btn.addEventListener("click",()=>{
        if(btn.disabled) return;
        [...bk.children].forEach(x=>x.disabled=true);
        const ok = bi===it.b;
        if(ok){ right++; btn.classList.add("right"); }
        else { btn.classList.add("wrong"); bk.children[it.b].classList.add("right"); }
        const why=document.createElement("div"); why.className="why "+(ok?"good":"bad");
        why.innerHTML=`<b>${ok?"Right.":"It's “"+esc(sc.buckets[it.b])+".”"}</b> ${esc(it.w)}`;
        zone.appendChild(why);
        const nb=document.createElement("button"); nb.className="btn sec";
        nb.textContent = idx<sc.items.length-1 ? "Next item →" : "See result";
        nb.addEventListener("click",()=>{ idx++; idx<sc.items.length ? show() : finish(); });
        zone.appendChild(nb);
      });
      bk.appendChild(btn);
    });
    zone.appendChild(bk);
  }
  function finish(){
    zone.innerHTML=`<p class="qtext">You placed <strong>${right} of ${sc.items.length}</strong> correctly.</p>
      <p>${right>=sc.items.length-1 ? "Strong — you're reading the categories, not guessing them." :
        "Worth one more pass later: the misclassifications above are exactly the confusions the exam probes."}</p>`;
    navHolder.innerHTML="";
    footNav(navHolder, mi, si, nextBtn(mi, si));
  }
  show();
  if(done[skey(mi,si)]){
    const b = nextBtn(mi, si, "Skip (already completed) →");
    footNav(navHolder, mi, si, b);
  }
}

const WASTES = ["Defects","Overproduction","Waiting","Non-utilized talent","Transportation","Inventory","Motion","Extra-processing"];
function rForm(card, sc, mi, si){
  card.insertAdjacentHTML("beforeend", `<h3>${esc(sc.h)}</h3>
   <p>Facts, not blame. Observations, not solutions — the optional idea at the end is a hypothesis, not a demand.</p>`);
  const f=document.createElement("div");
  const val = k => drafts[k]||"";
  f.innerHTML = `
   <label class="f" for="sw_name">Your name</label>
   <input type="text" id="sw_name" value="${esc(val("sw_name"))}">
   <label class="f" for="sw_where">1 · Where <small>Which process, and where does it happen?</small></label>
   <input type="text" id="sw_where" value="${esc(val("sw_where"))}">
   <label class="f" for="sw_obs">2 · What I observed <small>What you'd see on video. At least two sentences. No blame, no causes, no solutions. Self-check: would everyone involved agree this is fair?</small></label>
   <textarea id="sw_obs" rows="4">${esc(val("sw_obs"))}</textarea>
   <label class="f">3 · Which waste(s)? <small>Check all that apply — many observations contain two or three.</small></label>
   <div class="checks" id="sw_wastes"></div>
   <label class="f" for="sw_who">4 · Who does it affect, and how? <small>The customer of that step — internal counts — and what they experience.</small></label>
   <textarea id="sw_who" rows="2">${esc(val("sw_who"))}</textarea>
   <label class="f" for="sw_size">5 · Rough size <small>Optional. “~5 times a day, ~10 minutes each” is plenty.</small></label>
   <input type="text" id="sw_size" value="${esc(val("sw_size"))}">
   <label class="f" for="sw_idea">6 · An idea <small>Optional, one sentence: “I wonder if ___ would help.”</small></label>
   <input type="text" id="sw_idea" value="${esc(val("sw_idea"))}">`;
  card.appendChild(f);
  const wz = f.querySelector("#sw_wastes");
  const chosen = new Set(drafts.sw_wastes || []);
  WASTES.forEach(w=>{
    const l=document.createElement("label");
    const c=document.createElement("input"); c.type="checkbox"; c.id="sw_w_"+w.replace(/\W/g,"");
    c.checked = chosen.has(w);
    c.addEventListener("change",()=>{ c.checked?chosen.add(w):chosen.delete(w); drafts.sw_wastes=[...chosen]; save(); });
    l.appendChild(c); l.appendChild(document.createTextNode(w)); wz.appendChild(l);
  });
  ["sw_name","sw_where","sw_obs","sw_who","sw_size","sw_idea"].forEach(id=>{
    f.querySelector("#"+id).addEventListener("input",e=>{ drafts[id]=e.target.value; save(); });
  });
  const msg=document.createElement("div"); card.appendChild(msg);
  const sub=document.createElement("button"); sub.className="btn"; sub.textContent="Submit observation";
  sub.addEventListener("click",()=>{
    const errs=[];
    if(!(drafts.sw_where||"").trim()) errs.push("Where is required.");
    const obs=(drafts.sw_obs||"").trim();
    if(obs.split(/[.!?]+/).filter(s=>s.trim().length>3).length < 2) errs.push("The observation needs at least two sentences of facts.");
    if(!(drafts.sw_wastes||[]).length) errs.push("Name at least one waste from DOWNTIME.");
    if(!(drafts.sw_who||"").trim()) errs.push("Say who it affects.");
    msg.innerHTML="";
    if(errs.length){
      const w=document.createElement("div"); w.className="why bad";
      w.innerHTML="<b>Not quite ready:</b><br>"+errs.map(esc).join("<br>");
      msg.appendChild(w);
      return;
    }
    const first = !drafts.sw_submitted;
    drafts.sw_submitted = true; done[skey(mi,si)]=true; save(); renderNav();
    const ok=document.createElement("div"); ok.className="why good";
    ok.innerHTML="<b>Submitted.</b> In the full course this flows to your organization's observation gallery — the start of a crowd-sourced problem inventory. Here it stays on your device.";
    msg.appendChild(ok);
    if(first) nav.appendChild(nextBtn(mi, si, "Finish → Knowledge Check"));
  });
  const nav = footNav(card, mi, si);
  nav.appendChild(sub);
  if(done[skey(mi,si)]) nav.appendChild(nextBtn(mi, si, "Finish → Knowledge Check"));
}

/* ---------- knowledge check ---------- */
let kcRun = null; // {qs:[indices], idx, answers:[]}
function drawKC(){
  const idxs=[...KC.keys()];
  for(let i=idxs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idxs[i],idxs[j]]=[idxs[j],idxs[i]]; }
  return idxs.slice(0,20);
}
function rKC(){
  const card=document.createElement("div"); card.className="card";
  const head=document.createElement("div"); head.className="screenhead";
  head.innerHTML=`<span class="eyebrow">Knowledge Check</span><span class="count">20 questions · pass 70%</span>`;
  main.appendChild(head); main.appendChild(card);

  if(!kcRun){
    card.innerHTML=`<h3>Knowledge Check</h3>
     <p>Twenty questions drawn at random from the item bank. <strong>70% (14/20) passes.</strong> Explanations are shown after you finish, not during — and retakes draw a fresh set, so there's nothing to lose by attempting.</p>
     ${kcState.attempts?`<p class="kv">Attempts so far: ${kcState.attempts} · best score: ${kcState.best}/20 ${kcState.passed?"· PASSED":""}</p>`:""}
     <p>${screensDone()<screensTotal()?"You have modules still open — you can attempt now, but finishing them first is the better bet.":"All modules complete. Good luck — you won't need it."}</p>`;
    const b=document.createElement("button"); b.className="btn";
    b.textContent = kcState.attempts? "Start a new attempt" : "Start the knowledge check";
    b.addEventListener("click",()=>{ kcRun={qs:drawKC(), idx:0, answers:[]}; render(); window.scrollTo({top:0}); });
    card.appendChild(b);
    if(kcState.passed){ card.appendChild(badgeEl()); }
    return;
  }
  if(kcRun.idx < kcRun.qs.length){
    const it = KC[kcRun.qs[kcRun.idx]];
    card.innerHTML=`<div class="scorechip">Question ${kcRun.idx+1} / 20</div><p class="qtext">${esc(it.q)}</p>`;
    const opts=document.createElement("div"); opts.className="opts";
    it.o.forEach((o,oi)=>{
      const b=document.createElement("button"); b.className="opt"; b.textContent=o;
      b.addEventListener("click",()=>{
        kcRun.answers.push(oi); kcRun.idx++;
        render(); window.scrollTo({top:0});
      });
      opts.appendChild(b);
    });
    card.appendChild(opts);
    return;
  }
  // results
  let right=0;
  kcRun.qs.forEach((qi,i)=>{ if(kcRun.answers[i]===KC[qi].a) right++; });
  const passed = right>=14;
  if(!kcRun.finished){
    kcRun.finished = true;
    kcState.attempts++; kcState.best=Math.max(kcState.best,right);
    if(passed) kcState.passed=true;
    save(); renderNav();
  }
  card.innerHTML=`<h3>Result</h3>
    <p><span class="kcscore">${right}/20</span><span class="passpill ${passed?"ok":"no"}">${passed?"Pass":"Not yet"}</span></p>
    <p>${passed? "That clears the 70% bar." : "70% (14/20) passes — review below, then take a fresh draw. Unlimited retakes."}</p>`;
  if(passed && !(drafts.sw_submitted)){
    card.insertAdjacentHTML("beforeend",`<div class="note"><span class="dot"></span><span>One gate left: submit your <b>See a Waste</b> field exercise (Module 12) to earn the badge.</span></div>`);
  }
  if(passed && drafts.sw_submitted){ card.appendChild(badgeEl()); }
  const rv=document.createElement("div"); rv.className="review";
  kcRun.qs.forEach((qi,i)=>{
    const it=KC[qi], ok = kcRun.answers[i]===it.a;
    const d=document.createElement("div"); d.className="rv";
    d.innerHTML=`<div class="q"><span class="tag ${ok?"ok":"no"}">${ok?"RIGHT":"MISS"}</span>${esc(it.q)}</div>
      ${ok?"":`<div>Your answer: ${esc(it.o[kcRun.answers[i]])}</div>`}
      <div>Correct: <strong>${esc(it.o[it.a])}</strong> — ${esc(it.w)}</div>`;
    rv.appendChild(d);
  });
  card.appendChild(rv);
  const again=document.createElement("button"); again.className="btn sec"; again.textContent="Take a fresh attempt";
  again.style.marginTop="16px";
  again.addEventListener("click",()=>{ kcRun={qs:drawKC(), idx:0, answers:[]}; render(); window.scrollTo({top:0}); });
  card.appendChild(again);
}
function badgeEl(){
  const d=document.createElement("div"); d.className="badge";
  const nm=(drafts.sw_name||"").trim();
  d.innerHTML=`<div class="ring">W</div><h4>${nm?esc(nm):"Certified"} · White Belt</h4>
   <p>Foundations of Operational Excellence<br>Knowledge check passed · field exercise submitted</p>`;
  return d;
}

/* ---------- master render ---------- */
function render(){
  renderNav();
  main.innerHTML="";
  if(cur.m===M.length){ rKC(); addProtoNote(); return; }
  const m=M[cur.m], sc=m.screens[cur.s];
  const head=document.createElement("div"); head.className="screenhead";
  head.innerHTML=`<span class="eyebrow">Module ${String(m.n).padStart(2,"0")} · ${esc(sc.label)}</span>
    <span class="count">${esc(m.t)} · screen ${cur.s+1}/${m.screens.length} · ${esc(m.time)}</span>`;
  main.appendChild(head);
  const card=document.createElement("div"); card.className="card";
  main.appendChild(card);
  ({les:rLesson, quiz:rQuiz, classify:rClassify, reflect:rReflect, form:rForm})[sc.k](card, sc, cur.m, cur.s);
  addProtoNote();
}
function addProtoNote(){
  const p=document.createElement("p"); p.className="protonote";
  p.textContent="Interactive prototype. In the production course, spot-the-waste video walkthroughs, narration, vertical variants (manufacturing / healthcare / transactional), and LMS-tracked submission replace the simplified exercises shown here. Progress is saved on this device only.";
  main.appendChild(p);
}
render();
</script>
