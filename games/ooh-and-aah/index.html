<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ooh × Aah</title>
<style>
/* ==== base.css ==== */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap');

/* ============================================================
   Ooh × Aah — base layer (lead-owned; see CONTRACT.md)
   Tokens (spec §8.5, §4.1), reset, type, the #app frame and
   shared primitives. Module CSS scopes under its own containers
   and never redefines tokens.
   One deliberate night look: the same palette is repeated for
   the dark-scheme selectors so the viewer's theme never flips it.
============================================================ */
:root{
  --bg:#070A18; --sky-top:#0B1026; --sky-horizon:#1B1440; --ink:#05070F;
  --wood:#3A2A1C; --wood-hi:#5A4330; --brass:#C9A227;
  --paper:#F4EFE6; --paper-dim:#B9B2C7; --line:#2A2F4A;
  --ooh:#FFFFFF; --ooh-bg:rgba(255,255,255,.12); --aah:#F2C14E; --x-ring:#56B4E9;
  --danger:#F07560; --ok:#7BD389; --focus:#FFD166; /* danger lifted from spec #E0533D to reach 4.5:1 on every surface */
  --surface:rgba(11,16,38,.86); --surface-2:rgba(27,20,64,.92); --scrim:rgba(3,5,12,.72);
  /* colour language (§4.1): shape + colour + pictogram + monogram */
  --c-R:#D55E00; --c-A:#E69F00; --c-G:#009E73; --c-B:#56B4E9; --c-W:#F0F0F0; --c-fusion:#CC79A7;
  /* type */
  --f-display:'Fraunces',Georgia,'Times New Roman',serif;
  --f-ui:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --t-xs:16px; --t-s:16px; --t-m:18px; --t-l:22px; --t-xl:28px; --t-xxl:40px;
  /* geometry */
  --gutter:16px; --gap:4px; --tap:44px; --radius:10px; --radius-s:6px;
  --col-w:480px; --board-w:320px; --log-w:360px;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-back:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070A18; --sky-top:#0B1026; --sky-horizon:#1B1440; --ink:#05070F;
    --wood:#3A2A1C; --wood-hi:#5A4330; --brass:#C9A227;
    --paper:#F4EFE6; --paper-dim:#B9B2C7; --line:#2A2F4A;
    --ooh:#FFFFFF; --aah:#F2C14E; --danger:#F07560; --ok:#7BD389; --focus:#FFD166;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070A18; --sky-top:#0B1026; --sky-horizon:#1B1440; --ink:#05070F;
  --wood:#3A2A1C; --wood-hi:#5A4330; --brass:#C9A227;
  --paper:#F4EFE6; --paper-dim:#B9B2C7; --line:#2A2F4A;
  --ooh:#FFFFFF; --aah:#F2C14E; --danger:#F07560; --ok:#7BD389; --focus:#FFD166;
  color-scheme:dark;
}
:root[data-contrast="high"]{
  --bg:#000000; --sky-top:#000000; --sky-horizon:#0A0A0A; --ink:#000000;
  --wood:#1A1A1A; --wood-hi:#FFFFFF; --brass:#FFD166;
  --paper:#FFFFFF; --paper-dim:#E6E6E6; --line:#FFFFFF;
  --aah:#FFD166; --x-ring:#8AD7FF; --danger:#FF6B5E; --ok:#8CFF9E;
  --surface:#000000; --surface-2:#0A0A0A; --scrim:rgba(0,0,0,.9);
  --c-R:#FF7A33; --c-A:#FFC23D; --c-G:#22D3A6; --c-B:#8AD7FF; --c-W:#FFFFFF; --c-fusion:#F29BD4;
}

/* ---------- reset ---------- */
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--paper);overflow:hidden}
body{font:400 var(--t-s)/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:var(--radius-s)}
.num{font-variant-numeric:tabular-nums}

/* ---------- the #app frame ---------- */
#app{position:relative;height:100%;width:100%;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-horizon) 100%);
  display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#play{position:relative;width:min(100%,var(--col-w));height:100%;min-height:0;padding-inline:var(--gutter);
  display:grid;gap:var(--gap)}
#board,#showlog{display:none}
#backdrop{display:none}
@media (min-width:1200px){
  /* 320 + 480 + 360 = 1160; the gaps shrink so 1200–1207 px never overflows */
  #app{grid-template-columns:var(--board-w) var(--col-w) var(--log-w);justify-content:center;column-gap:clamp(0px,(100vw - 1160px)/2,24px)}
  #board,#showlog{display:block;position:relative;height:100%;min-height:0;overflow:auto;padding-block:24px}
  #backdrop{display:block;position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.35}
}

/* ---------- shared primitives ---------- */
.btn{min-height:var(--tap);min-width:var(--tap);padding:10px 16px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--surface-2);color:var(--paper);
  font:700 var(--t-s)/1.1 var(--f-ui);letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--paper-dim)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:default}
.btn-primary{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-danger{border-color:var(--danger);color:var(--danger);background:transparent}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:2px 8px;border-radius:999px;
  font:700 var(--t-xs)/1 var(--f-ui);font-variant-numeric:tabular-nums;background:var(--ooh-bg);color:var(--ooh)}
.chip-aah{color:var(--aah);background:rgba(242,193,78,.14)}
.chip-x{color:var(--aah);box-shadow:inset 0 0 0 2px var(--x-ring);background:transparent}
.chip-fusion{color:var(--c-fusion);background:rgba(204,121,167,.16)}
.chip-danger{color:var(--danger);background:rgba(224,83,61,.14)}
.card-surface{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.display{font-family:var(--f-display);font-weight:600;font-optical-sizing:auto}
.display-italic{font-family:var(--f-display);font-style:italic;font-weight:700}

/* overlays and sheets (GAME.open/close toggle [hidden]) */
.overlay{position:absolute;inset:0;z-index:40;background:var(--scrim);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto}
.overlay > .panel{width:min(100%,560px);max-height:100%;overflow:auto;background:var(--surface-2);
  border:1px solid var(--line);border-radius:14px;padding:20px 16px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:45;margin-inline:auto;width:min(100%,var(--col-w));
  max-height:70%;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-bottom:0;
  border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.panel h2,.sheet h2{font:600 var(--t-l)/1.15 var(--f-display);margin:0 0 12px;text-wrap:balance}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
}
:root[data-motion="reduced"] *,:root[data-motion="reduced"] *::before,:root[data-motion="reduced"] *::after{
  animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
/* ==== play.css ==== */
/* ============================================================
   play.css — the play column (UI_PLAY). Spec §8.1, §8.4, §8.5, §13.
   Scoped under #play and #inspect; uses base.css tokens only.
   Row heights live in custom properties on #play and switch with
   #play[data-mode] (regular ≥700 · compact <700 · scroll <520).
============================================================ */

/* ---------- 1. The column: a flex column so hidden rows (Sponsor, Workshop) take no space or gap ---------- */
#play{display:flex;flex-direction:column;gap:var(--gap);overflow:hidden;--pad-top:8px;padding-top:var(--pad-top); /* room for the HUD buttons' 44 px hit areas, which overhang their 32 px row */
  --h-hud:60px;--h-sponsor:40px;--h-rack:132px;--h-tools:52px;--h-shop:124px;--h-ws:48px;--h-fire:56px;
  --tok-h:60px;--rig-h:16px;--sky-min:140px;--rows:1}
#play[data-mode="compact"],#play[data-mode="scroll"]{
  --h-hud:44px;--h-rack:120px;--h-tools:48px;--h-shop:96px;--h-ws:44px;--h-fire:48px;--tok-h:56px;--rig-h:14px;--sky-min:96px}
#play > *{flex:0 0 auto;min-width:0}
#play > #hud{height:var(--h-hud)}
#play > #sponsor{height:var(--h-sponsor)}
#play > #sky-wrap{flex:1 1 0;min-height:var(--sky-min)}
#play > #rack{height:calc(var(--h-rack) + (var(--rows) - 1) * 18px)}
#play > #tools{height:var(--h-tools)}
#play > #shop{height:var(--h-shop)}
#play > #workshop{height:var(--h-ws)}
#play > #firebar{height:var(--h-fire)}

/* Desktop: the centre column lines up with the side panels (base.css gives them 24 px of block padding) */
@media (min-width:1200px){#play{--pad-top:18px;padding-block:var(--pad-top) 20px}}

/* Compact: the Sponsor offer overlays the sky's top edge instead of taking a row */
#play[data-mode="compact"] > #sponsor,#play[data-mode="scroll"] > #sponsor{position:absolute;z-index:6;
  top:calc(var(--pad-top,0px) + var(--h-hud) + var(--gap));left:var(--gutter);right:var(--gutter)}
/* Compact with scroll (<520): the column scrolls and the fire row sticks, so Light the fuse is never clipped */
#play[data-mode="scroll"]{overflow-y:auto;overscroll-behavior:contain}
#play[data-mode="scroll"] > #sky-wrap{flex:0 0 var(--sky-min)}
#play[data-mode="scroll"] > #firebar{position:sticky;bottom:0;z-index:8;padding-top:4px;
  background:linear-gradient(180deg,transparent,var(--sky-horizon) 30%)}

/* RESOLVING: shop, workshop and tools step down and dim (240 ms) while the show plays. Their rows keep their space, so
   the rack and the sky never move: no layout shift at the light or at the slam (transform and opacity only). */
#play > #tools,#play > #shop,#play > #workshop,#play > #sponsor{
  transition:opacity .2s linear,transform .24s var(--ease-out)}
#app[data-ui="RESOLVING"] #play > :is(#tools,#shop,#workshop){opacity:.28;transform:translateY(10px);pointer-events:none}
#app[data-ui="RESOLVING"] #play > #sponsor{opacity:0;pointer-events:none}
#app[data-ui="END"] #play > :is(#shop,#workshop){opacity:.5}

/* ---------- 2. HUD: Regular two rows / Compact one row ---------- */
/* Nothing clips at 360 px: UI_PLAY.fitHud raises #hud[data-fit] until "Festival · Show" fits —
   1 the show name folds into pips · 2 Crowd drops to Row B (full name) · 3 Row B + pips · 4 festival name only.
   The umbrella and pause sit in 34 px columns; their ::before makes each hit area 44 × 44 without overlapping. */
#hud{display:grid;align-items:center;column-gap:10px;min-width:0;
  grid-template-columns:minmax(0,1fr) auto auto 34px 34px;grid-template-rows:32px 28px;
  grid-template-areas:"title coins crowd rain pause" "tgt tgt tgt rain pause"}
#hud:is([data-fit="2"],[data-fit="3"],[data-fit="4"]){grid-template-columns:minmax(0,1fr) auto 34px 34px;
  grid-template-areas:"title coins rain pause" "tgt crowd rain pause"}
#hud:is([data-fit="2"],[data-fit="3"],[data-fit="4"]) :is(.hud-coins,.hud-crowd){justify-self:end}
#hud .hud-title{grid-area:title;min-width:0}
#hud-show{display:block;position:relative;font:600 18px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variation-settings:"opsz" 36}
#hud-show .hs-pips{display:none;align-items:center;gap:4px;margin-left:8px;vertical-align:1px}
#hud:is([data-fit="1"],[data-fit="3"]) #hud-show .hs-pips{display:inline-flex}
#hud:is([data-fit="1"],[data-fit="3"],[data-fit="4"]) #hud-show .hs-slot{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#hud-show .hs-pips i{display:block;width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--paper-dim)}
#hud-show .hs-pips i.done{background:var(--paper-dim);box-shadow:none}
#hud-show .hs-pips i.now{background:var(--aah);box-shadow:0 0 0 3px rgba(242,193,78,.22)}
#hud-show .hs-pips i.hl{width:14px;height:14px;border-radius:0;background:none;box-shadow:none;color:var(--paper-dim)}
#hud-show .hs-pips i.hl.now{color:var(--aah);filter:drop-shadow(0 0 4px rgba(242,193,78,.55))}
#hud-show .hs-pips .ic{display:block;width:14px;height:14px}
#hud .hud-tgt{grid-area:tgt;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow-x:clip;overflow-y:visible}
/* Narrow target block (compact HUD at 360 px): the word "Target" gives way to a ◎ glyph so the
   Headliner button keeps its full 44 px instead of being clipped. The word stays for screen readers. */
#hud .hud-tgt{container-type:inline-size}
#hud .tgt-g{display:none;margin-right:3px;color:var(--paper-dim)}
@container (max-width: 160px){
  #hud .tgt-w{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  #hud .tgt-g{display:inline}
}
#hud .hud-tgt > *{flex:none}
#hud .hud-tgt:is([data-fit="1"],[data-fit="2"],[data-fit="3"]) .hh-name{display:none}
#hud .hud-tgt:is([data-fit="1"],[data-fit="2"],[data-fit="3"]) .hh-pill{padding:0 9px}
#hud .hud-tgt:is([data-fit="2"],[data-fit="3"]) .nx2{display:none}
#hud .hud-tgt[data-fit="3"] .hud-next{display:none}
#hud-target{font:400 16px/1 var(--f-ui);color:var(--paper-dim)}
#hud-target b{font:600 20px/1 var(--f-display);color:var(--paper);margin-left:2px}
#hud .hud-next{font:400 16px/1 var(--f-ui);color:var(--paper-dim);font-variant-numeric:tabular-nums}
#hud .hud-next .crown{width:14px;height:14px;vertical-align:-1px;margin-left:1px;fill:var(--aah)}
/* the Headliner chip: the button is the 44 × 44 hit area, the pill inside it is the visual */
#hud .hud-head{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;margin:-8px 0;padding:0;
  border:0;border-radius:14px;background:none;color:var(--paper);font:700 16px/1 var(--f-ui)}
#hud .hh-pill{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:36px;height:26px;padding:0 10px 0 6px;
  border-radius:999px;border:1px solid rgba(201,162,39,.55);background:rgba(201,162,39,.12)}
#hud .hud-head .ic{width:16px;height:16px}
#hud .hud-head.now .hh-pill{background:var(--brass);color:var(--ink);border-color:var(--brass)}
#hud .hud-coins{grid-area:coins}
#hud .hud-crowd{grid-area:crowd;display:flex;align-items:center;gap:4px}
#hud :is(.hud-coins,.hud-crowd){position:relative;min-width:44px;min-height:44px;margin:-8px 0;padding:0 2px;border:0;border-radius:10px;background:transparent;
  justify-content:center;text-align:center;
  color:inherit;font:inherit;cursor:pointer}
#hud :is(.hud-coins,.hud-crowd):hover{background:rgba(255,255,255,.06)}
#hud-coins,#hud-crowd{font:600 20px/1 var(--f-display);font-variant-numeric:tabular-nums}
#hud-coins{color:var(--aah)}
#hud .hud-crowd > .ic{width:20px;height:20px;color:var(--paper-dim)}
#hud .hud-half{font:700 16px/1 var(--f-ui);color:var(--danger);margin-left:2px}
#hud .hud-ic{position:relative;width:34px;height:44px;padding:0;border:0;border-radius:10px;background:transparent;
  color:var(--paper);display:grid;place-items:center}
#hud .hud-ic::before{content:"";position:absolute;inset:0 -5px}
#hud .hud-rain{grid-area:rain}
#hud .hud-pause{grid-area:pause}
#hud .hud-ic:hover{background:rgba(255,255,255,.06)}
#hud .hud-ic .ic{width:24px;height:24px}
#hud .hud-rain[data-state="used"]{color:var(--danger)}
#hud .hud-rain[data-state="none"]{color:var(--paper-dim);opacity:.55}
#hud .hud-rain .fw{position:absolute;right:-4px;bottom:2px;font:700 16px/1 var(--f-ui);color:var(--ok);letter-spacing:-.04em;transform:scale(.72);transform-origin:right bottom}
#play[data-mode="compact"] #hud,#play[data-mode="scroll"] #hud{grid-template-columns:34px minmax(0,1fr) auto auto 34px;
  grid-template-rows:44px;grid-template-areas:"pause tgt coins crowd rain";column-gap:10px}
#play[data-mode="compact"] #hud .hud-title,#play[data-mode="scroll"] #hud .hud-title{display:none}
#play[data-mode="compact"] #hud .hh-pill,#play[data-mode="scroll"] #hud .hh-pill{padding:0 5px;height:24px}
#play[data-mode="compact"] #hud .hh-name,#play[data-mode="scroll"] #hud .hh-name,
#play[data-mode="compact"] #hud .nx2,#play[data-mode="scroll"] #hud .nx2{display:none}

/* ---------- 3. Sponsor toggle (a 40 px strip with a 44 px hit area) ---------- */
/* the button is the 44 px hit area; its ::before paints the 40 px strip */
#sponsor .sp-toggle{position:relative;isolation:isolate;width:100%;height:44px;margin:-2px 0;display:flex;align-items:center;gap:10px;
  padding:0 7px 0 13px;border:0;border-radius:10px;background:none;color:var(--paper);font:400 16px/1 var(--f-ui);text-align:left}
#sponsor .sp-toggle::before{content:"";position:absolute;inset:2px 0;z-index:-1;border-radius:10px;border:1px solid rgba(201,162,39,.6);
  background:linear-gradient(90deg,rgba(201,162,39,.16),rgba(11,16,38,.9) 70%)}
#sponsor .sp-toggle:focus-visible{outline-offset:0}
#sponsor .sp-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sponsor .sp-text b{font-weight:700}
#sponsor:not([data-fit="0"]) .sp-text{display:flex;flex-direction:column;justify-content:center;line-height:18px}
#sponsor:not([data-fit="0"]) :is(.sp-l1,.sp-l2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sponsor:not([data-fit="0"]) .sp-dot{display:none}
#sponsor .sp-l2{color:var(--paper-dim)}
#sponsor:is([data-fit="2"],[data-fit="3"]) .sp-p,#sponsor[data-fit="3"] .sp-x{display:none}
#sponsor .sp-switch{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 4px;border-radius:999px;
  background:rgba(5,7,15,.6);border:1px solid var(--line);font:700 16px/1 var(--f-ui);flex:none}
#sponsor .sp-knob{width:22px;height:22px;border-radius:50%;background:var(--paper-dim);transition:transform .18s var(--ease-out)}
#sponsor [aria-pressed="true"] .sp-switch{background:var(--brass);border-color:var(--brass);color:var(--ink)}
#sponsor [aria-pressed="true"] .sp-knob{background:var(--ink);box-shadow:inset 0 0 0 5px var(--paper)}
#sponsor [aria-pressed="true"]::before{border-color:var(--brass);background:linear-gradient(90deg,rgba(201,162,39,.32),rgba(11,16,38,.92) 75%)}

/* ---------- 4. Sky and its DOM overlay ---------- */
#sky-wrap{position:relative;margin-inline:calc(-1 * var(--gutter));overflow:hidden;container:sky / size;
  background:radial-gradient(120% 55% at 50% 112%,rgba(255,176,96,.10),transparent 62%)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
#sky-overlay{position:absolute;inset:0;pointer-events:none;padding:8px var(--gutter);color:var(--paper)}
#sky-overlay button{pointer-events:auto}
#sky-overlay .sky-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;max-width:calc(100% - 24px)}
#sky-overlay .sky-label{min-width:0;max-width:100%}
#sky-overlay .sky-label:empty{display:none}
#app[data-ui="RESOLVING"] #sky-overlay .sky-top{visibility:hidden} /* the live readout owns the top of the sky */
#sky-overlay .sky-label #hud-show{font-size:18px;line-height:28px;padding:0 10px;border-radius:14px;background:rgba(5,7,15,.55);
  text-shadow:0 1px 2px #000}
#play[data-sponsor][data-mode="compact"] #sky-overlay,#play[data-sponsor][data-mode="scroll"] #sky-overlay{padding-top:48px}
#sky-overlay .rh-pill{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:30px;max-width:100%;padding:3px 14px 3px 8px;
  border-radius:16px;background:rgba(5,7,15,.8);border:1px solid rgba(201,162,39,.55);color:var(--paper);font:700 16px/1.2 var(--f-ui);text-align:left}
#sky-overlay .rh-pill::before{content:"";position:absolute;inset:-7px -2px}
#sky-overlay .rh-pill span{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#sky-overlay .rh-pill .ic{width:18px;height:18px;flex:none;color:var(--aah)}
#sky-overlay .rh-pill[data-mood="eager"]{border-color:var(--ok)}
#sky-overlay .rh-pill[data-mood="restless"]{border-color:var(--danger)}
#sky-overlay .lastchance{position:absolute;left:50%;top:44px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 40px);
  text-align:center;font:italic 700 18px/1.2 var(--f-display);color:var(--danger);background:rgba(5,7,15,.72);padding:5px 14px;border-radius:16px;
  border:1px solid var(--danger)}

/* the live readout: OOH 145 × AAH 19.5 */
#sky-overlay .readout{position:absolute;left:0;right:0;top:10px;display:flex;justify-content:center;align-items:baseline;gap:10px;
  font:700 16px/1 var(--f-ui);letter-spacing:.08em;text-shadow:0 1px 2px #000,0 0 12px rgba(0,0,0,.85)}
#sky-overlay .readout b{display:inline-block;font:italic 700 26px/1 var(--f-display);letter-spacing:0;margin-left:4px;font-variant-numeric:tabular-nums}
#sky-overlay .ro-o{color:var(--ooh)}
#sky-overlay .ro-o b,#sky-overlay .ro-a b{min-width:4.6ch} /* digits are tabular: fixed boxes keep the readout still as it counts */
#sky-overlay .ro-o b{text-align:right}
#sky-overlay .ro-a{color:var(--aah)}
#sky-overlay .ro-x{font:italic 700 22px/1 var(--f-display);color:var(--paper-dim)}
#sky-overlay .ro-cap{font:700 16px/1 var(--f-ui);letter-spacing:0;color:var(--danger);border:1px solid var(--danger);border-radius:6px;padding:2px 6px}
#sky-overlay .punch{animation:ui-punch .09s ease-out}
#sky-overlay .punch-big{animation:ui-punch-big .16s var(--ease-back)}
@keyframes ui-punch{50%{transform:scale(1.15)}}
@keyframes ui-punch-big{45%{transform:scale(1.3)}}

/* the result card, pinned after the slam until the first build action. It sits in a box that starts below the sky's
   top furniture (the rule pill, or the compact Sponsor strip) and ends 6 px above the rack; UI_PLAY.fitResult raises
   .result[data-fit] until the card fits that box (see there), so no row is ever cut or hidden under the Sponsor. */
#sky-overlay .result{position:absolute;left:0;right:0;top:calc(var(--res-top,44px) + var(--sp-pad,0px));bottom:6px;
  display:flex;align-items:center;justify-content:center;pointer-events:none}
#play[data-sponsor]:is([data-mode="compact"],[data-mode="scroll"]) #sky-overlay .result{--sp-pad:48px}
#play[data-res-cover][data-res-cover] #sky-overlay .result{--sp-pad:0px;--res-top:6px;align-items:flex-start;z-index:7}
#play[data-res-cover]:is([data-mode="compact"],[data-mode="scroll"]) > #sponsor{visibility:hidden}
#sky-overlay .res-card{pointer-events:auto;flex:none;width:min(320px,calc(100% - 40px));text-align:center;padding:8px 14px 10px;border-radius:14px;
  background:rgba(7,10,24,.86);border:1px solid var(--line);border-top:3px solid var(--ok);box-shadow:0 12px 40px rgba(0,0,0,.5);
  animation:ui-rise .28s var(--ease-out)}
#sky-overlay .res-card[data-pass="0"]{border-top-color:var(--danger)}
#sky-overlay .res-head{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px 8px;font:700 16px/1.2 var(--f-ui)}
#sky-overlay .res-verdict{color:var(--ok)}
#sky-overlay [data-pass="0"] .res-verdict{color:var(--danger)}
#sky-overlay .res-encore{font:italic 700 18px/1 var(--f-display);color:var(--ink);background:var(--aah);padding:2px 10px;border-radius:999px}
#sky-overlay .res-app{display:block;margin:2px auto 0;min-height:44px;padding:0 10px;border:0;border-radius:10px;background:transparent;
  color:var(--paper);font:italic 700 44px/1 var(--f-display);font-variant-numeric:tabular-nums;
  text-decoration:underline dotted rgba(244,239,230,.35);text-decoration-thickness:2px;text-underline-offset:6px}
#sky-overlay .res-app:hover{text-decoration-color:var(--aah)}
#sky-overlay .res-eq{font:400 16px/1.3 var(--f-ui);color:var(--paper-dim)}
#sky-overlay .res-vs{white-space:nowrap}
#sky-overlay .res-rain{margin:4px 0 0;font:700 16px/20px var(--f-ui);color:#FF9A88}
#sky-overlay .res-pay{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px}
#sky-overlay .res-pay li{font:700 16px/1 var(--f-ui);padding:4px 8px;border-radius:999px;background:rgba(242,193,78,.14);color:var(--aah);font-variant-numeric:tabular-nums;white-space:nowrap}
#sky-overlay .res-pay li.p-crowd{background:var(--ooh-bg);color:var(--ooh)}
#sky-overlay .res-tot{display:none;margin:0;font:700 16px/20px var(--f-ui);color:var(--aah);white-space:nowrap}
@keyframes ui-rise{from{opacity:0;translate:0 10px}} /* translate composes with each element's own transform; text never scales */
@container sky (max-height: 230px){
  #sky-overlay .result{--res-top:6px;align-items:flex-start}
  #sky-wrap.has-result .sky-top{visibility:hidden}
}
@container sky (max-height: 170px){
  #sky-wrap.has-info .sky-top{visibility:hidden}
}
/* fit 1: a smaller Applause */
#sky-overlay .result:not([data-fit="0"]) .res-app{font-size:34px}
#sky-overlay .result:not([data-fit="0"]) .res-card{padding:6px 12px 8px}
/* fit 2+: Applause beside the verdict and the Ooh × Aah line; the rest below at full width */
#sky-overlay .result:is([data-fit="2"],[data-fit="3"],[data-fit="4"],[data-fit="5"],[data-fit="6"]) .res-card{display:grid;
  grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:10px;text-align:left;padding:4px 10px 6px}
#sky-overlay .result:is([data-fit="2"],[data-fit="3"],[data-fit="4"],[data-fit="5"],[data-fit="6"]) .res-head{grid-column:2;justify-content:flex-start}
#sky-overlay .result:is([data-fit="2"],[data-fit="3"],[data-fit="4"],[data-fit="5"],[data-fit="6"]) .res-app{grid-column:1;grid-row:1 / span 2;font-size:30px;margin:0;padding:0 4px}
#sky-overlay .result:is([data-fit="2"],[data-fit="3"],[data-fit="4"],[data-fit="5"],[data-fit="6"]) :is(.res-eq,.res-tot){grid-column:2}
#sky-overlay .result:is([data-fit="2"],[data-fit="3"],[data-fit="4"],[data-fit="5"],[data-fit="6"]) :is(.res-rain,.res-pay){grid-column:1 / -1}
#sky-overlay .result:is([data-fit="2"],[data-fit="3"],[data-fit="4"],[data-fit="5"],[data-fit="6"]) .res-pay{justify-content:flex-start;margin-top:4px}
/* fit 3+: no "· target", tighter payout chips */
#sky-overlay .result:is([data-fit="3"],[data-fit="4"],[data-fit="5"],[data-fit="6"]) .res-vs{display:none}
#sky-overlay .result:is([data-fit="3"],[data-fit="4"],[data-fit="5"],[data-fit="6"]) .res-pay{gap:2px 4px}
#sky-overlay .result:is([data-fit="3"],[data-fit="4"],[data-fit="5"],[data-fit="6"]) .res-pay li{padding:2px 6px}
/* fit 4+: the payout as totals beside the Applause */
#sky-overlay .result:is([data-fit="4"],[data-fit="5"],[data-fit="6"]) .res-pay{display:none}
#sky-overlay .result:is([data-fit="4"],[data-fit="5"],[data-fit="6"]) .res-tot{display:block}
/* fit 5+: no Ooh × Aah line (the show log has it) */
#sky-overlay .result:is([data-fit="5"],[data-fit="6"]) .res-eq{display:none}
#sky-overlay .result:is([data-fit="5"],[data-fit="6"]) .res-card{padding:1px 10px 2px}
#sky-overlay .result:is([data-fit="5"],[data-fit="6"]) :is(.res-head,.res-rain,.res-tot){line-height:18px}
#sky-overlay .result:is([data-fit="5"],[data-fit="6"]) .res-rain{grid-column:2;margin:0}
#sky-overlay .res-tot .tot-x{display:none;font-style:italic}
#sky-overlay .result:is([data-fit="5"],[data-fit="6"]) .res-card:has(.tot-x) .res-head .enc{display:none}
#sky-overlay .result:is([data-fit="5"],[data-fit="6"]) .res-tot .tot-x{display:inline}

/* the docked info card (selection), the fallback tip, the cheer meter */
#sky-overlay .info{position:absolute;left:8px;right:8px;bottom:8px;height:68px;display:flex;align-items:center;gap:6px;
  padding:4px 4px 4px 12px;border-radius:12px;background:rgba(11,16,38,.93);border:1px solid var(--line);pointer-events:auto;
  box-shadow:0 -6px 24px rgba(0,0,0,.35);animation:ui-rise .16s var(--ease-out)}
#sky-overlay .info-body{flex:1;min-width:0}
#sky-overlay .info p{margin:0;font:400 16px/20px var(--f-ui)}
#sky-overlay .info-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--paper-dim)}
#sky-overlay .info-t b{color:var(--paper)}
#sky-overlay .info-x{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sky-overlay .info-h{display:none;color:var(--aah)}
#sky-overlay .info.hovering .info-x{display:none}
#sky-overlay .info.blocked .info-x{-webkit-line-clamp:1}
#sky-overlay .info.blocked .info-h{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#FF9A88}
#sky-overlay .info.hovering .info-h{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sky-overlay .info-btns{display:flex;gap:4px;flex:none}
#sky-overlay .ib{min-width:44px;height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--paper);font:700 16px/1 var(--f-ui);display:grid;place-items:center}
#sky-overlay .ib .ic{width:22px;height:22px}
#sky-overlay .ib-i{padding:0}
#sky-overlay .ib.sell{color:var(--danger);border-color:rgba(224,83,61,.6);background:transparent;min-width:52px;padding:0 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:18px}
#play[data-mode="regular"] #sky-overlay .info.tall{height:88px}
#play[data-mode="regular"] #sky-overlay .info.tall .info-x{-webkit-line-clamp:3}
#sky-overlay .ib.sell.armed{background:var(--danger);color:var(--ink);border-color:var(--danger)}
#play[data-mode="compact"] #sky-overlay .info,#play[data-mode="scroll"] #sky-overlay .info{height:48px;padding:2px 2px 2px 10px;left:6px;right:6px;bottom:6px}
#play[data-mode="compact"] #sky-overlay .info-x,#play[data-mode="scroll"] #sky-overlay .info-x,
#play[data-mode="compact"] #sky-overlay .info.hovering .info-h,#play[data-mode="scroll"] #sky-overlay .info.hovering .info-h{-webkit-line-clamp:1;display:block;white-space:nowrap;text-overflow:ellipsis}
#play[data-mode="compact"] #sky-overlay .info.hovering .info-x,#play[data-mode="scroll"] #sky-overlay .info.hovering .info-x,
#play[data-mode="compact"] #sky-overlay .info.blocked .info-x,#play[data-mode="scroll"] #sky-overlay .info.blocked .info-x{display:none}
#sky-overlay .info.blocked .info-x{-webkit-line-clamp:1}
#sky-overlay .info.blocked .info-h{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#FF9A88}
#sky-overlay .tip{position:absolute;left:50%;top:44px;transform:translateX(-50%);width:min(340px,calc(100% - 48px));padding:8px 12px;
  border-radius:10px;background:rgba(244,239,230,.94);color:var(--ink);font:700 16px/1.3 var(--f-ui);text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.4);animation:ui-rise .2s var(--ease-out)}
#sky-overlay .cheer{position:absolute;right:6px;top:48px;bottom:14px;width:8px;border-radius:4px;background:rgba(255,255,255,.08);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#sky-wrap.has-info .cheer{bottom:84px}
#play[data-mode="regular"] #sky-wrap.has-info.info-tall .cheer{bottom:104px}
#sky-overlay .info{transition:bottom .16s var(--ease-out)}
#sky-wrap.has-arc #sky-overlay .info{bottom:28px}
#sky-overlay .info[data-fit="1"] .t-o1,#sky-overlay .info[data-fit="2"] :is(.t-o1,.t-o2){display:none}
#play[data-mode="compact"] #sky-wrap.has-info .cheer,#play[data-mode="scroll"] #sky-wrap.has-info .cheer{bottom:60px}
#sky-overlay .cheer i{position:absolute;left:0;right:0;display:block}
#sky-overlay .cheer .fill{bottom:0;height:100%;border-radius:4px;background:linear-gradient(0deg,var(--aah),#FFF1C2);
  transform:scaleY(var(--fill,0));transform-origin:50% 100%;transition:transform .18s var(--ease-out)} /* scaled, not resized: no layout per frame */
#sky-overlay .cheer .tick{bottom:50%;left:-4px;right:-4px;height:2px;background:var(--paper);border-radius:1px}
#sky-overlay .cheer .band{display:none;border-radius:4px;background:rgba(255,255,255,.22);box-shadow:0 0 0 1px rgba(255,255,255,.35)}
#sky-overlay .cheer[data-band="restless"] .band{display:block;bottom:0;height:42.5%;background:rgba(224,83,61,.35)}
#sky-overlay .cheer[data-band="hopeful"] .band{display:block;bottom:42.5%;height:20%;background:rgba(242,193,78,.4)}
#sky-overlay .cheer[data-band="eager"] .band{display:block;bottom:62.5%;height:37.5%;background:rgba(123,211,137,.4)}

/* ---------- 5. Tokens (§4.1): plate shape + pictogram + monogram + star pips + Hang pips ---------- */
#play .tok,#inspect .tok{--tw:48px;--th:60px;position:relative;display:block;flex:none;width:var(--tw);height:var(--th)}
.tok{--tc:var(--c-W)} /* the plate colour: kept off the #id rule above so [data-col] can set it */
.tok[data-col="R"]{--tc:var(--c-R)}
.tok[data-col="A"]{--tc:var(--c-A)}
.tok[data-col="G"]{--tc:var(--c-G)}
.tok[data-col="B"]{--tc:var(--c-B)}
.tok[data-col="W"]{--tc:var(--c-W)}
.tok[data-col="X"]{--tc:var(--c-fusion)}
#play .tok-md,#inspect .tok-md{--tw:40px;--th:48px}
#play .tok-xs{--tw:32px;--th:40px}
#play .tok-mini{--tw:38px;--th:38px}
#inspect .tok-xl{--tw:72px;--th:88px}
.tok-plate{position:absolute;left:0;top:0;width:var(--tw);height:var(--tw);overflow:visible;
  fill:var(--tc);fill-opacity:.22;stroke:var(--tc);stroke-width:2.4;stroke-linejoin:round}
.tok[data-col="X"] .tok-plate{fill-opacity:.5;stroke-width:1.2}
.tok-plate .w0{fill:var(--c-R);stroke:var(--c-R)}
.tok-plate .w1{fill:var(--c-A);stroke:var(--c-A)}
.tok-plate .w2{fill:var(--c-G);stroke:var(--c-G)}
.tok-plate .w3{fill:var(--c-B);stroke:var(--c-B)}
.tok-pic{position:absolute;left:20%;top:calc(var(--tw) * .2);width:60%;height:calc(var(--tw) * .6);background:center / contain no-repeat}
/* the monogram sits on a small dark tag so it reads over any plate or pictogram (≥ 4.5:1) */
.tok-mono{position:absolute;right:-5px;top:calc(var(--tw) - 15px);padding:0 3px;border-radius:4px;background:rgba(5,7,15,.84);
  font:700 16px/16px var(--f-ui);letter-spacing:-.03em;color:var(--paper)}
.tok-star{position:absolute;right:-2px;top:-2px;display:flex;gap:2px}
.tok-star i{width:7px;height:7px;border-radius:50%;background:var(--aah);box-shadow:0 0 0 1.5px var(--ink)}
.tok-hang{position:absolute;left:0;right:0;top:calc(var(--tw) + 3px);height:7px;display:flex;justify-content:center;gap:3px}
.tok-hang i{width:6px;height:6px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 1px rgba(5,7,15,.6)}
.tok-hang i.o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--paper-dim)}
.tok-hang i.x{position:relative;background:transparent;box-shadow:inset 0 0 0 1.5px var(--danger)}
.tok-hang i.x::after{content:"";position:absolute;left:-2px;right:-2px;top:2px;height:2px;background:var(--danger);transform:rotate(-45deg)}
#play .tok-xs .tok-mono,#play .tok-xs .tok-hang,#play .tok-mini .tok-hang{display:none}
#play .tok-mini .tok-mono{top:auto;bottom:-3px}
.tok.washed .tok-plate,.tok.washed .tok-pic{filter:grayscale(1) brightness(1.2)}
.tok .b-fav,.tok .b-half,.tok .b-lamp,.tok .b-dud,.tok .b-critic,.tok .b-crowd{position:absolute;display:flex;align-items:center;z-index:1}
.tok .b-fav{left:-7px;top:-8px}
#play .tok .b-fav .ic{width:18px;height:18px;fill:var(--aah);stroke:var(--ink);stroke-width:1.5;paint-order:stroke}
.tok .b-half{right:-6px;top:15px;font:700 16px/16px var(--f-ui);color:var(--paper);background:var(--danger);border-radius:4px;padding:0 3px}
.tok .b-lamp,.tok .b-dud{left:-7px;top:14px;width:18px;height:18px;border-radius:50%;background:var(--ink);justify-content:center}
.tok .b-lamp .ic{width:14px;height:14px;color:#FFB54A}
.tok .b-dud .ic{width:14px;height:14px;color:var(--paper-dim)}
.tok .b-critic{right:-7px;top:14px;width:18px;height:18px;border-radius:50%;background:var(--ink);justify-content:center}
.tok .b-critic .ic{width:14px;height:14px;color:var(--danger)}
.tok .b-crowd{left:-6px;bottom:10px;gap:1px;padding:0 3px 0 2px;border-radius:4px;background:var(--ink);font:700 16px/16px var(--f-ui);color:var(--paper)}
.tok .b-crowd .ic{width:12px;height:12px}
.tok.pop{animation:ui-pop .18s var(--ease-back)}
.tok.pop-up{animation:ui-pop-up .32s var(--ease-back)}
@keyframes ui-pop{from{transform:scale(.4);opacity:.2}}
@keyframes ui-pop-up{0%{transform:scale(1)}40%{transform:scale(1.25);filter:drop-shadow(0 0 8px var(--aah))}}

/* SVG icons */
#play .ic,#inspect .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#play .ic .f,#inspect .ic .f{fill:currentColor;stroke:none}
#play .ic.crown,#inspect .ic.crown{fill:currentColor;stroke:none}
#play .ic.crown .f{fill:inherit}

/* ---------- 6. The rack: wood planks, brass rims, the fuse ---------- */
#rack{position:relative;margin-inline:calc(-1 * var(--gutter));padding:4px var(--gutter) 0;
  background:
    linear-gradient(180deg,rgba(0,0,0,.38),transparent 16%,transparent 80%,rgba(0,0,0,.5)),
    repeating-linear-gradient(180deg,transparent 0 31px,rgba(0,0,0,.34) 31px 33px),
    repeating-linear-gradient(94deg,rgba(255,255,255,.028) 0 1px,transparent 1px 6px,rgba(0,0,0,.05) 6px 8px),
    linear-gradient(180deg,var(--wood-hi),var(--wood) 70%);
  border-top:3px solid var(--brass);box-shadow:0 -1px 0 rgba(255,221,140,.35),0 -8px 24px rgba(0,0,0,.35)}
#rack[data-rows="2"]{--rows:2}
#rack[data-rows="3"]{--rows:3}
#play[data-mode="compact"] #rack,#play[data-mode="scroll"] #rack{padding-top:2px}
#rack.crit{border-top-color:var(--danger)}
#rack.pulse{animation:ui-rim 1.2s ease-in-out infinite}
@keyframes ui-rim{50%{box-shadow:0 -1px 0 rgba(224,83,61,.7),0 -6px 30px rgba(224,83,61,.35)}}
#rack.fog::after{content:"";position:absolute;left:0;right:0;top:0;height:46px;pointer-events:none;
  background:linear-gradient(180deg,rgba(185,178,199,.34),rgba(185,178,199,0));mix-blend-mode:screen}
#rack .tubes{position:relative;display:flex;justify-content:center;gap:var(--tgap,8px)}
#rack .tube{position:relative;width:48px;padding:0;margin:0;border:0;background:none;color:var(--paper);
  display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;border-radius:8px;
  height:calc(var(--h-rack) - 12px + (var(--rows) - 1) * 18px)}
#play[data-mode="compact"] #rack .tube,#play[data-mode="scroll"] #rack .tube{height:calc(var(--h-rack) - 8px + (var(--rows) - 1) * 18px)}
#rack .t-num{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:16px}
#rack .t-num .n{height:16px;font:600 16px/16px var(--f-display);font-variant-numeric:tabular-nums;color:var(--paper);white-space:nowrap}
#rack .t-num .n.last{color:var(--aah);font-family:var(--f-ui);font-weight:700;letter-spacing:.02em}
#rack .t-num .n.none{color:transparent}
#rack .t-num .n.hyp{color:var(--aah);opacity:.8} /* where a held card would fire (not the drag ghost) */
#rack[data-rows="2"] .t-num .n:first-child,#rack[data-rows="3"] .t-num .n:nth-child(2){color:var(--paper-dim)}
#rack .t-sees{display:inline-flex;align-items:center;justify-content:center;height:18px;min-width:0;padding:0 5px;border-radius:9px;
  background:rgba(5,7,15,.55);font:700 16px/18px var(--f-ui);letter-spacing:-.01em;color:var(--paper-dim);white-space:nowrap;
  font-variant-numeric:tabular-nums}
#rack .t-sees:empty{background:transparent;padding:0}
#rack .t-sees .sees-ic{display:none;width:16px;height:16px;margin-right:2px;stroke-width:2.2}
#rack .t-sees.local{background:rgba(242,193,78,.2);color:var(--paper);box-shadow:inset 0 0 0 1px rgba(242,193,78,.55)}
#rack[data-fit="1"] .t-sees{padding:0 3px;letter-spacing:-.04em}
#rack[data-fit="2"] .t-sees{padding:0 5px 0 4px;letter-spacing:0}
#rack[data-fit="2"] .t-sees .sw{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#rack[data-fit="2"] .t-sees .sees-ic{display:block}
#rack .t-sees.fogged{color:var(--paper);box-shadow:inset 0 0 0 1px rgba(185,178,199,.6)}
#rack .t-body{position:relative;width:48px;height:var(--tok-h);transform-origin:50% 100%;border-radius:7px 7px 5px 5px;
  background:radial-gradient(ellipse 60% 9px at 50% 3px,#000 0 70%,transparent 100%),linear-gradient(90deg,#120d09,#2c2118 42%,#150f0a);
  box-shadow:inset 0 3px 0 -1px var(--brass),inset 0 0 0 1px rgba(201,162,39,.35),0 2px 4px rgba(0,0,0,.5)}
#rack .t-body::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(ellipse 70% 40% at 50% 0,rgba(0,0,0,.95),transparent 70%);opacity:0}
#rack .tube[data-soot="1"] .t-body::before{opacity:.18}
#rack .tube[data-soot="2"] .t-body::before{opacity:.34}
#rack .tube[data-soot="3"] .t-body::before{opacity:.5}
#rack .tube[data-soot="4"] .t-body::before{opacity:.66}
#rack .t-tok{position:absolute;inset:0}
#rack .t-tok .tok{--th:var(--tok-h)}
#rack .t-empty{display:grid;place-items:center;height:100%;color:rgba(244,239,230,.3)}
#rack .t-empty .ic{width:20px;height:20px}
#rack .t-rig{width:48px;height:var(--rig-h);border-radius:3px;display:grid;place-items:center;background:rgba(0,0,0,.22);color:var(--ink)}
#rack .t-rig.has{background:linear-gradient(180deg,#E3C25A,var(--brass) 45%,#8A6C14);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
#rack .t-rig .ic{width:14px;height:14px;stroke-width:2.4}
#rack .t-rig.can{box-shadow:0 0 0 2px var(--aah);background:rgba(242,193,78,.25)}
/* local chips on legal drops (never a total) */
#rack .t-chips{position:absolute;left:-4px;right:-4px;top:3px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;z-index:2}
:is(#rack .t-chips,#sky-overlay .legend) .chip{min-height:18px;height:18px;padding:0 4px;gap:1px;font:700 16px/18px var(--f-ui);letter-spacing:-.02em;
  box-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
:is(#rack .t-chips,#sky-overlay .legend) .c-ooh{background:rgba(244,239,230,.94);color:var(--ink)}
:is(#rack .t-chips,#sky-overlay .legend) .c-aah{border-radius:4px;background:var(--aah);color:var(--ink)}
:is(#rack .t-chips,#sky-overlay .legend) .c-x{background:var(--ink);color:var(--aah)}
:is(#rack .t-chips,#sky-overlay .legend) .chip-fusion{background:var(--c-fusion);color:var(--ink)}
#rack .t-chips .c-crowd,#rack .t-chips .c-coin,#rack .t-chips .c-none{background:var(--ink);color:var(--paper)}
#rack .t-chips .c-crowd .ic{width:12px;height:12px}
#rack .t-chips .c-none{color:var(--paper-dim)}
/* × as the Aah it adds here ("(+6)"), where the drop would fire ("3rd", "LAST"), and a swap / replace drop */
#rack .t-chips .c-xaah{border-radius:4px;background:var(--ink);color:var(--aah);box-shadow:inset 0 0 0 1px var(--aah),0 1px 3px rgba(0,0,0,.6)}
#rack .t-chips .c-ord{background:var(--ink);color:var(--aah);font-family:var(--f-ui)}
:is(#rack .t-chips,#sky-overlay .legend) .c-swap{background:var(--ink);color:var(--paper);box-shadow:inset 0 0 0 1px var(--paper-dim),0 1px 3px rgba(0,0,0,.6)}
:is(#rack .t-chips,#sky-overlay .legend) .c-swap .ic{width:14px;height:14px;stroke-width:2.4}
#rack .t-chips .c-swap.sell{color:#FF9A88;box-shadow:inset 0 0 0 1px var(--danger),0 1px 3px rgba(0,0,0,.6)}
/* the chip legend while a card or shell is held on touch (UI_PLAY): just above the info card */
#sky-overlay .legend{position:absolute;left:8px;right:8px;bottom:82px;display:flex;justify-content:center;align-items:center;gap:6px;
  pointer-events:none;transition:bottom .16s var(--ease-out)}
#sky-overlay .legend[hidden]{display:none}
#sky-overlay .legend .chip{height:22px;min-height:22px;padding:0 6px;line-height:22px}
#sky-wrap.info-tall #sky-overlay .legend{bottom:102px}
#sky-wrap.has-arc #sky-overlay .legend{bottom:102px}
#sky-wrap.has-arc.info-tall #sky-overlay .legend{bottom:122px}
#play:is([data-mode="compact"],[data-mode="scroll"]) #sky-overlay .legend{bottom:60px}
#play:is([data-mode="compact"],[data-mode="scroll"]) #sky-wrap.has-arc #sky-overlay .legend{bottom:82px}
@container sky (max-height: 124px){#sky-overlay .legend{display:none}}
@container sky (max-height: 160px){#play[data-sponsor]:is([data-mode="compact"],[data-mode="scroll"]) #sky-overlay .legend{display:none}}
/* states: selected, legal drop, hovered drop, dimmed, hatched, armed */
#rack .tube .t-body,#rack .tube .t-tok{transition:transform .14s var(--ease-out),opacity .14s}
#rack .tube.sel .t-body{box-shadow:inset 0 3px 0 -1px var(--brass),0 0 0 2px var(--aah),0 0 18px rgba(242,193,78,.45);transform:translateY(-4px)}
#rack .tube.can .t-body{box-shadow:inset 0 3px 0 -1px var(--brass),0 0 0 2px rgba(242,193,78,.85)}
#rack .tube.can.empty .t-body{background:radial-gradient(ellipse 60% 9px at 50% 3px,#000 0 70%,transparent 100%),linear-gradient(180deg,rgba(242,193,78,.16),rgba(242,193,78,.04)),linear-gradient(90deg,#120d09,#2c2118 42%,#150f0a)}
#rack .tube.can:not(.empty) .t-tok{opacity:.45}
#rack .tube.hov .t-body{box-shadow:inset 0 3px 0 -1px var(--brass),0 0 0 3px var(--focus),0 0 20px rgba(255,209,102,.5);transform:translateY(-3px)}
#rack .tube.dim{opacity:.5}
#rack .tube.hatched .t-body::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(135deg,rgba(185,178,199,.28) 0 3px,transparent 3px 8px)}
#rack .tube.armed .t-body{box-shadow:inset 0 3px 0 -1px var(--brass),0 0 0 3px var(--danger)}
#rack .tube.fired .t-tok{opacity:.35}
#rack .t-body.recoil{animation:ui-recoil .12s ease-out} /* fallback: UI_PLAY plays it with Web Animations */
@keyframes ui-recoil{50%{transform:scale(1.25,.8)}}
#rack .tube:focus-visible{outline-offset:3px}
#rack .tube.shake,#tools .slot.shake{animation:ui-shake .28s ease-out}
@keyframes ui-shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
/* the canopy arc (who will see this burst) */
#rack .arc{position:absolute;left:0;top:-23px;height:26px;overflow:visible;pointer-events:none;z-index:3;
  fill:none;stroke-width:2.5;stroke-linecap:round;color:var(--aah)}
#rack .arc[data-col="R"]{color:var(--c-R)} #rack .arc[data-col="A"]{color:var(--c-A)} #rack .arc[data-col="G"]{color:var(--c-G)}
#rack .arc[data-col="B"]{color:var(--c-B)} #rack .arc[data-col="W"]{color:var(--c-W)} #rack .arc[data-col="X"]{color:var(--c-fusion)}
#rack .arc .span{stroke:currentColor;stroke-dasharray:5 4;filter:drop-shadow(0 0 3px rgba(0,0,0,.9))}
#rack .arc .dot{fill:currentColor;stroke:var(--ink);stroke-width:1.5}
#rack .arc .src{fill:var(--paper);stroke:currentColor;stroke-width:2.5}
#rack .arc .alt{opacity:.5}
/* the fuse line and its ember */
#rack .fuse{position:absolute;left:50%;bottom:3px;height:6px;transform:translateX(-50%);border-radius:3px;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--brass) 0 7px,#7A5E12 7px 10px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
#play[data-mode="compact"] #rack .fuse,#play[data-mode="scroll"] #rack .fuse{bottom:1px}
#rack .fuse .ember{position:absolute;left:calc(var(--ex,0px) - 7px);top:-4px;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle,#FFF6D0 0 18%,#FFB347 40%,rgba(255,120,0,0) 70%)}
#rack .fuse[data-dir="back"]::after{content:"";position:absolute;left:0;right:0;top:-9px;height:4px;border-radius:2px;opacity:.7;
  background:repeating-linear-gradient(90deg,var(--aah) 0 5px,transparent 5px 9px)}
#rack .fuse[data-dir="cross"]{background:repeating-linear-gradient(90deg,var(--brass) 0 12px,transparent 12px 16px)}
#rack.crit .fuse .ember{background:radial-gradient(circle,#FFD0C8 0 18%,var(--danger) 42%,rgba(224,83,61,0) 70%)}
#rack .fuse.lit .ember{animation:ui-ember .6s ease-in-out infinite alternate}
@keyframes ui-ember{to{transform:scale(1.35)}}

/* ---------- 7. Tools: Crate ×2 pinned left · divider · Undo · Match · Restore · Rehearse ---------- */
#tools{display:flex;align-items:center;gap:8px}
#tools .crate{display:flex;gap:8px;flex:none;border-radius:10px}
#tools .slot{position:relative;width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:9px;touch-action:none;
  border:1px solid rgba(201,162,39,.45);color:rgba(244,239,230,.35);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 5px),linear-gradient(180deg,#2A1F15,#1A130D)}
#tools .slot .ic{width:22px;height:22px}
#tools .slot.empty{grid-template-rows:auto auto;align-content:center;row-gap:1px}
#tools .slot.empty .ic{width:20px;height:20px}
#tools .slot.sel{box-shadow:0 0 0 2px var(--aah),0 0 14px rgba(242,193,78,.45)}
#tools .slot.can{border:2px dashed var(--aah)}
#tools .slot.hov{box-shadow:0 0 0 3px var(--focus)}
#tools .slot.armed{box-shadow:0 0 0 3px var(--danger)}
#tools .divider{width:8px;align-self:stretch;flex:none;margin-inline:-8px;
  background:linear-gradient(var(--line),var(--line)) center / 1px 60% no-repeat}
#tools .tool{position:relative;min-width:44px;height:44px;padding:0 5px;display:grid;grid-template-rows:auto auto;align-content:center;
  justify-items:center;row-gap:1px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--paper)}
#tools .tool .ic{width:20px;height:20px}
/* every tool (and an empty Crate slot) names itself under its icon */
#tools .tl{display:block;font:400 16px/16px var(--f-ui);letter-spacing:-.02em;white-space:nowrap;color:inherit}
#tools .slot .tl{color:rgba(244,239,230,.6)}
#tools[data-fit="1"]{gap:4px}
#tools[data-fit="1"] .crate{gap:4px}
#tools[data-fit="1"] .tool{padding:0 2px}
#tools[data-fit="1"] .tl{letter-spacing:-.05em}
#tools[data-fit="2"]{gap:3px}
#tools[data-fit="2"] .crate{gap:3px}
#tools[data-fit="2"] .divider{display:none}
#tools[data-fit="2"] .tool{padding:0 1px}
#tools[data-fit="2"] .tl{letter-spacing:-.07em}
#tools .tool:hover:not(:disabled){border-color:var(--paper-dim)}
#tools .tool:disabled{opacity:.38;cursor:default}
#tools .tool.lit:not(:disabled){border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),0 0 14px rgba(201,162,39,.45);color:var(--aah)}
#tools .tool[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--ink);opacity:1}


/* ---------- 8. Shop: 3 vertical cards, or a 2 × 2 grid of tiles ---------- */
#shop{position:relative}
#shop .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;height:100%}
#shop .card{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  column-gap:6px;row-gap:4px;align-items:start;min-width:0;height:100%;padding:6px;border-radius:10px;touch-action:none;text-align:left;
  border:1px solid var(--line);color:var(--paper);
  background:linear-gradient(180deg,rgba(40,31,86,.96),rgba(14,18,42,.96));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 12px rgba(0,0,0,.3);
  transition:transform .14s var(--ease-out),box-shadow .14s}
#shop .card[data-rar="3"]{border-color:rgba(86,180,233,.55)}
#shop .card[data-rar="2"]{border-color:rgba(185,178,199,.35)}
#shop .card:hover:not(:disabled){border-color:var(--paper-dim)}
#shop .card .tok{grid-row:1}
#shop .c-side{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#shop .c-price{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:12px;background:var(--brass);color:var(--ink);
  font:700 18px/1 var(--f-display);font-variant-numeric:tabular-nums}
#shop .card.poor .c-price{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
#shop .c-rar{display:flex;gap:3px}
#shop .c-rar i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.16)}
#shop .c-rar i.on{background:var(--paper-dim)}
#shop .card[data-rar="3"] .c-rar i.on{background:var(--c-B)}
#shop .c-name{grid-column:1 / -1;grid-row:2;align-self:end;font:700 16px/18px var(--f-ui);hyphens:auto;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* a badged card whose name needs 2 lines (UI_PLAY sets data-wrap) makes room with the 40 × 48 token, never an ellipsis */
#shop .card.badged[data-wrap]{row-gap:3px}
#shop .card.badged[data-wrap] .tok{--tw:40px;--th:48px}
#shop .c-badge{grid-column:1 / -1;grid-row:3;font:700 16px/20px var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shop .b-twin{color:var(--aah)}
#shop .b-twin .twin{display:none;width:18px;height:18px;margin-right:2px;vertical-align:-3px;stroke-width:2.2}
#shop .card[data-fit="1"] .b-twin .bw{display:none}
#shop .card[data-fit="1"] .b-twin .twin,#shop[data-n="4"] .b-twin .twin{display:inline-block}
#shop .b-fuse{color:var(--c-fusion)}
#shop .b-coll{color:var(--c-B)}
#shop .b-pity{color:var(--paper-dim);font-style:italic}
#shop .card.sel{border-color:var(--brass);transform:translateY(-4px);box-shadow:0 0 0 2px var(--brass),0 10px 26px rgba(201,162,39,.3)}
#shop .card.sold{display:grid;place-items:center;background:transparent;border-style:dashed;box-shadow:none}
#shop .c-sold{font:italic 700 18px/1 var(--f-display);color:var(--paper-dim)}
#shop .card.flip{animation:ui-flip .32s var(--ease-out) both}
@keyframes ui-flip{from{transform:perspective(400px) rotateY(80deg);opacity:0}}
#shop .shop-empty{position:absolute;inset:0;margin:0;display:grid;place-items:center;text-align:center;padding:0 24px;
  border:1px dashed rgba(185,178,199,.3);border-radius:10px;font:italic 400 18px/1.3 var(--f-display);color:var(--paper-dim)}
#shop .card[data-fit="1"] .bw:not(.b-twin .bw){display:none}
#shop .card[data-fit="1"] .c-badge:is(.b-coll,.b-pity),#shop .card[data-fit="2"] .c-badge{display:none}
/* 4 cards: a 2 × 2 grid of 160 × 58 tiles — token | name over (price · badge) */
#shop[data-n="4"] .cards{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
#shop[data-n="4"] .card{grid-template-columns:auto auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:6px;row-gap:4px;
  padding:4px 8px 4px 6px;align-content:center}
#shop[data-n="4"] .card .tok{grid-column:1;grid-row:1 / 3;align-self:center;margin-right:2px}
#shop[data-n="4"] .c-name{grid-column:2 / 4;grid-row:1;align-self:end;-webkit-line-clamp:1;white-space:nowrap;text-overflow:ellipsis;display:block}
#shop[data-n="4"] .c-side{grid-column:2;grid-row:2;flex-direction:row;align-items:center;align-self:start}
#shop[data-n="4"] .c-price{height:22px;font-size:17px}
#shop[data-n="4"] .c-rar{display:none}
#shop[data-n="4"] .c-badge{grid-column:3;grid-row:2;align-self:center;min-width:0}
/* Compact: 104 × 96 cards (token 40 × 48) and 160 × 44 tiles (token 32 × 40: token | name | price) */
#play[data-mode="compact"] #shop .c-name,#play[data-mode="scroll"] #shop .c-name{-webkit-line-clamp:1;white-space:nowrap;text-overflow:ellipsis;display:block}
#play[data-mode="compact"] #shop .card,#play[data-mode="scroll"] #shop .card{padding:4px 6px;row-gap:2px}
#play[data-mode="compact"] #shop[data-n="4"] .card,#play[data-mode="scroll"] #shop[data-n="4"] .card{padding:2px 5px 2px 4px;column-gap:5px;
  grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:1fr}
#play[data-mode="compact"] #shop[data-n="4"] .c-price,#play[data-mode="scroll"] #shop[data-n="4"] .c-price{padding:0 6px}
#play[data-mode="compact"] #shop[data-n="4"] .card .tok,#play[data-mode="scroll"] #shop[data-n="4"] .card .tok{grid-row:1}
#play[data-mode="compact"] #shop[data-n="4"] .c-badge,#play[data-mode="scroll"] #shop[data-n="4"] .c-badge{display:none}
#play[data-mode="compact"] #shop[data-n="4"] .c-name,#play[data-mode="scroll"] #shop[data-n="4"] .c-name{grid-column:2;grid-row:1;align-self:center}
#play[data-mode="compact"] #shop[data-n="4"] .c-side,#play[data-mode="scroll"] #shop[data-n="4"] .c-side{grid-column:3;grid-row:1;align-self:center}

/* ---------- 9. Workshop: rig card · add tube · reroll (hidden in Festival 1) ---------- */
#workshop{display:flex;gap:8px;align-items:center}
#workshop .ws{position:relative;height:44px;min-width:44px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--paper);font:700 16px/1 var(--f-ui);white-space:nowrap}
#workshop .ws-rig{flex:1.5 1 0;min-width:0;touch-action:none;border-color:rgba(201,162,39,.55);
  background:linear-gradient(90deg,rgba(201,162,39,.18),rgba(27,20,64,.92) 60%)}
#workshop .ws-tube,#workshop .ws-reroll{flex:0 0 auto;justify-content:center}
/* 360 px (UI_PLAY fits the row): 1 tighter, each price under its word ("Mortar / $10", "Tube / $6", "Reroll / $1")
   · 2 Tube / Reroll show icon + price · 3 the rig shows glyph + price */
#workshop:is([data-fit="1"],[data-fit="2"],[data-fit="3"]) .ws{padding:0 8px;gap:5px}
#workshop[data-fit="1"] .ws:not(:has(> .ws-name:only-child)),#workshop[data-fit="2"] .ws-rig:not(:has(> .ws-name:only-child)){
  display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:18px 18px;column-gap:4px;row-gap:1px;align-content:center;padding:0 6px}
#workshop[data-fit="1"] .ws > :is(.ic,.ws-glyph),#workshop[data-fit="2"] .ws-rig > .ws-glyph{grid-column:1;grid-row:1 / 3;align-self:center}
#workshop[data-fit="1"] .ws .ws-name,#workshop[data-fit="2"] .ws-rig .ws-name{grid-column:2;grid-row:1;line-height:18px}
#workshop[data-fit="1"] .ws .ws-price,#workshop[data-fit="2"] .ws-rig .ws-price{grid-column:2;grid-row:2;font-size:17px;line-height:18px;justify-self:start}
#workshop:is([data-fit="2"],[data-fit="3"]) .ws-word{display:none}
#workshop[data-fit="3"] .ws-rigname{display:none}
#workshop[data-fit="3"] .ws-rig{justify-content:space-between}
#workshop .ws-name{min-width:0;overflow:hidden;text-overflow:ellipsis}
#workshop .ws-rig .ws-name{flex:1;text-align:left}
#workshop .ws-price{font:700 18px/1 var(--f-display);color:var(--aah);font-variant-numeric:tabular-nums}
#workshop .ws.poor .ws-price{color:var(--danger)}
#workshop .ws-glyph{display:grid;place-items:center;width:24px;height:24px;border-radius:5px;background:var(--brass);color:var(--ink);flex:none}
#workshop .ws-glyph .ic{width:16px;height:16px;stroke-width:2.4}
#workshop .ws .ic{width:18px;height:18px}
#workshop .ws:disabled{opacity:.45;cursor:default}
#workshop .ws.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass),0 0 16px rgba(201,162,39,.35)}
#play[data-mode="compact"] #workshop .ws,#play[data-mode="scroll"] #workshop .ws{height:44px}

/* ---------- 10. Fire: Light the fuse + the mood pill ---------- */
#firebar{display:flex;align-items:stretch;padding-bottom:4px}
#fire{position:relative;width:100%;height:100%;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:12px;
  font:italic 700 22px/1 var(--f-display);letter-spacing:.01em;
  background:linear-gradient(180deg,#E0BB45,var(--brass) 55%,#A9861C);border:1px solid #E6C85E;color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(201,162,39,.25)}
#fire .fire-lbl{flex:1;text-align:center;white-space:nowrap}
/* the Crowd mood: its own button beside Light the fuse (a tap explains it; it never lights) */
#firebar{gap:8px}
#firebar .mood{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;padding:0 12px 0 8px;border-radius:12px;flex:none;
  background:var(--ink);color:var(--paper);border:1px solid var(--line);font:700 16px/1 var(--f-ui);letter-spacing:0}
#firebar .mood[hidden]{display:none}
#firebar .mood:hover{border-color:var(--paper-dim)}
#firebar .mood .pose{width:24px;height:24px;stroke-width:2.2}
#firebar .mood[data-mood="restless"]{border-color:rgba(224,83,61,.7)}
#firebar .mood[data-mood="restless"] .mood-w{color:#FF9A88}
#firebar .mood[data-mood="hopeful"] .mood-w{color:var(--aah)}
#firebar .mood[data-mood="eager"]{border-color:rgba(123,211,137,.6)}
#firebar .mood[data-mood="eager"] .mood-w{color:var(--ok)}
#fire{flex:1 1 auto;min-width:0}
#fire.skip{background:var(--surface-2);border-color:var(--line);color:var(--paper);box-shadow:none}
#fire:disabled{filter:saturate(.4) brightness(.8)}
#fire.glow{animation:ui-glow 1.8s ease-in-out infinite}
@keyframes ui-glow{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 0 4px rgba(242,193,78,.35),0 0 28px rgba(242,193,78,.6)}}
#play[data-mode="compact"] #fire,#play[data-mode="scroll"] #fire{font-size:20px}

/* ---------- 11. Hints, drag ghost, focus ---------- */
#play .tip-anchor{box-shadow:0 0 0 3px var(--focus),0 0 22px rgba(255,209,102,.55)!important;animation:ui-tip 1.6s ease-in-out infinite}
#rack.tip-anchor{border-top-color:var(--focus);box-shadow:0 -1px 0 rgba(255,209,102,.8),0 -10px 26px rgba(255,209,102,.3)!important;animation:ui-tip-rim 1.6s ease-in-out infinite}
@keyframes ui-tip-rim{50%{box-shadow:0 -1px 0 rgba(255,209,102,.5),0 -6px 14px rgba(255,209,102,.12)}}
@keyframes ui-tip{50%{box-shadow:0 0 0 3px var(--focus),0 0 8px rgba(255,209,102,.2)}}
#play .ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;will-change:transform;filter:drop-shadow(0 10px 12px rgba(0,0,0,.65))}
#play .ghost-rig{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--brass);color:var(--ink)}
#play .ghost-rig .ic{width:26px;height:26px}
#play :is(.card,.slot,.tool,.ws,.hud-ic,.hud-head,.hud-coins,.hud-crowd,.mood,.ib,.rh-pill,.res-app,.sp-toggle):focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ---------- 12. Inspect sheet ---------- */
/* opaque, lifted, and the play column dimmed behind it (tapping the dimmed area closes it) */
#inspect{background:linear-gradient(180deg,#221A4E,#10142E 55%);border-color:rgba(201,162,39,.4);
  box-shadow:0 -14px 40px rgba(0,0,0,.55),0 0 0 100vmax rgba(3,5,12,.6);animation:ui-sheet .22s var(--ease-out)}
#inspect::before{content:"";display:block;width:40px;height:4px;margin:-6px auto 10px;border-radius:2px;background:rgba(244,239,230,.25)}
@keyframes ui-sheet{from{transform:translateY(24px);opacity:.4}}
#inspect .insp-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
#inspect .insp-head h2{margin:0 0 2px}
#inspect .insp-sub,#inspect .insp-where,#inspect .insp-tags{margin:0;color:var(--paper-dim);font:400 16px/1.35 var(--f-ui)}
#inspect .insp-where{margin:0 0 8px;color:var(--paper)}
#inspect .insp-glyph{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;background:var(--brass);color:var(--ink);flex:none}
#inspect .insp-glyph .ic{width:32px;height:32px}
#inspect .insp-glyph.bad{background:var(--danger)}
#inspect .insp-glyph.coin{font:600 30px/1 var(--f-display);color:var(--ink)}
#inspect .insp-rule{font:400 18px/1.4 var(--f-ui);margin:0 0 10px}
#inspect .insp-lines{margin:0 0 10px;padding-left:20px;font:400 16px/1.45 var(--f-ui)}
#inspect .insp-tiers,#inspect .insp-fus{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font:400 16px/1.35 var(--f-ui)}
#inspect .insp-tiers li{color:var(--paper-dim)}
#inspect .insp-tiers li.now{color:var(--paper)}
#inspect .insp-tiers b{color:var(--aah);margin-right:4px}
#inspect .insp-fus li{color:var(--c-fusion)}
#inspect .insp-fus li.dim{color:var(--paper-dim)}
#inspect .insp-tip{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:rgba(244,239,230,.08);font:italic 400 16px/1.4 var(--f-ui);color:var(--paper)}
#inspect .insp-btns{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:14px}
#inspect .btn.armed{background:var(--danger);color:var(--ink)}

/* ---------- 13. High contrast and reduced motion ---------- */
:root[data-contrast="high"] #play .tok-plate{stroke:#FFFFFF;stroke-width:2}
:root[data-contrast="high"] #play .tok-mono{text-shadow:none;background:#000;padding:0 2px;border-radius:3px}
:root[data-contrast="high"] #rack{background:var(--wood);border-top-color:#FFFFFF}
:root[data-contrast="high"] #rack .t-body{background:#000;box-shadow:inset 0 0 0 2px #FFFFFF}
:root[data-contrast="high"] #shop .card,:root[data-contrast="high"] #tools .slot{background:#000;border-color:#FFFFFF}
:root[data-contrast="high"] #fire{background:var(--brass);box-shadow:none}
:root[data-contrast="high"] #play .tip-anchor,:root[data-contrast="high"] #fire.glow{box-shadow:none!important;outline:3px solid var(--focus)}
:root[data-motion="reduced"] #fire.glow,:root[data-motion="reduced"] #rack.pulse,:root[data-motion="reduced"] #play .tip-anchor,:root[data-motion="reduced"] #inspect,:root[data-motion="reduced"] #rack .fuse.lit .ember{animation:none}
:root[data-motion="reduced"] #rack .fuse.lit .ember{transform:scale(1.2)} /* lit: a steady, larger glow instead of the pulse */
:root[data-motion="reduced"] #fire.glow{box-shadow:0 0 0 3px rgba(242,193,78,.5)}
:root[data-motion="reduced"] #rack.pulse{box-shadow:0 -1px 0 rgba(224,83,61,.7),0 -6px 26px rgba(224,83,61,.3)}
@media (prefers-reduced-motion: reduce){
  #fire.glow,#rack.pulse,#play .tip-anchor{animation:none}
  #play > #tools,#play > #shop,#play > #workshop,#play > #sponsor{transition:none}
}
/* ==== panels.css ==== */
/* ============================================================
   panels.css — #board (Festival board) and #showlog (Show log).
   Desktop side columns at >= 1200 px (frame in base.css); below
   that #showlog presents as the 'showlog' bottom sheet.
   Tokens only (base.css); every selector is scoped to #board or
   #showlog.
============================================================ */

/* ---------- shared bits ---------- */
#board .pn-ic,#showlog .pn-ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
#showlog .pn-shape{width:16px;height:16px;flex:none;fill:var(--c-W);stroke:var(--ink);stroke-width:1;paint-order:stroke}
#showlog .pn-shape[data-col="R"]{fill:var(--c-R)}
#showlog .pn-shape[data-col="A"]{fill:var(--c-A)}
#showlog .pn-shape[data-col="G"]{fill:var(--c-G)}
#showlog .pn-shape[data-col="B"]{fill:var(--c-B)}
#showlog .pn-shape[data-col="X"]{stroke:none}
#board .num,#showlog .num{font-variant-numeric:tabular-nums}

/* the wood-and-brass card both columns sit in. Near-opaque with no backdrop-filter: a blur over the
   live #backdrop canvas re-rasterised both columns every frame (the main desktop frame-time cost);
   a faint tint of the backdrop still reads through the 8% left over. */
#board .bd,#showlog .sl-panel{
  --pn-edge:color-mix(in srgb,var(--brass) 34%,var(--line));
  --pn-soft:color-mix(in srgb,var(--paper) 5%,transparent);
  --pn-well:color-mix(in srgb,var(--ink) 55%,transparent);
}
@media (min-width:1200px){
  /* #app centres its grid items (justify-items:center); make both columns fill their tracks */
  #board,#showlog{width:100%;min-width:0}
  #board .bd,#showlog .sl-panel{height:100%;min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:14px;
    border:1px solid var(--pn-edge);
    background:
      linear-gradient(180deg,color-mix(in srgb,var(--wood) 46%,transparent) 0,color-mix(in srgb,var(--wood) 14%,transparent) 132px,transparent 260px),
      color-mix(in srgb,var(--sky-top) 92%,transparent);
    box-shadow:inset 0 1px 0 color-mix(in srgb,var(--brass) 42%,transparent),0 12px 32px color-mix(in srgb,var(--ink) 60%,transparent)}
}

/* =================== FESTIVAL BOARD =================== */
#board .bd{gap:8px;padding:14px 14px 12px}
#board .bd-head{flex:none;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;padding-inline:2px}
#board .bd-title{margin:0;font:600 var(--t-l)/1.15 var(--f-display);letter-spacing:.005em;color:var(--paper)}
#board .bd-sub{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--paper-dim);font-size:var(--t-s)}
#board .bd-tag{padding:1px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--brass) 60%,transparent);color:var(--brass);font-weight:700}

#board .bd-cols{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 9px 0 9px;
  color:var(--paper-dim);font-size:var(--t-xs);line-height:1.2}
#board .bd-cols span{padding-left:7px;white-space:nowrap}

/* scroll lists fade only at an edge with more beyond it (.fade-t / .fade-b from ui-panels.js) */
#board .bd-list,#showlog .sl-body{--fade-t:#000;--fade-b:#000;
  -webkit-mask-image:linear-gradient(180deg,var(--fade-t),#000 22px,#000 calc(100% - 28px),var(--fade-b));
  mask-image:linear-gradient(180deg,var(--fade-t),#000 22px,#000 calc(100% - 28px),var(--fade-b))}
#board .bd-list.fade-t,#showlog .sl-body.fade-t{--fade-t:transparent}
#board .bd-list.fade-b,#showlog .sl-body.fade-b{--fade-b:transparent}
/* keyboard focus on a scroll list: an inset ring, and no edge fade hiding part of it */
#board .bd-list:focus-visible,#showlog .sl-body:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:8px;-webkit-mask-image:none;mask-image:none}
/* "Scores": each played festival's shows and Headliner as text (what its stamps, cells and icons mark) */
#board .bd-sub{flex:1 1 auto}
#board .bd-scores{position:relative;z-index:0;margin:-9px 0 -9px auto;padding:12px 12px;border:0;border-radius:999px;background:transparent;
  color:var(--paper-dim);font:700 var(--t-xs)/1.3 var(--f-ui);cursor:pointer}   /* a 44px-tall hit area around a small pill */
#board .bd-scores::after{content:"";position:absolute;z-index:-1;inset:9px 0;border-radius:999px;border:1px solid var(--line)}
#board .bd-scores:hover{color:var(--paper)}
#board .bd-scores:hover::after{border-color:var(--brass)}
#board .bd-scores[aria-pressed="true"]{color:var(--brass)}
#board .bd-scores[aria-pressed="true"]::after{border:2px solid var(--brass)}
#board .bd-scores:focus-visible{outline:0}
#board .bd-scores:focus-visible::after{outline:2px solid var(--focus);outline-offset:2px}
#board .bd-more{display:none;margin:4px 0 0;color:var(--paper-dim);font:400 var(--t-xs)/1.3 var(--f-ui);font-variant-numeric:tabular-nums}
#board .is-scores .bd-more{display:block}
#board .bd-more-g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
#board .bd-more-g span{min-width:0;padding-left:7px;white-space:nowrap}
#board .bd-more-g b{display:block;color:var(--paper)}
#board .bd-more-g .is-pass b{color:var(--ok)}
#board .bd-more-g .is-miss b{color:var(--danger)}
#board .bd-more-g i{display:block;font-style:normal}
#board .bd-more p{margin:2px 0 0 7px}
#board .bd-list{list-style:none;margin:0 -6px 0 0;padding:0 6px 26px 0;flex:1 1 auto;min-height:0;overflow:auto;
  display:flex;flex-direction:column;gap:3px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#board .bd-row{position:relative;padding:5px 8px 6px;border-radius:9px;border:1px solid transparent}
#board .bd-row.is-now{background:color-mix(in srgb,var(--brass) 13%,transparent);border-color:color-mix(in srgb,var(--brass) 55%,transparent);
  box-shadow:inset 3px 0 0 var(--brass)}
#board .bd-name{display:flex;align-items:center;gap:8px;min-width:0;min-height:24px}
#board .bd-num{flex:none;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid color-mix(in srgb,var(--brass) 70%,transparent);color:var(--brass);font:700 var(--t-xs)/1 var(--f-ui)}
#board .is-past .bd-num{background:color-mix(in srgb,var(--brass) 22%,transparent);border-color:transparent}
#board .is-now .bd-num{background:var(--brass);color:var(--ink);border-color:var(--brass)}
#board .bd-fest{flex:0 0 auto;max-width:72%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:600 var(--t-m)/1.2 var(--f-display);color:var(--paper)}
#board .is-past .bd-fest{color:var(--paper-dim)}
#board .bd-hlmini{margin-left:auto;flex:0 1 auto;min-width:0;display:inline-flex;align-items:center;gap:5px;
  color:var(--paper-dim);font-size:var(--t-xs);white-space:nowrap;overflow:hidden}
#board .bd-hlmini span{overflow:hidden;text-overflow:ellipsis}
#board .bd-hlmini .pn-ic{color:var(--brass)}
#board .bd-hlmini.is-sealed .pn-ic{color:var(--paper-dim)}
#board .bd-name:has(.is-sealed){flex-wrap:wrap;row-gap:0}
#board .bd-hlmini.is-sealed{flex:none}
#board .bd-stamps{flex:none;display:inline-flex;gap:2px;margin-left:6px}
#board .bd-stamp{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font:700 var(--t-xs)/1 var(--f-ui);
  color:var(--paper-dim);background:var(--pn-soft)}
#board .bd-stamp.is-pass{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
#board .bd-stamp.is-miss{color:var(--danger);background:color-mix(in srgb,var(--danger) 16%,transparent)}
#board .bd-stamp.is-sp{box-shadow:inset 0 0 0 2px var(--x-ring)}
#board .is-past .bd-name{min-height:26px}

#board .bd-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px}
#board .bd-cell{display:flex;align-items:center;gap:5px;height:26px;padding:0 7px;border-radius:6px;min-width:0;
  font:700 var(--t-xs)/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--paper);background:var(--pn-soft)}
#board .bd-cell .bd-mk{width:12px;flex:none;text-align:center;font-weight:700}
#board .bd-cell .bd-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board .bd-cell.is-todo{background:transparent;box-shadow:inset 0 0 0 1px var(--line);font-weight:400;color:var(--paper-dim)}
#board .bd-cell.is-todo .bd-mk{width:0}
#board .bd-cell.is-pass .bd-mk{color:var(--ok)}
#board .bd-cell.is-miss{color:var(--paper-dim);background:color-mix(in srgb,var(--danger) 14%,transparent)}
#board .bd-cell.is-miss .bd-mk{color:var(--danger)}
#board .bd-cell.is-now{background:var(--brass);color:var(--ink)}
#board .bd-cell.is-now .bd-mk{color:var(--ink)}
#board .bd-cell.is-sp{box-shadow:inset 0 0 0 2px var(--x-ring)}
#board .bd-cell .bd-tw{width:16px;height:16px;margin-left:auto;color:var(--paper-dim)}
#board .bd-cell.is-now .bd-tw{color:var(--ink)}

#board .bd-row.is-far{padding-block:3px 4px}
#board .is-far .bd-cells{margin-top:1px}
#board .is-far .bd-cell{height:21px;background:transparent;box-shadow:none;color:var(--paper-dim);font-weight:400}
#board .is-far .bd-cell.is-sp{box-shadow:inset 0 0 0 2px var(--x-ring)}

#board .bd-hl{margin:5px 0 1px;padding:6px 9px 7px;border-radius:8px;background:var(--pn-well);
  border:1px dashed color-mix(in srgb,var(--brass) 50%,transparent);font-size:var(--t-xs);line-height:1.3;color:var(--paper-dim)}
#board .bd-hl b{color:var(--paper);font:600 var(--t-m)/1.2 var(--f-display);margin-right:2px}
#board .bd-hl .bd-hl-ic{width:20px;height:20px;margin-right:6px;vertical-align:-4px;color:var(--brass)}
#board .is-now .bd-hl{border-style:solid;border-color:color-mix(in srgb,var(--brass) 70%,transparent)}

/* target curve */
#board .bd-curve{flex:none;padding:8px 2px 0;border-top:1px solid var(--line)}
#board .bd-h3{margin:0 0 4px;font:600 var(--t-m)/1.2 var(--f-display);color:var(--paper)}
#board .sp{display:block;width:100%;height:auto;overflow:visible}
#board .sp-grid{stroke:var(--line);stroke-width:1}
#board .sp-band{fill:var(--pn-soft)}
#board .sp-lab{fill:var(--paper-dim);font:400 16px/1 var(--f-ui);font-variant-numeric:tabular-nums}
#board .sp-f.is-now{fill:var(--brass);font-weight:700}
#board .sp-tg{fill:none;stroke:var(--paper-dim);stroke-width:2;stroke-linejoin:round}
#board .sp-tg.is-next{stroke-dasharray:4 4;opacity:.55}
#board .sp-now{stroke:var(--brass);stroke-width:1.5;stroke-dasharray:3 3}
#board .sp-nowdot{fill:var(--bg);stroke:var(--brass);stroke-width:2.5}
#board .sp-pass{fill:var(--aah);stroke:var(--bg);stroke-width:2}
#board .sp-halo{stroke:var(--bg);stroke-width:6;stroke-linecap:round}
#board .sp-miss{stroke:var(--danger);stroke-width:2.5;stroke-linecap:round;fill:none}
#board .sp-sp{fill:none;stroke:var(--x-ring);stroke-width:1.75}
#board .sp-dot{transform-box:fill-box;transform-origin:center}
#board .sp-dot.is-new{animation:pn-pop 480ms var(--ease-back) both}
#board .sp-legend{margin:2px 0 0;display:flex;flex-wrap:wrap;gap:0 10px;color:var(--paper-dim);font-size:var(--t-xs);line-height:1.3}
#board .sp-lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#board .sp-lg svg{height:14px;width:auto;overflow:visible}
#board .sp-lg svg[viewBox="0 0 22 10"]{height:10px}
#board .sp-lg .sp-miss{stroke-width:2.2}

/* =================== SHOW LOG =================== */
#showlog .sl-scrim{display:none}
#showlog .sl-panel{gap:10px;padding:16px 14px 12px}
#showlog .sl-head{flex:none}
#showlog .sl-title-row{display:flex;align-items:center;gap:10px;min-height:28px}
#showlog .sl-title{margin:0;font:600 var(--t-l)/1.1 var(--f-display);color:var(--paper)}
#showlog .sl-live{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--aah) 16%,transparent);color:var(--aah);font:700 var(--t-xs)/1.2 var(--f-ui)}
#showlog .sl-live i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pn-pulse 1s ease-in-out infinite}
#showlog .sl-close{display:none;margin-left:auto;padding:0;width:var(--tap);font-size:var(--t-m)}
#showlog .sl-sub{margin:4px 0 0;color:var(--paper-dim);font-size:var(--t-s);line-height:1.3}
#showlog .sl-tg{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--paper-dim)}
#showlog .sl-tg b{color:var(--paper)}
#showlog .sl-rule,#showlog .sl-sp{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-size:var(--t-xs);line-height:1.2;color:var(--paper)}
#showlog .sl-rule{border:1px solid color-mix(in srgb,var(--brass) 60%,transparent)}
#showlog .sl-rx{margin:6px 0 0;color:var(--paper-dim);font-size:var(--t-xs);line-height:1.35}
#showlog .sl-rx .sl-rule{margin-right:2px;vertical-align:1px}
#showlog .sl-rule .pn-ic{color:var(--brass);width:16px;height:16px;vertical-align:0}
#showlog .sl-sp{box-shadow:inset 0 0 0 2px var(--x-ring)}

/* lines, cheer and Applause scroll as one log; the header and the Logbook button stay put */
#showlog .sl-body{flex:1 1 auto;min-height:0;overflow:auto;margin:0 -6px 0 0;padding:6px 6px 12px 0;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;border-top:1px solid var(--line)}
#showlog .sl-lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#showlog .sl-line{padding:7px 6px 8px;border-radius:8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
#showlog .sl-line:last-child{border-bottom-color:transparent}
#showlog .sl-line.is-in{animation:pn-in 260ms var(--ease-out) both}
#showlog .sl-line.is-fav{background:color-mix(in srgb,var(--brass) 9%,transparent)}
#showlog .sl-l1{display:flex;align-items:center;gap:8px;min-width:0}
#showlog .sl-tube{flex:none;min-width:32px;height:24px;padding:0 5px;border-radius:5px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--wood-hi) 55%,transparent);color:var(--paper);font:700 var(--t-xs)/1 var(--f-ui);
  box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--brass) 55%,transparent)}
#showlog .sl-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:700 var(--t-s)/1.3 var(--f-ui);color:var(--paper)}
#showlog .sl-col{font-weight:400;color:var(--paper-dim)}
#showlog .sl-star{margin-left:5px;color:var(--aah);font-size:var(--t-xs)}
#showlog .sl-fav{flex:none;color:var(--brass);font-weight:700;white-space:nowrap}   /* beside the name, which truncates first */
#showlog .sl-key{flex:none;display:flex;justify-content:space-between;gap:8px;margin:0;padding:2px 0 4px;white-space:nowrap;color:var(--paper-dim);font:400 var(--t-xs)/1.3 var(--f-ui)}
#showlog .sl-panel:has(.sl-empty) .sl-key{display:none}
#showlog .sl-dim{color:var(--paper-dim);font-weight:400}
#showlog .sl-flag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;border:1px solid var(--paper-dim);
  font-weight:400;font-size:var(--t-xs);line-height:1.3;color:var(--paper-dim)}
#showlog .sl-flag.is-dud{border-style:dashed}
#showlog .sl-chips .sl-flag{margin-left:0}
#showlog .sl-flag.is-shot{border-color:transparent;background:var(--pn-soft);color:var(--paper)}
#showlog .sl-run{flex:none;margin-left:auto;padding-left:6px;color:var(--paper-dim);font:400 var(--t-xs)/1.3 var(--f-ui);white-space:nowrap}
#showlog .sl-run i{font-style:normal;margin:0 3px}   /* no dimming: paper-dim is already at the 4.5:1 floor on the wood-tinted top */
#showlog .sl-chips{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:5px 0 0 40px}
#showlog .sl-sees{color:var(--paper-dim);font-size:var(--t-xs);margin-right:2px}
#showlog .sl-c{min-height:24px;font-size:var(--t-xs)}
#showlog .sl-c em{font-style:normal;font-weight:400;opacity:.85}
#showlog .sl-t{font-size:var(--t-xs);color:var(--paper-dim);padding:0 2px}
