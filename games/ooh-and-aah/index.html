#showlog .sl-crowd,#showlog .sl-coin{color:var(--paper)}
#showlog .is-dud .sl-name{color:var(--paper-dim)}
#showlog .sl-empty{padding:14px 6px;color:var(--paper-dim);line-height:1.45}
#showlog .sl-empty p{margin:0 0 8px}
#showlog .sl-ex{margin:16px 0 0;padding:10px 10px 8px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--brass) 45%,transparent)}
#showlog .sl-ex figcaption{font:600 var(--t-m)/1.2 var(--f-display);color:var(--paper);margin-bottom:6px}
#showlog .sl-ex-line{padding:6px 4px;border-bottom:0;background:var(--pn-soft)}
#showlog .sl-ex-key{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px;font-size:var(--t-xs);line-height:1.35}
#showlog .sl-ex-key b{color:var(--paper)}
#showlog .sl-empty-h{font:600 var(--t-m)/1.25 var(--f-display);color:var(--paper)}

#showlog .sl-sum{display:flex;flex-direction:column;gap:8px;margin-top:6px}
#showlog .sl-sum:empty{display:none}
#showlog .sl-cheer{display:flex;align-items:center;gap:8px;padding:6px 6px 8px;border-bottom:1px solid var(--line);color:var(--paper);font-weight:700}
#showlog .sl-cheer .chip{margin-left:auto}
#showlog .sl-cheer-ic{width:32px;display:grid;place-items:center;color:var(--brass)}
#showlog .sl-cheer-ic .pn-ic{width:24px;height:16px;vertical-align:0}
#showlog .sl-app{padding:12px 14px 12px;border-radius:12px;background:var(--pn-well);border:1px solid var(--line)}
#showlog .sl-app.is-pass{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
#showlog .sl-app.is-miss{border-color:color-mix(in srgb,var(--danger) 65%,transparent)}
#showlog .sl-app-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#showlog .sl-app-lbl{display:flex;flex-direction:column;gap:2px;font:600 var(--t-m)/1.2 var(--f-display);color:var(--paper-dim)}
#showlog .sl-app-tg{font:400 var(--t-xs)/1.2 var(--f-ui);color:var(--paper-dim)}
#showlog .sl-app-v{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0}
#showlog .sl-app-n{font:italic 700 var(--t-xxl)/1 var(--f-display);color:var(--paper);letter-spacing:-.01em}
#showlog .sl-app-x{font:400 var(--t-xs)/1.2 var(--f-ui);color:var(--paper-dim)}
#showlog .is-pending .sl-app-n{color:var(--paper-dim)}
#showlog .sl-app-eq{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--paper-dim)}
#showlog .sl-app-eq .chip{font-size:var(--t-s)}
#showlog .sl-verdict{margin-top:10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font:700 var(--t-m)/1.2 var(--f-ui)}
#showlog .sl-ok{color:var(--ok)}
#showlog .sl-bad{color:var(--danger)}
#showlog .sl-encore{font:italic 700 var(--t-m)/1.2 var(--f-display);color:var(--aah)}
#showlog .sl-pay{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:4px;color:var(--paper-dim);font-size:var(--t-xs);line-height:1.25}
#showlog .sl-pb{white-space:nowrap;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
#showlog .sl-pb.is-coin{color:var(--aah);border-color:color-mix(in srgb,var(--aah) 35%,transparent)}
#showlog .sl-pb.is-crowd{color:var(--paper)}
#showlog .sl-pb.is-card{color:var(--x-ring);border-color:color-mix(in srgb,var(--x-ring) 45%,transparent)}
#showlog .sl-pb.is-none{border-style:dashed}
#showlog .sl-after{flex:0 0 100%;margin-top:4px;color:var(--paper)}
#showlog .sl-note{margin:0;padding:8px 10px;border-radius:8px;border:1px solid var(--danger);color:var(--paper);font-size:var(--t-s)}
#showlog .sl-note.is-relight,#showlog .sl-note.is-won{border-color:var(--brass)}

#showlog .sl-foot{flex:none;display:flex}
#showlog .sl-book{flex:1;gap:8px}
#showlog .sl-book .pn-ic{color:var(--brass);vertical-align:0}
#showlog .sl-book kbd{margin-left:4px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);
  font:400 var(--t-xs)/1.2 var(--f-ui);color:var(--paper-dim)}
#showlog .sl-panel.is-flash{animation:pn-flash 900ms var(--ease-out)}

/* ---------- the 'showlog' bottom sheet (< 1200 px) ---------- */
@media (max-width:1199.98px){
  #showlog.is-sheet{display:block;position:absolute;inset:0;z-index:45;overflow:hidden;padding:0}
  #showlog.is-sheet .sl-scrim{display:block;position:absolute;inset:0;background:var(--scrim);animation:pn-fade 200ms var(--ease-out) both}
  /* the whole sheet scrolls (more room for the lines on a phone); the header stays pinned */
  #showlog.is-sheet .sl-panel.sheet{background:linear-gradient(var(--surface-2),var(--surface-2)),var(--bg);display:flex;flex-direction:column;max-height:calc(100% - 40px);overflow:auto;overscroll-behavior:contain;
    padding:0 16px calc(env(safe-area-inset-bottom,0px) + 12px);box-shadow:0 -12px 40px color-mix(in srgb,var(--ink) 70%,transparent);
    animation:pn-up 260ms var(--ease-out) both}
  #showlog.is-sheet .sl-head{position:sticky;top:0;z-index:1;margin:0 -16px;padding:8px 16px 8px;background:linear-gradient(var(--surface-2),var(--surface-2)),var(--bg);
    border-bottom:1px solid var(--line)}
  #showlog.is-sheet .sl-head::before{content:"";display:block;width:40px;height:4px;margin:0 auto 6px;border-radius:2px;background:var(--line)}
  #showlog.is-sheet .sl-close{display:inline-flex}
  #showlog.is-sheet .sl-body{flex:none;overflow:visible;margin:0;border-top:0;padding:4px 0 4px;-webkit-mask-image:none;mask-image:none}
  #showlog.is-sheet .sl-app-n{font-size:var(--t-xl)}
  #showlog.is-sheet .sl-chips{margin-left:40px}
}
@media (max-width:1199.98px) and (pointer:coarse){
  #showlog .sl-book kbd{display:none}
}
@media (max-width:380px){
  #showlog.is-sheet .sl-chips{margin-left:0}
  #showlog.is-sheet .sl-panel.sheet{padding-inline:12px}
  #showlog.is-sheet .sl-head{margin-inline:-12px;padding-inline:12px}
}

/* ---------- high contrast: no glows, solid rims ---------- */
:root[data-contrast="high"] #board .bd,:root[data-contrast="high"] #showlog .sl-panel{background:var(--surface);box-shadow:none;border-color:var(--line)}
:root[data-contrast="high"] #board .bd-row.is-now{box-shadow:inset 4px 0 0 var(--brass);border-color:var(--brass)}
:root[data-contrast="high"] #board .bd-cell.is-todo{box-shadow:inset 0 0 0 1px var(--paper-dim)}
:root[data-contrast="high"] #board .sp-band{fill:none}
:root[data-contrast="high"] #board .sp-grid{stroke:var(--paper-dim);stroke-opacity:.5}
:root[data-contrast="high"] #showlog .sl-line{border-bottom-color:var(--paper-dim)}
:root[data-contrast="high"] #showlog .sl-tube{background:var(--ink);box-shadow:inset 0 0 0 1px var(--paper)}
:root[data-contrast="high"] #board .bd-list,:root[data-contrast="high"] #showlog .sl-body{-webkit-mask-image:none;mask-image:none}

@keyframes pn-pulse{50%{opacity:.3}}
@keyframes pn-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pn-pop{0%{transform:scale(0);opacity:0}100%{transform:none;opacity:1}}
@keyframes pn-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pn-fade{from{opacity:0}}
@keyframes pn-flash{0%{box-shadow:0 0 0 3px var(--brass)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){
  #board .sp-dot.is-new,#showlog .sl-line.is-in,#showlog.is-sheet .sl-panel.sheet{animation:none}
  #showlog .sl-live i{animation:none}
}
:root[data-motion="reduced"] #board .sp-dot.is-new,:root[data-motion="reduced"] #showlog .sl-line.is-in,
:root[data-motion="reduced"] #showlog.is-sheet .sl-panel.sheet,:root[data-motion="reduced"] #showlog .sl-live i{animation:none}
/* ==== end.css ==== */
/* ============================================================
   Ooh × Aah — end screen (UI_END, spec §8.2). Scoped under #end.
   Tokens come from base.css; nothing here redefines them.
============================================================ */

/* ---------- the overlay: a scrolling card ---------- */
#end{display:block;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 8px 0;user-select:text;-webkit-user-select:text;
  scroll-padding:12px 0 calc(env(safe-area-inset-bottom,0px) + 104px)}   /* focus scrolls clear of the sticky bar */
#end[data-won="0"]{background:rgba(3,5,12,.84)}
#end[data-won="1"]{background:linear-gradient(180deg,rgba(3,5,12,.18) 0,rgba(3,5,12,.55) 260px,var(--scrim) 520px)}
:root[data-contrast="high"] #end{background:var(--scrim)}
#end .end-card{position:relative;width:min(100%,600px);margin:0 auto;padding:20px 16px 0;
  background:linear-gradient(180deg,var(--sky-horizon) 0,var(--sky-top) 340px);
  border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:16px 16px 0 0;
  box-shadow:0 18px 60px rgba(0,0,0,.55);animation:end-rise .42s var(--ease-out) both}
#end[data-won="1"] .end-card{animation-delay:.45s}
:root[data-motion="reduced"] #end .end-card{animation:none}
@media (prefers-reduced-motion: reduce){ #end .end-card{animation:none} }
@keyframes end-rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

/* ---------- 1. header ---------- */
#end .end-head{text-align:center;padding-bottom:12px}
#end .end-title{margin:0;font:600 var(--t-xl)/1.12 var(--f-display);font-optical-sizing:auto;text-wrap:balance;color:var(--paper)}
#end .end-eyebrow{display:block;font:400 var(--t-m)/1.3 var(--f-ui);color:var(--paper-dim);margin-bottom:4px}
#end[data-won="1"] .end-title{font:italic 700 var(--t-xxl)/1.05 var(--f-display);color:var(--aah)}
#end .end-sub{margin:8px auto 0;max-width:36ch;color:var(--paper-dim);font-size:var(--t-s)}
#end .end-spark{margin:0 0 4px;display:flex;justify-content:center;gap:14px;color:var(--aah);font-size:var(--t-l);line-height:1}
#end .end-spark span{animation:end-twinkle 1.4s ease-in-out infinite alternate}
#end .end-spark span:nth-child(2n){animation-delay:.35s;color:var(--c-fusion)}
#end .end-spark span:nth-child(3){animation-delay:.7s;color:var(--paper)}
@keyframes end-twinkle{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
#end .end-tags{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;row-gap:2px;color:var(--paper-dim)}
#end .end-tags li{white-space:nowrap}
#end .end-tags li + li::before{content:"·";margin:0 6px;color:var(--paper-dim)}
#end .end-tags b{color:var(--paper)}
#end .end-tags .end-tag-fw b{color:var(--aah)}

/* ---------- 2. poster ---------- */
#end .end-poster{margin:4px 0 0}
#end .end-poster canvas{display:block;box-sizing:border-box;width:100%;height:182px;border-radius:var(--radius);border:1px solid var(--line);background:var(--sky-top)}

/* ---------- sections ---------- */
#end .end-sec{padding:16px 0;border-top:1px solid var(--line)}
#end .end-poster + .end-grid > .end-col:first-child > .end-sec:first-child{border-top:0}
#end .end-sec h3{margin:0 0 10px;font:600 var(--t-m)/1.2 var(--f-display);color:var(--paper)}
#end .end-dim{margin:4px 0 0;color:var(--paper-dim)}
#end .end-wait{color:var(--paper-dim);font-style:italic;animation:end-pulse 1.2s ease-in-out infinite alternate}
@keyframes end-pulse{from{opacity:.55}to{opacity:1}}
#end p{margin:0}

/* ---------- 3 & 8. charts (inline SVG; colours are tokens) ---------- */
#end .end-plot{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;line-height:0}
#end .end-svg{display:block;max-width:100%}
#end .end-svg text{font:700 16px/1 var(--f-ui);font-variant-numeric:tabular-nums}
#end .ec-lbl{fill:var(--paper-dim);font-weight:400}
#end .ec-val{fill:var(--paper);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
#end .ec-band{fill:var(--paper);opacity:.05}
#end .ec-grid{stroke:var(--line);stroke-width:1}
#end .ec-target{fill:none;stroke:var(--paper-dim);stroke-width:2;stroke-dasharray:5 4}
#end .ec-line{fill:none;stroke:var(--aah);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#end .ec-dot{fill:var(--aah);stroke:var(--bg);stroke-width:2}
#end .ec-crown{fill:var(--aah);stroke:var(--bg);stroke-width:1.5;stroke-linejoin:round}
#end .ec-crown.miss{fill:var(--danger)}
#end .ec-halo{fill:var(--bg)}
#end .ec-miss{fill:none;stroke:var(--danger);stroke-width:3;stroke-linecap:round}
#end .ec-ring{fill:none;stroke:var(--x-ring);stroke-width:2}
#end .ec-hit{fill:transparent}
#end .end-svg g:hover .ec-dot,#end .end-svg g:hover .ec-crown{stroke:var(--paper)}
#end .ep-bar{fill:var(--aah)}
#end .ep-bar.dim{fill:var(--paper-dim);opacity:.5}
#end .end-svg g:hover .ep-bar{opacity:1;filter:brightness(1.12)}
#end .ep-cum{fill:none;stroke:var(--paper);stroke-width:2;stroke-linejoin:round}
#end .ep-dot{fill:var(--paper);stroke:var(--bg);stroke-width:2}
#end .ep-80{stroke:var(--paper-dim);stroke-width:1.5;stroke-dasharray:4 4}
#end .ep-crowd{fill:var(--paper)}
#end .ep-shape{stroke:var(--bg);stroke-width:1}
#end .end-legend{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--paper-dim)}
#end .end-legend li{display:inline-flex;align-items:center;gap:6px}
#end .end-legend svg{overflow:visible}
#end .end-cap{margin-top:10px}
#end .end-key{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:2px 16px;color:var(--paper)}
#end .end-key li.dim{color:var(--paper-dim)}
#end .end-key b{display:inline-block;min-width:2.2ch;color:var(--aah)}
#end .end-key li.dim b{color:var(--paper-dim)}
#end .end-key-ico{vertical-align:-2px}
#end .end-key b .ep-crowd{fill:currentColor}

/* ---------- 4. best show ---------- */
#end .end-stat{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
#end .end-big{font:italic 700 var(--t-xl)/1 var(--f-display);color:var(--aah)}
#end .end-stat-txt{color:var(--paper-dim)}

/* ---------- 5 & 6. near-miss and lesson ---------- */
#end .end-note > div,#end .end-note > p{padding:12px 14px;border-radius:var(--radius);background:var(--ooh-bg);border-left:4px solid var(--brass)}
#end .end-near > div{border-left-color:var(--danger)}
#end .end-near > div p + p{margin-top:6px}
#end .end-near > div p:first-child{font-weight:700}

/* ---------- 7. unlocks ---------- */
#end .end-ms + .end-ms{margin-top:12px}
#end .end-ms-top{margin:0}
#end .end-ms-p{color:var(--paper-dim);white-space:nowrap}
#end .end-bar{height:10px;margin-top:6px;border-radius:999px;background:var(--line);overflow:hidden}
#end .end-bar i{display:block;height:100%;min-width:4px;border-radius:999px;background:var(--aah)}
:root[data-contrast="high"] #end .end-bar{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
#end .end-sil,#end .end-new{display:flex;align-items:center;gap:12px;margin-top:14px}
#end .end-news{list-style:none;margin:0;padding:0}
#end .end-new{margin-top:6px;padding:6px 12px 6px 6px;min-height:44px;border-radius:var(--radius);background:rgba(242,193,78,.1);border:1px solid var(--brass)}
#end .end-news-note{margin:8px 0 0}
#end .end-new b{display:block;color:var(--aah)}
#end .end-new-what{display:block;color:var(--paper);line-height:1.3}
#end .end-new-ico{width:48px;text-align:center;color:var(--aah);font-size:var(--t-l)}

/* ---------- shell tokens (canvas plate + DOM monogram) ---------- */
#end .end-tok{position:relative;flex:none;display:inline-block;width:48px;height:56px}
#end .end-tok canvas{display:block}
#end .end-mono{position:absolute;right:1px;bottom:0;font:700 var(--t-xs)/1 var(--f-ui);color:var(--paper);
  text-shadow:0 0 3px var(--bg),0 0 2px var(--bg)}
#end .end-kopt .end-mono,#end .end-new .end-mono,#end .end-sil .end-tok:not([data-tok$="|s"]) .end-mono{display:none}   /* the name sits right beside it */
#end .end-tok-none{display:grid;place-items:center;border:2px dashed var(--line);border-radius:var(--radius);color:var(--paper-dim);font-size:var(--t-l)}

/* ---------- 9. keepsake picker ---------- */
#end .end-keep{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#end .end-kopt{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:76px;min-height:var(--tap);padding:8px 6px;
  border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--paper)}
#end .end-kopt:hover{border-color:var(--paper-dim)}
#end .end-kopt[aria-checked="true"]{border-color:var(--brass);background:rgba(242,193,78,.12);box-shadow:0 0 0 1px var(--brass)}
#end .end-kname{font-size:var(--t-s);font-weight:700;text-align:center;line-height:1.15;white-space:nowrap}

/* ---------- 10. buttons ---------- */
#end .end-more{display:flex;flex-wrap:wrap;gap:8px}
#end .end-more .btn{flex:1 1 136px;min-width:0}
#end .end-more [data-end="kit"],#end .end-more [data-end="renown"]{flex:1 1 auto;white-space:nowrap}   /* side by side when both fit, else stacked */
#end .end-more [data-end="daily"]{flex-basis:100%}
#end .end-more-hint{flex-basis:100%;margin:2px 0 0;text-align:center}
#end .end-pick{margin-top:10px;display:grid;gap:6px;padding:8px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
#end .end-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:var(--tap);padding:8px 12px;text-align:left;
  border:2px solid transparent;border-radius:var(--radius-s);background:transparent;color:var(--paper)}
#end .end-opt span{color:var(--paper-dim);font-size:var(--t-s)}
#end .end-opt:hover{border-color:var(--line)}
#end .end-opt[aria-pressed="true"]{border-color:var(--brass);background:rgba(242,193,78,.1)}
#end .end-opt[aria-pressed="true"] b::after{content:" ✓";color:var(--aah)}
#end .end-actions{position:sticky;bottom:0;z-index:2;display:flex;gap:8px;margin:8px -16px 0;
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--sky-top);border-top:1px solid var(--line);
  box-shadow:0 -10px 24px rgba(0,0,0,.35)}
#end #run-it-back{flex:1 1 auto;min-height:52px;font-size:var(--t-m)}
#end .end-party{flex:0 1 40%;min-height:52px;border-color:var(--aah);color:var(--aah)}
#end .end-kbd{display:none;margin-left:10px;padding:1px 7px;border-radius:5px;border:1px solid currentColor;font:700 var(--t-xs)/1.2 var(--f-ui);opacity:.7}
@media (hover:hover) and (pointer:fine) and (min-width:600px){ #end .end-kbd{display:inline-block} }

/* ---------- wide screens: two columns ---------- */
@media (min-width:960px){
  #end{padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
  #end .end-card{width:min(100%,960px);padding:24px 28px 0}
  #end .end-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px}
  #end .end-grid > .end-col > .end-sec:first-child{border-top:0}
  #end .end-actions{margin-inline:-28px;padding-inline:28px;justify-content:center}
  #end #run-it-back{flex:0 1 360px}
  #end .end-party{flex:0 1 240px}
}
/* ==== menus.css ==== */
/* ============================================================
   menus.css — UI_MENUS: #pause-menu #settings #logbook #help
   #toasts #tap-continue. Tokens come from base.css only.
   Look: lantern-lit panels, brass double rules, Fraunces heads.
============================================================ */

/* ---------- shared panel frame ---------- */
:is(#pause-menu,#settings,#logbook,#help) > .m-panel{
  display:flex;flex-direction:column;padding:0;overflow:hidden;position:relative;
  background:radial-gradient(120% 44% at 50% 0%,rgba(242,193,78,.13),transparent 62%),linear-gradient(var(--surface-2),var(--surface-2)),var(--bg);
  border:1px solid var(--brass);border-radius:16px;
  box-shadow:inset 0 0 0 3px var(--surface-2),inset 0 0 0 4px rgba(201,162,39,.32),0 24px 64px rgba(0,0,0,.55)}
:is(#pause-menu,#settings,#logbook,#help) .m-head{display:flex;align-items:flex-start;gap:12px;flex:none;
  padding:18px 16px 12px 20px;border-bottom:1px solid var(--line)}
:is(#pause-menu,#settings,#logbook,#help) .m-titles{flex:1;min-width:0}
:is(#pause-menu,#settings,#logbook,#help) .m-eyebrow{margin:0 0 2px;font:700 var(--t-xs)/1.2 var(--f-ui);
  letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
:is(#pause-menu,#settings,#logbook,#help) .m-head h2{margin:0;font:600 var(--t-xl)/1.1 var(--f-display);text-wrap:balance}
:is(#pause-menu,#settings,#logbook,#help) .m-title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
:is(#pause-menu,#settings,#logbook,#help) .m-x{flex:none;width:var(--tap);height:var(--tap);padding:0;border-radius:999px;background:transparent}
:is(#pause-menu,#settings,#logbook,#help) .m-x:hover{border-color:var(--brass);color:var(--aah)}
:is(#pause-menu,#settings,#logbook,#help,#toasts) .m-ico{width:22px;height:22px;flex:none}
:is(#pause-menu,#settings,#logbook,#help) .m-body{position:relative;flex:1 1 auto;min-height:0;overflow:auto;padding:16px;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
:is(#pause-menu,#settings,#logbook,#help) .m-foot{flex:none;padding:12px 16px;border-top:1px solid var(--line);background:rgba(3,5,12,.25)}
:is(#pause-menu,#settings,#logbook,#help) .m-wide{width:100%;min-height:52px;font-size:var(--t-m)}
:is(#pause-menu,#settings) [data-armed="true"]{background:var(--danger);border-color:var(--danger);color:var(--ink)}
:is(#pause-menu,#settings,#logbook,#help) h3.display{margin:0;font:600 var(--t-l)/1.2 var(--f-display)}

/* ---------- PAUSE ---------- */
#pause-menu > .pm-panel{width:min(100%,400px)}
#pause-menu .m-bunting{display:block;width:100%;height:32px;flex:none;margin-bottom:-6px}
#pause-menu .b-line{stroke:var(--brass);stroke-width:1.5;vector-effect:non-scaling-stroke}
#pause-menu .b-R{fill:var(--c-R)} #pause-menu .b-A{fill:var(--c-A)} #pause-menu .b-G{fill:var(--c-G)}
#pause-menu .b-B{fill:var(--c-B)} #pause-menu .b-W{fill:var(--c-W)}
#pause-menu .pm-head{text-align:center;border-bottom:0;padding:6px 20px 4px}
#pause-menu .m-head h2{font-size:var(--t-xxl)}
#pause-menu .m-sub{display:grid;margin:6px 0 0;color:var(--paper-dim);font-size:var(--t-s)}
#pause-menu .m-sub span:first-child{color:var(--paper)}
#pause-menu .m-sub:empty{display:none}
#pause-menu .pm-body{display:grid;gap:12px;padding:12px 20px 20px}
#pause-menu .pm-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#pause-menu .pm-tile{flex-direction:column;min-height:76px;gap:6px;padding:10px 4px;background:var(--wood);border-color:var(--wood-hi)}
#pause-menu .pm-tile .m-ico{color:var(--aah);width:26px;height:26px}
#pause-menu .pm-tile:hover{border-color:var(--brass)}
#pause-menu .pm-ticket{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 8px;
  padding:4px 6px 0 16px;border:1px dashed var(--brass);border-radius:var(--radius);background:var(--ink)}
#pause-menu .pm-ticket-v{display:grid;min-width:0;padding-right:8px;border-right:1px dashed var(--brass)}
#pause-menu .pm-ticket-k{padding-top:6px;font:700 var(--t-xs)/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
#pause-menu .pm-seed-val{width:100%;min-width:0;min-height:var(--tap);padding:0;border:0;background:transparent;color:var(--paper);
  font:italic 700 var(--t-l)/1.1 var(--f-display);text-overflow:ellipsis;user-select:text;-webkit-user-select:text}
#pause-menu .pm-copy{align-self:center;padding:8px 12px;margin-bottom:4px;background:transparent}
#pause-menu .pm-copied{grid-column:1/-1;padding:0 0 6px;color:var(--ok);font-size:var(--t-s)}
#pause-menu .pm-copied:empty{display:none}
#pause-menu .pm-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0}
#pause-menu .pm-tags:empty{display:none}
#pause-menu .pm-chip{min-height:28px;padding:4px 10px;color:var(--paper);background:rgba(201,162,39,.16)}
#pause-menu .pm-abandon{margin-top:4px;white-space:nowrap}
#pause-menu .pm-abandon[data-armed="true"] .m-ico{display:none}

/* ---------- SETTINGS ---------- */
#settings > .st-panel{width:min(100%,560px)}
#settings .st-sec + .st-sec{margin-top:22px}
#settings .st-h{display:flex;align-items:center;gap:12px;margin:0 0 10px}
#settings .st-h .m-rule,#help .hp-sec h3 .m-rule{flex:1;height:1px;background:linear-gradient(90deg,var(--brass),transparent)}
#settings .st-row{display:flex;align-items:center;gap:12px;min-height:56px;margin:0 0 6px;padding:8px 12px;
  border-radius:var(--radius);background:rgba(255,255,255,.035)}
#settings label.st-row{cursor:pointer}
#settings label.st-row:hover{background:rgba(201,162,39,.08)}
#settings .st-text{flex:1;min-width:0;display:grid;gap:2px}
#settings .st-label{font:700 var(--t-m)/1.25 var(--f-ui);color:var(--paper)}
#settings .st-hint{font:400 var(--t-s)/1.35 var(--f-ui);color:var(--paper-dim)}
#settings .st-hint:empty{display:none}
#settings .st-sub{margin-top:-4px;padding-left:24px;background:transparent}
#settings .st-sub .st-label{font-weight:400;font-size:var(--t-s);flex:none}
#settings .st-sub[data-off="true"]{opacity:.55}
#settings .st-val{min-width:48px;text-align:right;font:700 var(--t-s)/1 var(--f-ui)}
/* switches: brass knob on a wooden track (state = knob side + fill) */
#settings .st-switch{appearance:none;-webkit-appearance:none;flex:none;width:56px;height:32px;margin:0;border-radius:999px;cursor:pointer;
  border:1px solid var(--wood-hi);background:radial-gradient(circle at 16px 50%,var(--paper-dim) 0 10px,transparent 11px),var(--wood)}
#settings .st-switch:checked{border-color:var(--brass);background:radial-gradient(circle at calc(100% - 16px) 50%,var(--ink) 0 10px,transparent 11px),var(--brass)}
#settings .st-switch:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
/* volume sliders */
#settings .st-range{--p:50%;flex:1;min-width:0;height:var(--tap);margin:0;background:transparent;appearance:none;-webkit-appearance:none;cursor:pointer}
#settings .st-range::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--brass) var(--p),var(--line) var(--p))}
#settings .st-range::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--brass) var(--p),var(--line) var(--p))}
#settings .st-range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:var(--aah);border:3px solid var(--ink)}
#settings .st-range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--aah);border:3px solid var(--ink)}
/* segmented radio groups */
#settings .st-radios{display:block;border:0;min-width:0}
#settings .st-radios legend{float:left;width:100%;padding:0}
#settings .st-radios .st-hint{display:block;clear:both}
#settings .st-seg{position:relative;clear:both;display:flex;margin-top:8px;padding:3px;border:1px solid var(--wood-hi);border-radius:999px;background:var(--ink)}
#settings .vh-radio{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
#settings .st-seg label{flex:1;display:grid;place-items:center;min-height:var(--tap);padding:4px 10px;border-radius:999px;cursor:pointer;
  font:700 var(--t-s)/1.1 var(--f-ui);color:var(--paper-dim);text-align:center}
#settings .st-seg label:hover{color:var(--paper)}
#settings .vh-radio:checked + label{background:var(--brass);color:var(--ink)}
#settings .vh-radio:focus-visible + label{outline:3px solid var(--focus);outline-offset:2px}
/* the labelled assist */
#settings .st-assist{padding:6px;border:1px dashed var(--x-ring);border-radius:12px;background:rgba(86,180,233,.06)}
#settings .st-assist .st-row{margin:0;background:transparent}
#settings .st-warn{display:block;padding:0 12px 8px;color:var(--aah)}
/* save tools */
#settings .st-block{display:grid;justify-items:start;gap:8px;margin:0 0 8px;padding:12px;border-radius:var(--radius);background:rgba(255,255,255,.035)}
#settings .st-block p{margin:0}
#settings .st-text-in{width:100%;min-height:88px;padding:10px;resize:vertical;border:1px solid var(--line);border-radius:var(--radius-s);
  background:var(--ink);color:var(--paper);font:400 var(--t-s)/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;
  user-select:text;-webkit-user-select:text}
#settings .st-text-in:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#settings .st-text-in::placeholder{color:var(--paper-dim);opacity:1}
#settings .st-note{font-size:var(--t-s);color:var(--paper-dim)}
#settings .st-note:empty{display:none}
#settings .st-note[data-kind="error"]{color:var(--danger)}
#settings .st-note[data-kind="ok"]{color:var(--ok)}

/* ---------- LOGBOOK (full-screen sheet) ---------- */
#logbook{place-items:stretch center;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 0}
#logbook > .lb-sheet{width:min(100%,1040px);height:100%;max-height:100%;border-bottom:0;border-radius:16px 16px 0 0}
#logbook .lb-total{margin:0;font:700 var(--t-s)/1 var(--f-ui);color:var(--aah);white-space:nowrap}
#logbook .lb-tabs{flex:none;display:flex;gap:0;overflow-x:auto;padding:6px 12px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
#logbook .lb-tabs::-webkit-scrollbar{display:none}
#logbook .lb-tabs[data-edge="r"]{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
#logbook .lb-tabs[data-edge="l"]{-webkit-mask-image:linear-gradient(90deg,transparent,#000 48px);mask-image:linear-gradient(90deg,transparent,#000 48px)}
#logbook .lb-tabs[data-edge="lr"]{-webkit-mask-image:linear-gradient(90deg,transparent,#000 48px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,transparent,#000 48px,#000 calc(100% - 48px),transparent)}
#logbook .lb-tab{flex:none;display:inline-flex;align-items:baseline;gap:6px;min-height:48px;padding:12px 12px 8px;border:0;
  border-bottom:3px solid transparent;border-radius:10px 10px 0 0;background:transparent;color:var(--paper-dim);font:700 var(--t-s)/1 var(--f-ui)}
#logbook .lb-tab:hover{color:var(--paper)}
#logbook .lb-tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--brass);background:linear-gradient(180deg,transparent,rgba(201,162,39,.14))}
#logbook .lb-tab:focus-visible{outline-offset:-3px}
#logbook .lb-tab-n{font-weight:400;color:var(--paper-dim)}
#logbook .lb-tab-n:empty{display:none}
#logbook .lb-body{padding:16px 12px 28px}
#logbook .lb-body:focus-visible,#help .hp-body:focus-visible{outline-offset:-3px}
#logbook .lb-lede{margin:0 4px 14px}
#logbook .lb-lede p{margin:0}
#logbook .lb-count{font:600 var(--t-l)/1.2 var(--f-display)}
#logbook .lb-count .num{color:var(--aah);font-family:var(--f-ui);font-weight:700}
#logbook .lb-intro{margin-top:4px!important;color:var(--paper-dim);max-width:60ch}
#logbook .lb-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 8px}
#logbook .lb-cell{display:flex;justify-content:center;min-width:0}
#logbook .lb-tile{width:100%;max-width:112px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 0 4px;
  border:0;border-radius:12px;background:none;color:var(--paper);text-align:center}
#logbook .lb-cap{max-width:100%;font:400 var(--t-s)/1.2 var(--f-ui);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#logbook .lb-tile:not([data-state="found"]) .lb-cap{color:var(--paper-dim)}
/* tile art (72 px) */
#logbook .lb-art{position:relative;flex:none;width:var(--art);height:var(--art);display:grid;place-items:center;overflow:hidden;
  border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.07),transparent 68%),var(--ink)}
#logbook .lb-tile[data-state="found"] .lb-art{border-color:rgba(201,162,39,.75)}
#logbook .lb-tile:not([data-state="found"]) .lb-art{border-style:dashed}
#logbook .lb-tile:hover .lb-art{border-color:var(--brass)}
#logbook .lb-tile[aria-expanded="true"] .lb-art{outline:2px solid var(--aah);outline-offset:2px}
#logbook .lb-art > *{grid-area:1/1}
#logbook .m-picto{position:relative;display:block}
#logbook .m-picto-fb{border-radius:50%;background:radial-gradient(circle,var(--paper) 0 8%,var(--c-A) 20%,transparent 62%)}
#logbook .m-picto-fb[data-col="R"]{background:radial-gradient(circle,var(--paper) 0 8%,var(--c-R) 20%,transparent 62%)}
#logbook .m-picto-fb[data-col="G"]{background:radial-gradient(circle,var(--paper) 0 8%,var(--c-G) 20%,transparent 62%)}
#logbook .m-picto-fb[data-col="B"]{background:radial-gradient(circle,var(--paper) 0 8%,var(--c-B) 20%,transparent 62%)}
#logbook .m-picto-fb[data-col="W"]{background:radial-gradient(circle,var(--paper) 0 8%,var(--c-W) 20%,transparent 62%)}
/* colour plates: shape + colour (§4.1), faint behind the pictogram */
#logbook .lb-plate{position:absolute;inset:20%;opacity:.3;background:var(--c-W)}
#logbook .lb-plate[data-col="R"]{border-radius:50%;background:var(--c-R)}
#logbook .lb-plate[data-col="A"]{clip-path:polygon(50% 4%,98% 92%,2% 92%);background:var(--c-A)}
#logbook .lb-plate[data-col="G"]{border-radius:18%;background:var(--c-G)}
#logbook .lb-plate[data-col="B"]{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:var(--c-B)}
#logbook .lb-plate[data-col="W"]{clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%)}
#logbook .lb-plate:is([data-col="X"],[data-col="*"]){border-radius:50%;opacity:.22;
  background:conic-gradient(var(--c-R) 0 25%,var(--c-A) 0 50%,var(--c-G) 0 75%,var(--c-B) 0)}
#logbook .lb-plate[data-col="X"]{border-radius:0;clip-path:polygon(50% 0,61% 30%,93% 20%,72% 45%,100% 62%,66% 66%,62% 100%,50% 72%,38% 100%,34% 66%,0 62%,28% 45%,7% 20%,39% 30%)}
#logbook .lb-badge{position:absolute;left:3px;right:3px;bottom:3px;display:flex;align-items:center;justify-content:center;gap:3px;
  padding:1px 4px;border-radius:6px;background:rgba(5,7,15,.85);color:var(--paper);font:700 var(--t-xs)/1.1 var(--f-ui);white-space:nowrap}
#logbook .lb-badge .m-ico{width:14px;height:14px;color:var(--aah);stroke-width:2.4}
#logbook .lb-mono{position:absolute;right:5px;bottom:3px;font:700 var(--t-xs)/1 var(--f-ui);color:var(--paper);text-shadow:0 1px 2px var(--ink),0 0 4px var(--ink)}
/* silhouettes: undiscovered entries */
#logbook .is-sil .m-picto{filter:brightness(0) drop-shadow(0 0 1px var(--paper-dim)) drop-shadow(0 0 1px var(--paper-dim));opacity:.9}
#logbook .is-sil .lb-plate{background:var(--line);opacity:.5}
#logbook .lb-fuse{display:flex;align-items:center;justify-content:center;gap:0}
#logbook .lb-fuse > span{position:relative;display:grid;place-items:center}
#logbook .lb-fuse > .is-sil::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;
  font:italic 700 var(--t-l)/1 var(--f-display);color:var(--paper-dim)}
#logbook .lb-arrow{color:var(--brass);font:700 var(--t-s)/1 var(--f-ui);margin:0 -1px}
#logbook .lb-glyph .m-ico{width:56%;height:56%;color:var(--aah)}
#logbook .lb-glyph.is-sil .m-ico{color:var(--paper-dim);opacity:.4}
#logbook .lb-kit{display:flex;align-items:center;justify-content:center}
#logbook .lb-kit > .m-ico{width:50%;height:50%;color:var(--aah)}
#logbook .lb-ms .lb-ring{position:absolute;inset:7%;width:86%;height:86%}
#logbook .lb-ring-bg{fill:none;stroke:var(--line);stroke-width:5}
#logbook .lb-ring-fg{fill:none;stroke:var(--brass);stroke-width:5;stroke-linecap:round}
#logbook .lb-ms-v{position:relative;font:700 var(--t-xs)/1 var(--f-ui);font-variant-numeric:tabular-nums}
#logbook .lb-ms.is-done{background:radial-gradient(circle,rgba(242,193,78,.22),transparent 70%),var(--ink)}
#logbook .lb-ms.is-done .lb-ring-fg{stroke:var(--aah)}
#logbook .lb-ms-ico{position:relative;width:44%!important;height:44%!important;color:var(--aah);stroke-width:2.6}
#logbook .lb-tech{margin-top:28px;padding:14px 16px;border:1px dashed rgba(201,162,39,.6);border-radius:12px;background:rgba(5,7,15,.35)}
#logbook .lb-tech ul{display:grid;gap:8px;margin:10px 0 0;padding-left:20px}
#logbook .lb-tech li::marker{color:var(--brass)}
#logbook .lb-tech b{color:var(--aah)}
#logbook .lb-empty{padding:32px 8px;text-align:center;color:var(--paper-dim);font:italic 700 var(--t-m)/1.4 var(--f-display)}
/* detail card, docked at the sheet's foot */
#logbook .lb-detail{position:relative;flex:none;max-height:50%;overflow:auto;display:grid;grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"art head" "body body";gap:10px 14px;align-items:center;
  padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--brass);
  background:linear-gradient(180deg,rgba(201,162,39,.12),transparent 48px),var(--surface-2);box-shadow:0 -14px 28px rgba(0,0,0,.45)}
#logbook .lb-d-x{position:absolute;top:8px;right:8px}
#logbook .lb-d-art{grid-area:art}
#logbook .lb-d-head{grid-area:head;min-width:0;padding-right:44px}
#logbook .lb-d-body{grid-area:body;min-width:0}
#logbook .lb-d-head h3{margin:0 0 6px}
#logbook .lb-d-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0}
#logbook .lb-d-chips .chip{min-height:28px;padding:4px 10px;color:var(--paper)}
#logbook .lb-d-line{margin:0 0 6px;color:var(--paper)}
#logbook .lb-rule{display:grid;gap:4px}
#logbook .lb-star b{color:var(--aah)}
/* records */
#logbook .lb-records{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:0}
#logbook .lb-rec{padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:var(--radius);background:var(--ink)}
#logbook .lb-rec dt{font:700 var(--t-xs)/1.2 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
#logbook .lb-rec dd{margin:6px 0 0;font:italic 700 var(--t-xl)/1.1 var(--f-display);color:var(--paper)}
#logbook .lb-rec.is-empty dd{font-size:var(--t-m);color:var(--paper-dim)}
#logbook .lb-rec-list{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:2px;font:400 var(--t-s)/1.35 var(--f-ui);color:var(--paper)}
#logbook .lb-rec-list li{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px dashed var(--line)}
#logbook .lb-rec-list li:last-child{border-bottom:0}
#logbook .lb-rec-list b{font:italic 700 var(--t-m)/1.2 var(--f-display);color:var(--aah)}
#logbook .lb-rec-sub{display:block;margin-top:4px;font:400 var(--t-s)/1.3 var(--f-ui);color:var(--paper-dim)}
/* posters */
#logbook .lb-posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
#logbook .lb-poster{margin:0;overflow:hidden;border:1px solid var(--brass);border-radius:12px;background:var(--ink)}
#logbook .lb-poster-sky{position:relative;height:180px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 115%,rgba(242,193,78,.28),transparent 55%),linear-gradient(180deg,var(--sky-top),var(--sky-horizon))}
#logbook .lb-poster-sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--ink);
  clip-path:polygon(0 60%,8% 60%,8% 30%,14% 30%,14% 55%,30% 55%,33% 0,36% 55%,52% 55%,52% 35%,60% 35%,60% 60%,76% 60%,76% 25%,82% 25%,82% 60%,100% 60%,100% 100%,0 100%)}
#logbook .lb-poster-col{position:absolute;left:calc(var(--x) * 100%);top:calc(var(--y) * 100%);transform:translateX(-50%)}
#logbook .lb-poster-col::after{content:"";position:absolute;left:50%;top:78%;width:1px;height:180px;background:linear-gradient(rgba(244,239,230,.35),transparent 70%)}
#logbook .lb-poster-cv{display:block;width:100%;height:180px}
#logbook .lb-poster figcaption{display:grid;gap:2px;padding:10px 14px 12px}
#logbook .lb-poster strong{font-size:var(--t-l);color:var(--aah)}
#logbook .lb-poster figcaption span{color:var(--paper-dim)}
@media (min-width:700px){
  #logbook{padding:24px}
  #logbook .lb-detail{grid-template-areas:"art head" "art body";align-items:start;padding-left:24px}
  #logbook .lb-d-head{padding-right:56px}
  #logbook > .lb-sheet{border-bottom:1px solid var(--brass);border-radius:16px}
  #logbook .lb-body{padding:20px 24px 32px}
  #logbook .lb-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:18px 12px}
}

/* ---------- HELP ---------- */
#help > .hp-panel{width:min(100%,640px)}
#help .hp-card{list-style:none;margin:6px 4px 24px;padding:10px 16px;border-radius:12px;background:var(--paper);color:var(--ink);
  box-shadow:0 0 0 1px var(--brass),0 0 0 5px var(--surface-2),0 0 0 6px rgba(201,162,39,.5),0 18px 40px rgba(0,0,0,.4)}
#help .hp-card li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;font:400 var(--t-m)/1.45 var(--f-ui)}
#help .hp-card li + li{border-top:1px dashed rgba(5,7,15,.3)}
#help .hp-n{font-size:var(--t-xl);line-height:1;color:var(--wood)}
#help .hp-sec h3{display:flex;align-items:center;gap:12px;margin:0 0 10px}
#help .hp-sec + .hp-sec{margin-top:24px}
#help .hp-gloss{margin:0}
#help .hp-gloss > div{display:grid;grid-template-columns:7em minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
@media (min-width:600px){#help .hp-gloss > div{grid-template-columns:10em minmax(0,1fr)}}
#help .hp-gloss dt{font-weight:700;color:var(--aah)}
#help .hp-gloss dd{margin:0}
#help .hp-keys{width:100%;border-collapse:collapse}
#help .hp-keys tr{border-bottom:1px solid var(--line)}
#help .hp-keys th{width:44%;padding:8px 12px 8px 0;text-align:left;font-weight:400;vertical-align:top}
#help .hp-keys td{padding:10px 0;vertical-align:top}
#help kbd{display:inline-block;min-width:30px;margin:2px 0;padding:2px 7px;border:1px solid var(--wood-hi);border-bottom-width:3px;border-radius:6px;
  background:var(--wood);color:var(--paper);font:700 var(--t-s)/1.3 var(--f-ui);text-align:center;white-space:nowrap}
#help .hp-note{color:var(--paper-dim)}

/* ---------- TOASTS ----------
   One at a time over the play screen, in the lowest free band of the sky (UI_MENUS measures the
   sky and sets left / width / top on #toasts); never over a show, a menu, a sheet or the end. */
#toasts{position:absolute;left:0;top:0;width:100%;z-index:95;display:flex;justify-content:center;pointer-events:none}
#toasts .toast{display:flex;align-items:center;gap:8px;max-width:min(100%,420px);padding:3px 14px 3px 3px;border:1px solid var(--brass);
  border-radius:999px;background:var(--surface-2);box-shadow:0 8px 24px rgba(0,0,0,.5);color:var(--paper);font:700 var(--t-s)/1.2 var(--f-ui);
  animation:m-toast-in .26s var(--ease-back) both}
#toasts .toast.is-measure{visibility:hidden;animation:none}
#toasts .toast.is-out{animation:m-toast-out .24s ease both}
#toasts .toast-ico{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brass);color:var(--ink)}
#toasts .toast-ico .m-ico{width:18px;height:18px;stroke-width:2.2}
#toasts .toast[data-kind="milestone"] .toast-ico{background:var(--aah)}
#toasts .toast:is([data-kind="logbook"],[data-kind="discover"],[data-kind="fusion"]) .toast-ico{background:var(--c-fusion)}
#toasts .toast[data-kind="unlock"] .toast-ico{background:var(--ok)}
#toasts .toast[data-kind="tip"]{border-radius:14px;border-color:var(--brass);background:var(--paper);color:var(--ink);font-weight:400}
#toasts .toast[data-kind="tip"] .toast-ico{background:var(--ink);color:var(--aah)}
#toasts .toast-k{font-weight:700;color:var(--wood)}
@keyframes m-toast-in{from{opacity:0;transform:translateY(10px) scale(.96)}}
@keyframes m-toast-out{to{opacity:0;transform:translateY(6px)}}
:root[data-motion="reduced"] #toasts .toast{animation-name:m-toast-fade}
@media (prefers-reduced-motion:reduce){#toasts .toast{animation-name:m-toast-fade}}
@keyframes m-toast-fade{from{opacity:0}}
:root[data-motion="reduced"] #toasts .toast.is-out{animation-name:m-toast-fade-out}
@media (prefers-reduced-motion:reduce){#toasts .toast.is-out{animation-name:m-toast-fade-out}}
@keyframes m-toast-fade-out{to{opacity:0}}

/* ---------- TAP TO CONTINUE ---------- */
#tap-continue{z-index:90;padding:0;background:radial-gradient(ellipse at 50% 40%,rgba(46,34,110,.5),transparent 70%),rgba(3,5,12,.88);cursor:pointer}
#tap-continue .tc-btn{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:24px;border:0;background:transparent;color:var(--paper);text-align:center}
#tap-continue .tc-btn:focus-visible{outline-offset:-10px;border-radius:16px}
#tap-continue .tc-moon{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 38% 38%,var(--paper) 0 28%,var(--aah) 78%);
  -webkit-mask:radial-gradient(circle at 72% 32%,transparent 0 36%,#000 37%);mask:radial-gradient(circle at 72% 32%,transparent 0 36%,#000 37%);
  filter:drop-shadow(0 0 18px rgba(242,193,78,.45));animation:m-breathe 3.2s ease-in-out infinite}
#tap-continue .tc-title{font-size:var(--t-xxl);line-height:1.05;color:var(--aah)}
#tap-continue .tc-sub{max-width:28ch;color:var(--paper-dim);font-size:var(--t-m)}
@keyframes m-breathe{50%{transform:scale(1.05);opacity:.9}}

/* ---------- high contrast: flat surfaces, white rules, no glows ---------- */
:root[data-contrast="high"] :is(#pause-menu,#settings,#logbook,#help) > .m-panel{background:var(--bg);border:2px solid var(--paper);box-shadow:none}
:root[data-contrast="high"] #logbook .lb-art,
:root[data-contrast="high"] #settings .st-switch,
:root[data-contrast="high"] #settings .st-seg,
:root[data-contrast="high"] #pause-menu .pm-ticket,
:root[data-contrast="high"] #toasts .toast{border:2px solid var(--paper)}
:root[data-contrast="high"] #settings .st-row,
:root[data-contrast="high"] #settings .st-block{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
:root[data-contrast="high"] #tap-continue .tc-moon{filter:none}
:root[data-contrast="high"] #help .hp-card{box-shadow:0 0 0 2px var(--paper)}

// Ooh × Aah: SIM module (spec DESIGN.md v1.1). Sections: 1 RNG · 2 DATA · 3 SIM · 4 HELPERS · 5 BOTS.
//
// `OohSim` is fully self-contained: it references no outer names, so the page can build a Blob Worker
// from `OohSim.toString()` (spec §11.5 in-page bots). State is plain JSON, advanced only by `step`.
// The SIM never reads Math.random or any clock (no Date at all); its only randomness is `state.rng` (sfc32, spec §11.3).
// Bots use their own xorshift32 (spec §12.1). Ported from the design-time v11 reference sim + bots.

  'use strict';
  const VERSION = '1.1.0';

  /* ================================================================== 1 · RNG (spec §11.3, exact) */
  function cyrb128(str){let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
   for(let i=0,k;i<str.length;i++){k=str.charCodeAt(i);h1=h2^Math.imul(h1^k,597399067);h2=h3^Math.imul(h2^k,2869860233);
    h3=h4^Math.imul(h3^k,951274213);h4=h1^Math.imul(h4^k,2716044179);}
   h1=Math.imul(h3^(h1>>>18),597399067);h2=Math.imul(h4^(h2>>>22),2869860233);h3=Math.imul(h1^(h3>>>17),951274213);
   h4=Math.imul(h2^(h4>>>19),2716044179);h1^=(h2^h3^h4);h2^=h1;h3^=h1;h4^=h1;return [h1>>>0,h2>>>0,h3>>>0,h4>>>0];}
  function rngNext(st){let [a,b,c,d]=st.rng;a|=0;b|=0;c|=0;d|=0;let t=(a+b|0)+d|0;d=d+1|0;a=b^b>>>9;b=c+(c<<3)|0;
   c=(c<<21|c>>>11);c=c+t|0;st.rng=[a>>>0,b>>>0,c>>>0,d>>>0];return (t>>>0)/4294967296;}   // sfc32
  // Seeding: st.rng = cyrb128(String(seed)); then call rngNext 15 times and discard the results.
  function seedRng(seed) { const st = { rng: cyrb128(String(seed)) }; for (let i = 0; i < 15; i++) rngNext(st); return st.rng; }
  // A private sfc32 stream (cosmetics: fxRng = seed + 'fx'; keepsake offers). Never stored in SIM state.
  function sfcStream(seedStr) { const st = { rng: seedRng(seedStr) }; return () => rngNext(st); }
  function fxRng(seed) { return sfcStream(String(seed) + 'fx'); }
  // Bot randomness (spec §12.1): xorshift32 seeded with (seedNumber × 2654435761) >>> 0.

  // ♛: resolves under no rule, then once per occupied tube with that tube emptied. Ties go left; empty rack → null.

  /* ================================================================== 3 · SIM: targets, rules, economy (spec §2.2, §5) */

  /* ---------- bookkeeping after a light: Logbook, records, milestones, run end ---------- */

  function milestoneRows() {
    return milestones().map(ms => ({id: ms.id, name: ms.name, goal: ms.goal, best: S.meta.progress[ms.id] || 0,
      run: S.runBest[ms.id] || 0, done: isDone(ms.id)}));
  }
  function milestoneDeltas() {
    return milestoneRows().map(d => ({...d, before: S.startProgress[d.id] || 0, after: d.best,
      newly: S.runUnlocks.some(u => u.kind === 'milestone' && u.id === d.id)})).filter(d => d.after > d.before || d.newly);
  }
  function flushToasts() {
    const list = S.pendingToasts;
    S.pendingToasts = [];
    for (const [text, kind] of list) toast(text, {kind});
  }

  /* ---------- Logbook discovery (§7.1) ---------- */
  function codexScan(st) {
    if (!st) return;
    const c = S.meta.codex;
    const see = (kind, table, id, init) => { if (id && table[id] == null) { table[id] = init; emit('discover', {kind, id}); } };
    const shop = st.shop || {};
    for (const card of shop.cards || []) if (card && card.id) see('shell', c.shells, card.id, {seen: true, owned: 0});
    const owned = [...st.tubes.map(t => t && t.shell), ...(st.crate || [])].filter(Boolean);
    for (const sh of owned) {
      see('shell', c.shells, sh.id, {seen: true, owned: 1});
      for (const f of fusionList()) if (f.a === sh.id && !c.fusions[f.key]) c.fusions[f.key] = {leftSeen: true, found: false, fired: 0};
    }
    // Headliners are posted a festival ahead: this festival's and the next one's.
    const s = st.show;
    for (const hs of [nextHeadliner(s), nextHeadliner(s) + 3]) for (const id of rulesAt(st, hs)) if (row('HEADLINERS', id) || id === 'countdown') see('headliner', c.headliners, id, 0);
    if (shop.rig && shop.rig.id) see('rig', c.rigs, shop.rig.id, 0);
  }
  function codexOnBuild(a, pre, events) {
    const c = S.meta.codex;
    if (a.type === 'buy') {
      const card = pre.shop && pre.shop.cards && pre.shop.cards[a.card];
      if (card && card.id) { const e = c.shells[card.id] || (c.shells[card.id] = {seen: true, owned: 0}); e.owned = (e.owned || 0) + 1; }
    }
    if (a.type === 'buyRig') { const rid = pre.shop && pre.shop.rig && pre.shop.rig.id; if (rid) c.rigs[rid] = (c.rigs[rid] || 0) + 1; }
    codexScan(S.state);
  }

  /* ---------- one-line tooltips (§4.13): shown once, as 'tip' toasts, dismissed by the next action ----------
     Core is the one place that queues tips (buildTips at each build open, actionTips after each action);
     UI_PLAY adds the triggers only it can see through tip(id): t_sky when a shell is lifted, t_fusion when
     a ✦ badge is drawn. One tip shows at a time. The queue is kept in TIP_ORDER (what the player is doing
     right now, tonight's rules and offer, the result card's Aah, the shop's ✦ and twin cards, then the rest), and a tip whose
     subject is not on screen right now (tipLive) waits in the queue until it is. */
  const TIP_ORDER = ['t_sky', 't_crate', 't_fuse', 't_rain', 't_head', 't_count', 't_match', 't_mood', 't_sponsor', 't_aah',
    't_fusion', 't_twin', 't_crowd', 't_interest', 't_rig', 't_tube'];
  const TIP_NOW = ['t_sky'];   // tied to a gesture in progress: shown at once, and the tip it replaces goes back to the queue
  const tipRank = id => { const i = TIP_ORDER.indexOf(id); return i < 0 ? TIP_ORDER.length : i; };
  function tipText(id) {
    const t = data().TOOLTIPS;
    const r = Array.isArray(t) ? t.find(x => x && x.id === id) : isObj(t) ? t[id] : null;
    return typeof r === 'string' ? r : r && (r.text || r.value) || null;
  }
  function ownedShells(st) { return [...(st.tubes || []).map(t => t && t.shell), ...(st.crate || [])].filter(Boolean); }
  function shopFuses(st) {   // a shop card (not a twin) that fuses with a shell you own: the card shows "✦ Fuses"
    const own = ownedShells(st), cards = (st.shop && st.shop.cards) || [];
    return cards.some(cd => cd && !cd.sold && !own.some(sh => sh.id === cd.id && (sh.star || 1) < 3) &&
      fusionList().some(f => (f.a === cd.id && own.some(sh => sh.id === f.b)) || (f.b === cd.id && own.some(sh => sh.id === f.a))));
  }
  function shopTwin(st) {
    const own = ownedShells(st);
    return ((st.shop && st.shop.cards) || []).some(cd => cd && !cd.sold && own.some(sh => sh.id === cd.id && (sh.star || 1) < 3));
  }
  // Is the thing this tip talks about on screen right now?
  function tipLive(id, st) {
    if (!st || st.phase !== 'build') return false;
    const rules = rulesAt(st, st.show), shop = st.shop;
    switch (id) {
      case 't_fuse': return !rules.some(r => r === 'windshift' || r === 'crossed' || /^countdown/.test(r));
      case 't_head': return rules.includes('headwind');
      case 't_count': return !st.endless && st.show >= 21;
      case 't_match': return rules.includes('windshift') || rules.includes('crossed');
      case 't_mood': return moodVisible();
      case 't_sponsor': return !!st.sponsor;
      case 't_fusion': return shopFuses(st);
      case 't_twin': return shopTwin(st);
      case 't_rig': return !!(shop && shop.rig && !shop.rig.sold);
      case 't_tube': return !!shop && !st.endless && st.tubes.length < 6;
      default: return true;
    }
  }
  function enqueueTip(id, front) {
    const q = S.tipQueue;
    if (front) { q.unshift(id); return; }
    let i = q.findIndex(x => tipRank(x) > tipRank(id));
    if (i < 0) i = q.length;
    q.splice(i, 0, id);
  }
  function queueTip(id) {
    if (S.meta.seenTips.includes(id) || S.tipQueue.includes(id) || S.tipShown === id || !tipText(id)) return;
    enqueueTip(id);
  }
  // UI_PLAY's triggers. Returns true if the tip is now shown or queued.
  function tip(id) {
    if (S.tipShown === id) return true;
    if (S.meta.seenTips.includes(id) || !tipText(id)) return false;
    S.tipQueue = S.tipQueue.filter(x => x !== id);
    if (TIP_NOW.includes(id) && S.tipShown && S.ui !== 'RESOLVING' && S.ui !== 'END') {
      // The tip on screen gives way. Up for 3 s or more, it counts as read; otherwise it goes back to the
      // head of the queue, unseen, and returns after the next action.
      const back = S.tipShown;
      dismissTip();
      if (now() - S.tipAt < 3000) { S.meta.seenTips = S.meta.seenTips.filter(x => x !== back); enqueueTip(back, true); }
      enqueueTip(id, true);
      showNextTip();
    } else {
      // A badge drawn while a build opens: let the build's own tips queue first (priority order), then show.
      enqueueTip(id);
      Promise.resolve().then(showNextTip);
    }
    return true;
  }
  function showNextTip() {
    if (S.tipShown || !S.tipQueue.length || S.ui === 'RESOLVING' || S.ui === 'END') return;
    const st = S.state, k = S.tipQueue.findIndex(x => tipLive(x, st));
    if (k < 0) return;
    const id = S.tipQueue.splice(k, 1)[0];
    S.tipShown = id;
    S.tipAt = now();
    S.meta.seenTips.push(id);
    const text = tipText(id);
    emit('tip', {id, text});
    toast(text, {kind: 'tip', id});
  }
  function dismissTip() {
    if (!S.tipShown) return;
    const id = S.tipShown;
    S.tipShown = null;
    emit('tipDone', {id});
  }
  function buildTips(st) {
    const s = st.show, f = Math.floor(s / 3) + 1, rules = rulesAt(st, s);
    const last = hist(st)[hist(st).length - 1];
    if (last) {
      if ((last.aah || 0) > 1) queueTip('t_aah');
      if (st.crowd > 0) queueTip('t_crowd');
      if (last.pass === false) queueTip('t_rain');
    }
    const pay = last && S.lastPay;   // the payout of the show just played (set at the light)
    if (pay && (pay.interest || 0) > 0) queueTip('t_interest');
    if (s === 0) queueTip('t_fuse');
    if (s === 2 && rules.includes('headwind')) { queueTip('t_head'); if (st.firstRun) queueTip('t_mood'); }
    if (!st.endless && (s === 21 || s === 23)) queueTip('t_count');
    if (rules.includes('windshift') || rules.includes('crossed')) queueTip('t_match');
    if (st.sponsor) queueTip('t_sponsor');
    const shop = st.shop || {};
    if (shop.rig) queueTip('t_rig');
    if (f >= 2 && !st.endless && st.shop && st.tubes.length < 6) queueTip('t_tube');
    if (shopTwin(st)) queueTip('t_twin');
    if (shopFuses(st)) queueTip('t_fusion');
  }
  function actionTips(a) {
    if ((a.type === 'buy' || a.type === 'move') && a.to && a.to.zone === 'crate') queueTip('t_crate');
  }

  /* ---------- aria-live (§13) and toasts ---------- */
  function announce(text, o = {}) {
    if (!text) return;
    const A = S.ann;
    (o.assertive ? A.assertive : A.polite).push(String(text));
    if (!A.queued) { A.queued = true; Promise.resolve().then(flushAnnounce); }
  }
  function flushAnnounce() {
    const A = S.ann;
    A.queued = false;
    for (const [q, id] of [[A.polite, 'live-polite'], [A.assertive, 'live-assertive']]) {
      if (!q.length) continue;
      // Separate queued messages as sentences ("Full Spectrum 2/3. Show 2 of 24, …").
      const text = [...new Set(q)].map(s => s.trim()).filter(Boolean).map((s, i, a) => (i < a.length - 1 && !/[.!?:…]$/.test(s) ? s + '.' : s)).join(' '), el = byId(id);
      q.length = 0;
      if (el) el.textContent = el.textContent === text ? text + ' ' : text;
    }
  }
  function toast(text, o = {}) {
    if (!text) return;
    const p = {text: String(text), kind: o.kind || 'info'};
    if (o.id) p.id = o.id;
    emit('toast', p);
    if (typeof UI_MENUS === 'undefined') fallbackToast(p);
  }
  function fallbackToast(p) {
    const box = byId('toasts');
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'card-surface';
    el.style.cssText = 'position:absolute;left:50%;top:72px;transform:translateX(-50%);z-index:60;padding:10px 14px;max-width:min(90%,420px);font-size:var(--t-s)';
    el.textContent = p.text;
    box.replaceChildren(el);
    setTimeout(() => el.remove(), 3200);
  }

  /* ---------- haptics (§9) ---------- */
  function haptic(pattern) {
    if (!S.settings || !S.settings.haptics || !hasVibrate() || !S.gestured) return false;
    try { return navigator.vibrate(pattern); } catch (e) { return false; }
  }
  function hapticFor(ev) {
    if (!ev) return;
    const p = ev.type === 'applause' ? (ev.pass === false ? [60, 40, 60] : 20) : HAPTIC[ev.type];
    if (p) haptic(p);
  }

  /* ============================================================
     OVERLAYS: stack, focus trap, focus restore, pausing
  ============================================================ */
  // Tab stops only: no tabindex="-1" (roving radios), nothing disabled, hidden, inert or invisible; in a
  // native radio group only the checked radio (else the first) is a stop, as in the browser's own order.
  const FOCUSABLE = 'button,a[href],area[href],input:not([type="hidden"]),select,textarea,summary,iframe,[contenteditable]:not([contenteditable="false"]),[tabindex]';
  function focusables(el) {
    const out = [], seen = new Set();
    for (const x of el.querySelectorAll(FOCUSABLE)) {
      if (x.tabIndex < 0 || x.getAttribute('tabindex') === '-1' || x.hasAttribute('disabled') || safe(() => x.matches(':disabled'), false)) continue;
      if (!x.getClientRects().length || x.closest('[hidden],[inert]')) continue;
      if (safe(() => getComputedStyle(x).visibility, 'visible') !== 'visible') continue;
      if (x.tagName === 'INPUT' && x.type === 'radio' && x.name) {
        const root = x.form || el, key = x.name;
        if (seen.has(key)) continue;
        const group = [...root.querySelectorAll('input[type="radio"]')].filter(r => r.name === key && el.contains(r));
        const pick = group.find(r => r.checked) || x;
        seen.add(key);
        out.push(pick);
        continue;
      }
      out.push(x);
    }
    return out;
  }
  const topEntry = () => S.stack[S.stack.length - 1] || null;
  const top = () => (topEntry() ? topEntry().name : null);
  const isOpen = name => S.stack.some(e => e.name === name);
  function focusIn(el, opts) {
    const pick = () => {
      let t = null;
      const f = opts && opts.focus;
      if (f) t = typeof f === 'string' ? el.querySelector(f) || byId(f.replace(/^#/, '')) : f;
      if (t && !el.contains(t)) t = null;
      t = t || el.querySelector('[data-autofocus],[autofocus]') || focusables(el)[0] || null;
      if (!t) { if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1'); t = el; }
      try { t.focus({preventScroll: true}); } catch (e) { /* ignore */ }
      return t !== el;
    };
    if (!pick()) setTimeout(() => { const e = topEntry(); if (e && e.el === el && (document.activeElement === el || !el.contains(document.activeElement))) pick(); }, 0);
  }
  function fallbackPanel(name, el) {
    if (el.children.length || name === 'showlog') return;
    const panel = document.createElement('div');
    panel.className = 'panel';
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn btn-primary';
    b.textContent = name === 'tapContinue' ? 'Tap to continue' : 'Continue';
    b.addEventListener('click', () => close(name));
    panel.append(b);
    el.append(panel);
  }
  function open(name, opts = {}) {
    const el = byId(OVERLAY_ID[name] || '');
    if (!el) return false;
    if (name === 'showlog' && S.layout === 'desktop') {   // a docked side panel on desktop: no modal
      emit('overlay', {name, open: true, opts, docked: true});
      focusIn(el, opts);
      return true;
    }
    const i = S.stack.findIndex(e => e.name === name);
    if (i >= 0) {
      if (i < S.stack.length - 1) S.stack.push(S.stack.splice(i, 1)[0]);
    } else {
      const back = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
      S.stack.push({name, el, back, opts, wasHidden: el.hidden});
    }
    el.hidden = false;
    el.classList.add('is-open');
    syncOverlays();
    emit('overlay', {name, open: true, opts});
    fallbackPanel(name, el);
    focusIn(el, opts);
    return true;
  }
  function close(name) {
    const i = name ? S.stack.findIndex(e => e.name === name) : S.stack.length - 1;
    if (i < 0) {
      if (name === 'showlog') emit('overlay', {name, open: false});
      return false;
    }
    const wasTop = i === S.stack.length - 1;
    const [e] = S.stack.splice(i, 1);
    e.el.hidden = e.name === 'showlog' ? !!e.wasHidden : true;
    e.el.classList.remove('is-open');
    syncOverlays();
    emit('overlay', {name: e.name, open: false});
    if (wasTop) {
      // Back to the control that opened the closing overlay when it is still a stop in the now-top layer
      // (the page when the stack is empty); otherwise the top overlay's first stop.
      const t = topEntry(), b = e.back;
      const layer = t ? t.el : document.body;
      const back = b && b !== document.body && b.isConnected && layer.contains(b) && !b.closest('[hidden],[inert]') &&
        !b.hasAttribute('disabled') && b.getClientRects().length ? b : null;
      if (back) { try { back.focus({preventScroll: true}); } catch (err) { /* ignore */ } }
      if (t && !t.el.contains(document.activeElement)) focusIn(t.el, {});
    }
    return true;
  }
  function closeAll() { while (S.stack.length) close(); }
  function syncOverlays() {
    const t = topEntry();
    for (const id of ['play', 'board', 'showlog']) {
      const el = byId(id);
      if (el) el.inert = !!t && el !== t.el && !(id === 'showlog' && S.stack.some(e => e.el === el));
    }
    for (const e of S.stack) e.el.inert = e !== t;
    const pausing = S.stack.some(e => PAUSING.includes(e.name));
    setPaused('overlay', pausing);
    if (!pausing && S.audioHeld && !S.stack.length) { S.audioHeld = false; callAudio('unlock'); callAudio('resume'); }
    callAudio('setPhase', audioPhase());
  }

  /* ============================================================
     INPUT: one keydown listener, first-gesture audio unlock
  ============================================================ */
  const isTyping = el => !!el && (el.tagName === 'TEXTAREA' || el.isContentEditable ||
    (el.tagName === 'INPUT' && /^(text|search|url|email|number|password)$/i.test(el.type || 'text') && !el.readOnly));
  function gesture() {
    S.gestured = true;
    if (!S.unlocked) { S.unlocked = true; callAudio('unlock'); }
  }
  // Older iOS does not count pointerdown (and before iOS 13 has none) as a gesture that may start audio: the
  // first touchend / click also tries, synchronously inside its handler (AUDIO.unlock(true) resumes the
  // context, or creates it if pointerdown has not already queued it). Once per page; later resumes after a
  // hidden page are AUDIO's own touchend / click listener.
  function onTapEnd() {
    window.removeEventListener('touchend', onTapEnd, true);
    window.removeEventListener('click', onTapEnd, true);
    S.gestured = true;
    S.unlocked = true;
    callAudio('unlock', true);
  }
  function trapTab(e) {
    const t = topEntry();
    const f = focusables(t.el);
    if (!f.length) { e.preventDefault(); focusIn(t.el, {}); return; }
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
  }
  function onKeyDown(e) {
    gesture();
    const t = topEntry();
    if (e.key === 'Tab' && t) { trapTab(e); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const typing = isTyping(e.target);
    const scopes = t ? [t.name] : typing ? [] : ['play'];
    if (!typing) scopes.push('global');
    for (const sc of scopes) {
      for (const fn of (S.keys[sc] || []).slice()) {
        let r = false;
        try { r = fn(e); } catch (err) { warn('key ' + sc, err); }
        if (r === true) return;
      }
    }
    // defaults
    if (e.key === 'Escape') {
      e.preventDefault();
      if (t) { if (t.name !== 'end') close(t.name); }
      else if (S.ui === 'BUILD' || S.ui === 'RESULT' || S.ui === 'RESOLVING') open('pause');
      return;
    }
    if (t && t.name === 'tapContinue' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); close('tapContinue'); return; }
    if (!t && !typing && S.ui === 'RESOLVING' && (e.key === ' ' || e.key === 'Spacebar')) {
      e.preventDefault();
      if (S.res && !S.res.ff) fastForward(); else skip();
    }
  }
  function onPointerDown(e) {
    gesture();
    if (e.isPrimary === false) return;
    const t = topEntry(), target = e.target instanceof Element ? e.target : null;
    if (t && SHEETS.includes(t.name) && target && !t.el.contains(target)) { close(t.name); return; }
    if (!t && S.ui === 'RESOLVING' && target && target.closest('#play') && !target.closest('#fire,[data-act="pause"]')) fastForward();
  }
  function onFocusIn(e) {
    const t = topEntry();
    if (t && e.target instanceof Node && !t.el.contains(e.target)) focusIn(t.el, {});
  }

  /* ---------- lifecycle: page hidden → pause + save + suspend; resume only via tapContinue ---------- */
  function onHidden() {
    if (!S.booted || S.ui === 'BOOT') return;
    saveNow();
    if (S.flags.test) return;
    callAudio('suspend');
    S.audioHeld = true;
    if (S.ui === 'END') { S.unlocked = false; S.audioHeld = false; return; }
    if (!isOpen('tapContinue') && !isOpen('pause')) open('tapContinue');
  }

  /* ---------- layout: the column height picks the mode (§8.1) ---------- */
  function measureLayout() {
    S.resizeQueued = false;
    const play = byId('play'), w = window.innerWidth, h = play ? play.clientHeight : window.innerHeight;
    const layout = w >= 1200 ? 'desktop' : h < 520 ? 'scroll' : h < 700 ? 'compact' : 'regular';
    const app = byId('app');
    if (app && app.getAttribute('data-layout') !== layout) app.setAttribute('data-layout', layout);
    const changed = layout !== S.layout;
    S.layout = layout;
    if (changed && layout === 'desktop' && isOpen('showlog')) close('showlog');
    callFX('resize');
    emit('resize', {w, h, layout});
    if (!S.loopOn || S.paused.size) callFX('render');
  }
  function queueLayout() {
    if (S.flags.test || typeof requestAnimationFrame !== 'function') return measureLayout();
    if (!S.resizeQueued) { S.resizeQueued = true; requestAnimationFrame(measureLayout); }
  }

  /* ============================================================
     LOOP: fixed timestep (§11.5)
  ============================================================ */
  function after(n, fn) {
    if (n <= 0 || !S.loopOn) { fn(); return null; }
    const t = {at: S.tick + n, fn};
    S.timers.push(t);
    return t;
  }
  function runTimers() {
    if (!S.timers.length) return;
    const due = S.timers.filter(t => t.at <= S.tick);
    if (!due.length) return;
    S.timers = S.timers.filter(t => t.at > S.tick);
    for (const t of due) { try { t.fn(); } catch (e) { warn('timer', e); } }
  }
  // One loop tick: the timers only. FX is presentation, so frame() advances it once per rAF (below);
  // the SIM never runs here (it steps on actions), so its determinism does not depend on the loop.
  function tick() {
    S.tick++;
    runTimers();
  }
  function tickOnce() {
    tick();
    callFX('update', DT, S.gameSpeed);
  }
  function frame(t) {
    S.raf = requestAnimationFrame(frame);
    const dt = Math.min(MAX_FRAME, Math.max(0, (t - (S.last || t)) / 1000));
    S.last = t;
    S.frameMs = S.frameMs * 0.9 + dt * 100;
    if (S.paused.size) { S.acc = 0; return; }
    if (S.ui === 'BUILD' || S.ui === 'RESULT') S.buildMs += dt * 1000;
    S.acc += dt;
    let n = 0;
    while (S.acc >= DT && n < MAX_STEPS) { tick(); S.acc -= DT; n++; }
    if (n >= MAX_STEPS) S.acc = 0;
    // A slow frame must not buy extra FX work (the old catch-up ran FX.update up to 8× per rAF and fed the
    // stall): one update per rAF for the ticks just run, clamped to 0.1 s of wall time; FX scales by the speed after.
    if (n) callFX('update', Math.min(FX_MAX_DT, n * DT), S.gameSpeed);
    callFX('render');
    if (S.flags.debug) debugFrame();
  }
  // Without the rAF loop (?test=1) draw once after a change so the page is complete at rest.
  function kick() {
    if (S.loopOn || S.kickQueued) return;
    S.kickQueued = true;
    setTimeout(() => { S.kickQueued = false; callFX('render'); }, 0);
  }
  function startLoop() {
    if (S.loopOn || typeof requestAnimationFrame !== 'function') return;
    S.loopOn = true;
    S.last = 0;
    S.raf = requestAnimationFrame(frame);

    E.roA = $('.ro-a b', E.over);
    E.roCap = $('.ro-cap', E.over);
    E.result = $('.result', E.over);
    E.tip = $('.tip', E.over);
    E.cheer = $('.cheer', E.over);
    E.info = $('.info', E.over);
    E.legend = $('.legend', E.over);

    // Rack: 6 stable tube buttons (unused ones hidden), canopy arc, fuse
    let tubes = '';

      tubes += `<button type="button" class="tube" data-tube="${i}"><span class="t-num"></span><span class="t-sees"></span>` +

      `<div class="tubes">${tubes}</div><div class="fuse" aria-hidden="true"><i class="ember"></i></div>`;
    E.arc = $('.arc', E.rack);
    E.tubesWrap = $('.tubes', E.rack);
    E.fuse = $('.fuse', E.rack);
    E.ember = $('.ember', E.fuse);
    E.tubes = [...E.rack.querySelectorAll('.tube')].map(b => ({
      btn: b, num: $('.t-num', b), sees: $('.t-sees', b), body: $('.t-body', b), tok: $('.t-tok', b), chips: $('.t-chips', b), rig: $('.t-rig', b),
    }));

    // Tools: Crate ×2 pinned left, divider, Undo / Match / Restore / Rehearse
    E.tools.innerHTML =
      '<div class="crate">' +
      '<button type="button" class="slot" data-crate="0"></button><button type="button" class="slot" data-crate="1"></button></div>' +
      '<span class="divider" aria-hidden="true"></span>' +
      `<button type="button" class="tool" data-act="undo" aria-label="Undo (U)">${ICON.undo}<span class="tl" aria-hidden="true">Undo</span></button>` +
      `<button type="button" class="tool" data-act="match" aria-label="Match: re-seat shells for tonight's fuse (M)">${ICON.match}<span class="tl" aria-hidden="true">Match</span></button>` +
      `<button type="button" class="tool" data-act="restore" aria-label="Restore last show's order (B)">${ICON.restore}<span class="tl" aria-hidden="true">Restore</span></button>` +
      `<button type="button" class="tool" data-act="rehearse" aria-pressed="false" aria-label="Rehearse the next Headliner (H)">${ICON.rehearse}<span class="tl" aria-hidden="true">Rehearse</span></button>`;
    E.crates = [...E.tools.querySelectorAll('[data-crate]')];
    E.undo = $('[data-act="undo"]', E.tools);
    E.match = $('[data-act="match"]', E.tools);
    E.restore = $('[data-act="restore"]', E.tools);
    E.rehearse = $('[data-act="rehearse"]', E.tools);


    // Shop: 4 stable card buttons (3 in a row, or 4 in a 2×2 grid)
    let cards = '';
    for (let i = 0; i < 4; i++) cards += `<button type="button" class="card" data-card="${i}"></button>`;
    E.shop.innerHTML = `<div class="cards">${cards}</div><p class="shop-empty" hidden></p>`;
    E.cards = [...E.shop.querySelectorAll('[data-card]')];
    E.shopEmpty = $('.shop-empty', E.shop);

    // Workshop: rig card, add tube, reroll (hidden in Festival 1)
    E.workshop.innerHTML =
      '<button type="button" class="ws ws-rig" data-act="buyRig"></button>' +
      '<button type="button" class="ws ws-tube" data-act="buyTube"></button>' +
      '<button type="button" class="ws ws-reroll" data-act="reroll"></button>';
    E.rigBtn = $('[data-act="buyRig"]', E.workshop);
    E.tubeBtn = $('[data-act="buyTube"]', E.workshop);
    E.rerollBtn = $('[data-act="reroll"]', E.workshop);

    // Fire: the label only. The mood pill is its own button beside it (a tap on it explains the mood, never lights).
    E.fire.innerHTML = '<span class="fire-lbl">Light the fuse</span>';
    E.fireLbl = $('.fire-lbl', E.fire);
    E.mood = document.createElement('button');
    E.mood.type = 'button';
    E.mood.className = 'mood';
    E.mood.dataset.act = 'mood';
    E.mood.hidden = true;
    E.firebar.appendChild(E.mood);
