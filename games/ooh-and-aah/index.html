  /* ================= 7. Layout (ResizeObserver on the column; §8.1) ================= */

  let lastW = 0;
  // Rack geometry, read only where layout is already clean (the ResizeObserver callback) or in a frame callback,
  // never straight after a render's DOM writes (that forces a full layout: ~130 ms of Run it back on a phone).
  // Tube centres follow from it by arithmetic (48 px tubes, flex-centred, --tgap apart).
  const geo = { ok: false, wrapW: 0, offX: 0, rackX: 0, rackW: 0 };
  let rackGap = 8;
  function readGeo() { // → true when it changed
    const w = E.tubesWrap.clientWidth;
    if (!w) { const was = geo.ok; geo.ok = false; return was; }
    const tr = E.tubesWrap.getBoundingClientRect(), sr = E.sky.getBoundingClientRect(), rr = E.rack.getBoundingClientRect();
    const g = { ok: true, wrapW: w, offX: tr.left + E.tubesWrap.clientLeft - sr.left, rackX: tr.left + E.tubesWrap.clientLeft - rr.left, rackW: rr.width };
    const changed = !geo.ok || ['wrapW', 'offX', 'rackX', 'rackW'].some(k => Math.abs(g[k] - geo[k]) > 0.25);
    Object.assign(geo, g);
    return changed;
  }
  function measure() {
    if (!E.play) return;
    const h = E.play.clientHeight, w = E.play.clientWidth;
    const moved = readGeo();
    const m = h >= 700 ? 'regular' : h >= 520 ? 'compact' : 'scroll';
    if (m !== mode || E.play.dataset.mode !== m) {
      mode = m;
      E.play.dataset.mode = m;
      (m === 'regular' ? E.hudTitle : E.skyLabel).appendChild(E.show);
      lastW = w;
      render(); flushFits();
    } else if (w !== lastW || moved) { lastW = w; render(); flushFits(); } // tube spacing and the fit ladders depend on the width
    else pushScene();
  }

  // Tube centres in canvas CSS px, for FX.setScene (x of tube i from the cached geometry; no layout read).
  const tubeX = (i, n, off) => off + (geo.wrapW - (n * 48 + (n - 1) * rackGap)) / 2 + 24 + i * (48 + rackGap);
  function tubeCentres() {
    if (!E.sky || !G || !G.state) return [];
    const n = S().tubes.length;
    if (!geo.ok) readGeo(); // an explicit call before the first layout pass: measure once
    return S().tubes.map((_, i) => tubeX(i, n, geo.offX));
  }
  let sceneFrame = 0;
  let lastScene = '';
  function pushScene() {
    const f = fxApi();
    if (!fnIn(f, 'setScene') || !view || frozen) return;
    if (!geo.ok) { // not laid out yet (or hidden): measure in the next frame, where the layout is due anyway
      if (!sceneFrame) sceneFrame = requestAnimationFrame(() => { sceneFrame = 0; readGeo(); if (geo.ok) pushScene(); });
      return;
    }
    const st = S(), xs = tubeCentres(), tf = (st.runStats && st.runStats.timesFired) || {};
    const cheer = { restless: 0.2, hopeful: 0.5, eager: 0.85 }[view.mood] || 0;
    const scene = {
      festival: festOf(view.s), show: view.s, crowd: st.crowd, rules: view.tonight, previewRules: view.rules,
      tubes: st.tubes.map((tb, i) => ({ x: Math.round(xs[i] * 10) / 10, soot: soot(tf[i]), shellCol: tb.shell ? shellCol(tb.shell) : null, shellId: tb.shell ? tb.shell.id : null, star: tb.shell ? tb.shell.star : 0, rig: tb.rig || null })),
      haze: slotOf(view.s) / 3, cheer, mood: moodVisible() ? view.mood : null, fav: view.fav,
    };
    const sig = JSON.stringify(scene);
    if (sig === lastScene) return;
    lastScene = sig;
    safe(() => f.setScene(scene));
  }
  const soot = n => Math.min(4, Math.floor(Math.log2(1 + (n || 0))));

  /* ================= 8. Derived view (computed once per render) ================= */

  function computeView() {
    const st = S(), s = st.show | 0;
    const tonight = rulesFor(s), hs = headlinerShow(s);
    const auto = hs === s; // a Headliner's own build: tonight's rule is the preview (§8.4)
    const hRules = rulesFor(Math.min(hs, lastShow()));
    const rehearsing = rehearseOn() && !auto && hRules.length > 0;
    const rules = rehearsing ? hRules : tonight;
    const order = fireOrder(st.tubes, rules);
    const chips = chipsOf(st, rules);
    const sky = skyRun(st.tubes, rules);
    let sees = fnIn(sim(), 'seesPerTube') ? safe(() => sim().seesPerTube(st, rules), null) : null;
    if (!Array.isArray(sees)) sees = chips.some(c => c && c.sees != null) ? chips.map(c => (c ? c.sees : null)) : sky.sees;
    const fav = fnIn(sim(), 'favourite') ? safe(() => sim().favourite(st.tubes, st.crowd), null) : null;
    const mood = moodOf(st), pmood = rehearsing ? moodOf(st, rules) : mood;
    view = { s, tonight, hs, hRules, rules, rehearsing, auto, order, chips, sky, sees, fav, mood, pmood, legal: legalList(), pv: pvSig() };
  }
  // GAME.preview.rehearse is the source of truth (core); a local flag stands in without it.
  function rehearseOn() { const p = G.preview; return p && typeof p === 'object' && 'rehearse' in p ? !!p.rehearse : rehearse; }
  const pvSig = () => { const p = G.preview; return p && typeof p === 'object' ? String(p.rehearse) + '|' + String(p.rules) : ''; };
  function setRehearse(v) {
    const p = G.preview;
    if (fnIn(G, 'setRehearse')) G.setRehearse(v);
    else if (p && typeof p === 'object' && 'rehearse' in p) p.rehearse = v;
    else { rehearse = v; if (fnIn(G, 'emit')) G.emit('preview', { rehearse: v }); render(); }
  }
  function moodVisible() {
    if (!view || !view.mood) return false;
    if (fnIn(G, 'moodVisible')) return !!G.moodVisible();
    return !(G.settings && G.settings.mood === false) && !(S().firstRun && view.s < 2);
  }
  const hasRule = r => !!view && view.rules.includes(r);
  function missedBefore() { const h = (S().runStats && S().runStats.history) || []; return h.some(e => e && !e.pass && !e.relit); }
  const critical = () => missedBefore() && S().phase !== 'lost';
  function lastChance() { // §5.4: first build after the miss, and every Headliner / Countdown build after it
    if (G.critical && typeof G.critical === 'object') return !!G.critical.lastChance && building();
    if (!critical() || !building()) return false;
    const h = S().runStats.history, last = h[h.length - 1];
    return (last && !last.pass) || slotOf(view.s) === 2;
  }
  const legalHas = type => view.legal.some(a => a.type === type);

  /* ================= 9. Rendering ================= */

  function render() {
    if (!G || !G.state || !E.play) return;
    safe(() => {
      syncShow();
      computeView();
      if (!frozen) { renderHud(); renderSponsor(); renderRack(); renderTools(); renderShop(); renderWorkshop(); }
      renderFire();
      renderSky();
      pushScene();
      checkTips();
    });
  }

  /* ---------- HUD (Regular: 2 rows; Compact: 1 row) ---------- */
  function renderHud() {
    const st = S(), s = view.s;
    // "Festival · Show"; when that would truncate, the show name folds into 3 pips (Twilight · Evening · ♛ Headliner)
    const k = slotOf(s);
    let pips = '';
    for (let j = 0; j < 3; j++) pips += j === 2 ? `<i class="hl${k === 2 ? ' now' : ''}">${ICON.crown}</i>` : `<i class="${j < k ? 'done' : j === k ? 'now' : ''}"></i>`;
    setHTML(E.show, `<span class="hs-fest">${esc(festName(festOf(s)))}</span><span class="hs-slot"> · ${esc(showName(s))}</span>` +
      `<span class="hs-pips" aria-hidden="true" title="${esc(showName(s))}">${pips}</span>`);
    setHTML(E.target, `<span class="tgt-w">Target </span><span class="tgt-g" aria-hidden="true">◎</span><b class="display num">${fmt(targetOf(s))}</b>`);
    const nx = [];
    for (let j = s + 1; j <= Math.min(lastShow(), s + 2); j++) nx.push(`<span class="nx${j - s}">${fmt(targetOf(j))}${slotOf(j) === 2 ? ICON.crown : ''}</span>`);
    setHTML(E.next, nx.length ? '<span aria-hidden="true">▸</span> ' + nx.join('<span class="nx2"> · </span>') : '');
    E.next.setAttribute('aria-label', 'Next targets: ' + [s + 1, s + 2].filter(j => j <= lastShow()).map(j => fmt(targetOf(j)) + (slotOf(j) === 2 ? ' (Headliner)' : '')).join(', '));
    const hid = view.hRules[0];
    E.head.hidden = !hid;
    if (hid) {
      const h = ruleInfo(hid), tonight = view.hs === s;
      setHTML(E.head, `<span class="hh-pill">${ruleIcon(hid)}<span class="hh-name">${esc(h.name)}</span></span>`);
      E.head.setAttribute('aria-label', `${tonight ? 'Tonight' : 'Headliner, show ' + (view.hs + 1)}: ${h.name}. ${h.text} Open the card.`);
      E.head.classList.toggle('now', tonight);
    }
    E.coins.textContent = '$' + st.coins;
    E.crowd.textContent = fmt(st.crowd);
    E.crowdHalf.hidden = !hasRule('ferry');
    E.coinsBtn.setAttribute('aria-label', `Coins: $${st.coins}. What they do`);
    E.crowdBtn.setAttribute('aria-label', `Crowd: ${fmt(st.crowd)}${hasRule('ferry') ? ', half tonight' : ''}. What it does`);
    const used = critical(), fw = !!st.fairWeather;
    const noRain = !used && (view.tonight.some(r => /^countdown/.test(r)) || st.renown >= 6 || st.rain === 0);
    setHTML(E.rain, ICON.umbrella.replace('</svg>', (used ? ICON.crack : '') + '</svg>') + (fw ? '<span class="fw">FW</span>' : ''));
    E.rain.dataset.state = used ? 'used' : noRain ? 'none' : 'ok';
    E.rain.setAttribute('aria-label', (used ? 'Rain check used: last chance' : noRain ? 'No rain check tonight' : 'Rain check: unused') + (fw ? '. Fair Weather on' : ''));
    queueFit('hud', fitHud);
  }
  // Nothing in the HUD clips at 360 px: each row sheds detail in a fixed order until it fits (fonts vary by device).
  function fitHud() {
    // Row A (Regular only; Compact shows the name in the sky): 1 pips · 2 Crowd to Row B · 3 both · 4 festival name only
    const hk = E.show._html + E.coins.textContent + E.crowd.textContent + E.crowdHalf.hidden;
    if (mode === 'regular') fitLadder(E.hud, 4, () => overflows(E.show), hk); else { E.hud.dataset.fit = '0'; E.hud._fitKey = null; }
    // Row B: 1 Headliner chip icon only · 2 one next target · 3 no next targets
    fitLadder(E.hudTgt, 3, () => E.hudTgt.scrollWidth > E.hudTgt.clientWidth + 0.5, hk + E.hud.dataset.fit + E.target._html + E.next._html + E.head._html + E.head.hidden);
  }
  function ruleIcon(id) {
    const m = { headwind: ICON.gust, critic: ICON.monocle, streetlights: ICON.lamp, fog: ICON.fog, powercut: ICON.bolt, drizzle: ICON.drop,
      ordinance: ICON.hush, windshift: ICON.wind, ferry: ICON.ferry, crossed: ICON.wires, rival: ICON.rival, countdown: ICON.clock,
      countdown3: ICON.clock, shortfuse: ICON.cut };
    return m[id] || ICON.crown;
  }

  /* ---------- Sponsor strip (Regular: its own row; Compact: over the sky's top edge) ---------- */
  function renderSponsor() {
    const sp = S().sponsor;
    E.sponsor.hidden = !sp;
    E.play.toggleAttribute('data-sponsor', !!sp);
    if (!sp) return;
    const s = view.s, t = sp.accepted ? targetOf(s) : Math.round(targetOf(s) * 1.5);
    const k = lookup(DATA().SPONSORS, sp.kind) || {}, name = k.flavour || cap(sp.kind), reward = k.reward || '';
    E.spBtn.setAttribute('aria-pressed', sp.accepted ? 'true' : 'false');
    const pay = k.short || (sp.kind === 'rare' ? 'a Collector card' : reward);
    const tx = E.spBtn.querySelector('.sp-text');
    setHTML(tx, `<span class="sp-l1"><b>Sponsor</b> <span class="sp-x">×1.5 </span>→ <b class="num">${fmt(t)}</b></span>` +
      `<span class="sp-l2"><span class="sp-dot"> · </span><span class="sp-p">pays </span>${esc(pay)}</span>`);
    // 360 px: the reward moves to a second line, then "pays" goes, then "×1.5" (all stay in the aria-label and Inspect)
    const l1 = tx.firstElementChild, l2 = tx.lastElementChild;
    queueFit('sponsor', () => fitLadder(E.sponsor, 3, () => overflows(tx) || overflows(l1) || overflows(l2), tx._html + sp.accepted));
    E.spBtn.querySelector('.sp-word').textContent = sp.accepted ? 'Accepted' : 'Accept';
    E.spBtn.setAttribute('aria-label', `Sponsor, ${name}: target times 1.5, to ${fmt(t)}. If you pass: ${reward.replace(/\.$/, '')}. ${sp.accepted ? 'Accepted' : 'Not accepted'}.`);
  }

  /* ---------- Rack: numerals → sees → token → rig plate → fuse ---------- */
  function renderRack() {
    const st = S(), v = view, n = st.tubes.length, rules = v.rules;
    const passes = rules.includes('countdown3') ? 3 : rules.includes('countdown') ? 2 : 1;
    E.rack.dataset.rows = passes;
    E.rack.classList.toggle('crit', critical());
    E.rack.classList.toggle('pulse', lastChance());
    E.rack.classList.toggle('fog', rules.includes('fog'));
    E.rack.classList.toggle('holding', !!held);
    const partners = G.settings && G.settings.chips === 'partners';
    const tf = (st.runStats && st.runStats.timesFired) || {};
    const firstT = v.order.seq[0];
    const critic = criticMarks(st.tubes, rules);
    // Spread the tubes when there are fewer than 6 (8–16 px gaps), so each "sees" chip has room.
    const W = geo.ok ? geo.wrapW : 0, gap = n > 1 && W ? Math.max(8, Math.min(16, Math.floor((W - n * 48) / (n - 1)))) : 8;
    E.rack.style.setProperty('--tgap', gap + 'px');
    rackGap = gap;
    // Numerals and sees chips describe ONE rack: the hovered drop's rack while hovering, else tonight's rack.
    // Each other legal drop shows its own local "sees" (and, on an empty tube, a ghost numeral).
    const hovKey = held && hover && hover.zone === 'tube' && targets.has(slotKey(hover)) ? slotKey(hover) : null;
    const hv = hovKey ? hypoFor(hovKey) : null;
    for (let i = 0; i < 6; i++) {
      const T = E.tubes[i], tb = st.tubes[i];
      T.btn.hidden = !tb;
      if (!tb) continue;
      const key = 'tube:' + i, can = !!held && targets.has(key), hy = can ? hypoFor(key) : null;
      // One numbering at a time: the hovered drop's rack while hovering, else tonight's rack as it stands. An empty
      // legal tube gets no numeral; its chip says where the drop would fire ("3rd", "LAST").
      const sh = tb.shell, ord = hv ? hv.order : v.order;
      // fire-order numerals (one row per fuse pass)
      let num = '';
      for (let p = 0; p < passes; p++) {
        const e = ord.per[i].find(x => x.pass === p);
        const last = e && e.to === ord.total;
        const lbl = !e ? '' : last && e.from === e.to ? 'LAST' : e.from === e.to ? String(e.from) : e.from + '–' + e.to;
        num += `<span class="n${last ? ' last' : ''}${!e ? ' none' : ''}">${lbl}</span>`;
      }
      if (rules.includes('shortfuse') && i >= 5) num = '<span class="n none">no fuse</span>';
      setHTML(T.num, num);
      // sees chip (hypothetical while this tube is a legal drop)
      const sees = hv ? hv.sees[i] : hy ? hy.sees[i] : v.sees[i];
      const showSees = (sh || hy || (hv && hovKey === key)) && sees != null;
      setHTML(T.sees, showSees ? `${ICON.sees}<span class="sw">sees\u00a0</span>${sees}` : '');
      T.sees.classList.toggle('local', !!(hy || hv) && showSees);
      T.sees.classList.toggle('fogged', rules.includes('fog') && sees != null);
      // token + telegraph badges
      const washed = rules.includes('streetlights') && i % 2 === 1;
      const half = sh && ((rules.includes('ordinance') && (row(sh.id).col === 'W')) || (rules.includes('rival') && v.fav === i));
      const dud = sh && rules.includes('headwind') && firstT === i;
      let badges = '';
      if (v.fav === i && sh) badges += `<span class="b-fav" title="Crowd Favourite">${ICON.crown}</span>`;
      if (half) badges += '<span class="b-half">½</span>';
      if (washed && sh) badges += `<span class="b-lamp">${ICON.lamp}</span>`;
      if (dud) badges += `<span class="b-dud">${ICON.gust}</span>`;
      if (critic.has(i) && sh) badges += `<span class="b-critic">${ICON.monocle}</span>`;
      const ch = v.chips[i];
      if (sh && ch && ch.crowd > 0 && !can) badges += `<span class="b-crowd">${ICON.crowd}+${fmtChip(ch.crowd)}</span>`;
      // Hang pips; under Drizzle one pip is shown crossed out (§4.7 telegraph)
      const baseHang = sh ? hangOf(tb, []) : 0, drz = rules.includes('drizzle') && baseHang > 0;
      setHTML(T.tok, sh ? tokenHTML(sh, { size: 'lg', hang: drz ? baseHang - 1 : baseHang, drizzle: drz, cls: washed ? ' washed' : '', badges })
        : `<span class="t-empty">${ICON.plus}</span>`);
      // local chips on legal drops: +Ooh, +Aah, ×, ✦, Crowd, $ (never a total; §8.4)
      let chips = '';
      const sw = can ? swaps.get(key) : null;
      if (hy && !sh && !hv) { // where an empty tube's drop would fire
        const e = hy.order.per[i];
        if (e && e.length) chips += `<span class="chip c-ord">${e[e.length - 1].to === hy.order.total ? 'LAST' : ordinal(e[0].from)}</span>`;
      }
      if (hy && hy.chips[i]) {
        const c = hy.chips[i], fu = c.fusion || (c.fusionNext && c.fusionNext.name);
        if (!partners) {
          if (c.ooh) chips += `<span class="chip c-ooh">+${fmtChip(c.ooh)}</span>`;
          if (c.aah) chips += `<span class="chip chip-aah c-aah">+${fmtChip(c.aah)}</span>`;
          if (c.x > 1) chips += `<span class="chip chip-x c-x">${fmtX(c.x)}</span>` + (c.xAah >= 0.05 ? `<span class="chip c-xaah">(+${fmtChip(c.xAah)})</span>` : '');
        }
        if (fu) chips += `<span class="chip chip-fusion">✦${fu === '?' ? ' ?' : ''}</span>`;
        if (!partners && c.crowd) chips += `<span class="chip c-crowd">${ICON.crowd}+${fmtChip(c.crowd)}</span>`;
        if (!partners && c.coin) chips += `<span class="chip c-coin">+$${fmtChip(c.coin)}</span>`;
        if (!partners && !c.ooh && !c.aah && !(c.x > 1) && !c.crowd && !c.coin && !fu) chips += '<span class="chip c-none">+0</span>';
      } else if (hy && !partners) chips += '<span class="chip c-none">+0</span>';
      if (sw) chips += sw.kind === 'swap' ? `<span class="chip c-swap" title="Swap in: ${esc(shellName(sw.out))} goes to the Crate">→${ICON.crate}</span>`
        : `<span class="chip c-swap sell" title="Replace: sells ${esc(shellName(sw.out))}">✕+$${sw.refund}</span>`;
      setHTML(T.chips, chips);
      // rig plate
      setHTML(T.rig, tb.rig ? (ICON.rig[tb.rig] || '') : '');
      T.rig.className = 't-rig' + (tb.rig ? ' has' : '') + (held && held.kind === 'rig' && can ? ' can' : '');

  /* ---------- Info card ---------- */

  const fusePartner = (key, first) => { const [a, b] = String(key || '').split('>'); const id = first ? b : a; return id ? row(id).name || cap(id) : ''; };

  function hoverLine(slot) {

    const key = slotKey(slot), hy = hypoFor(key);

  /* ================= 10. Holding: legal targets and hypothetical racks (§8.4) ================= */

  // §2.5 one-gesture swap-in is off in the first-ever run's shows 1–2: the mood is hidden there, and those shows
  // cannot be failed (spec §6), so no drop may make them failable.
  const swapsOn = () => !(S().firstRun && (S().show | 0) < 2);
  function computeTargets(item) {
    const m = new Map();
    swaps = new Map();
    for (const a of view.legal) {
      if (item.kind === 'card' && (a.type === 'buy' || a.type === 'upgrade') && a.card === item.i && a.to) m.set(slotKey(a.to), a);
      else if (item.kind === 'shell' && a.type === 'move' && sameSlot(a.from, item.slot) && a.to) m.set(slotKey(a.to), a);
      else if (item.kind === 'rig' && a.type === 'buyRig') m.set('tube:' + a.tube, a);

    const o = sim();
    if (item.kind === 'card' && swapsOn() && fnIn(o, 'placeHeld')) {

        const key = 'tube:' + j;

    if (st.tubes.some(t => !t.shell) || (st.crate || []).some(x => !x)) opts.push(c.cost);
    const twin = owned().find(o => o.sh.id === c.id && (o.sh.star || 1) < 3);
    if (twin) opts.push(upCost(twin.sh));
    if (swapsOn()) st.tubes.forEach(t => {
      if (!t.shell || t.shell.id === c.id) return;
      opts.push((st.crate || []).some(x => !x) ? c.cost : c.cost - sellValue(t.shell));

    if (!opts.length) return 0;
    return Math.max(0, Math.min(...opts) - st.coins);
  }

    let res = null;
    if (act && fnIn(o, 'clone') && fnIn(o, 'step')) {
      res = safe(() => {
        const st2 = o.clone(S()), ev = o.step(st2, act);
        if (Array.isArray(ev) && ev[0] && ev[0].type === 'illegal') return null;
        const chips = chipsOf(st2, view.rules), sky = skyRun(st2.tubes, view.rules);
        const sees = chips.some(c => c && c.sees != null) ? chips.map(c => (c ? c.sees : null)) : sky.sees;

  }
  function draggable(item) {

    return !!slotShell(item.slot);
  }
  function hold(item) {

  }

  /* ================= 11. Actions ================= */

  // Everything goes through GAME.dispatch. Core announces the action (§13), AUDIO sounds the SIM build

  }
  function hint(title, text) { flash = { title: `<b>${esc(title)}</b>`, text }; render(); }

  function light() {
    if (!building() || !fnIn(G, 'light')) return; // RESULT is a build too: the card stays pinned until the next action

  /* ---------- 2-tap sell (stays armed until the next input) ---------- */
  function sellSlot(slot) {

  function disarmSell() { if (sellArmed) { sellArmed = null; return true; } return false; }

  /* ================= 12. Pointer input (§11.5: tap vs drag, capture, long-press) ================= */

  const itemEl = t => t && t.closest && t.closest('[data-tube],[data-crate],[data-card],[data-act="buyRig"]');

      more = `<div class="bd-more" aria-hidden="true"><div class="bd-more-g">${g}</div>${notes.map(n => `<p>${esc(n)}</p>`).join('')}</div>`;
    }
    const far = !past && !now && (f > curF + 1 || !building);    // a festival further ahead: a light two-line row
    return `<li class="bd-row ${past ? 'is-past' : now ? 'is-now' : 'is-future'}${far ? ' is-far' : ''}" aria-label="${esc(aria)}"${now ? ' aria-current="step"' : ''}>
<div class="bd-name" aria-hidden="true"><span class="bd-num num">${f}</span><span class="bd-fest">${esc(festName(f))}</span>${mini}${stamps ? `<span class="bd-stamps">${stamps}</span>` : ''}</div>
${cells ? `<div class="bd-cells" aria-hidden="true">${cells}</div>` : ''}${more}${card ? `<div aria-hidden="true">${card}</div>` : ''}</li>`;
  }

  /* Log-y target curve (dashed step line for the shows ahead) with Applause dots, drawn to scale. */
  // The curve's content width (inside its padding), so the SVG draws 1:1 and its 16px labels render at 16px.
  function curveW(box) {
    if (!box || !box.clientWidth) return 0;
    const cs = getComputedStyle(box);
    return Math.floor(box.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0));
  }
  function spark(st, hm, n, s, building, w) {
    const W = Math.max(160, w || curveW(boardEl.querySelector('.bd-curve')) || boardEl.clientWidth - 38 || 282), H = 136;
    const L = 44, R = 8, T = 10, B = 26, pw = W - L - R, ph = H - T - B;
    const tg = [], dots = [];
    for (let i = 0; i < n; i++) { const e = lastOf(hm[i]); tg.push(e && !(building && i === s) ? e.target : tgt(st, i)); }
    for (const e of hist(st)) { const i = hIdx(e); if (i >= 0 && i < n) dots.push(e); }
    const vmax = Math.max(1, ...tg, ...dots.map(e => e.applause || 0));
    const lo = 40, hi = vmax * 1.6, l0 = Math.log10(lo), l1 = Math.log10(hi);
    const y = v => +(T + ph * (1 - (Math.log10(Math.max(lo, v)) - l0) / (l1 - l0))).toFixed(1);
    const x = i => +(L + pw * (i + 0.5) / n).toFixed(1);
    const xe = i => +(L + pw * i / n).toFixed(1);
    let g = '';
    // decade gridlines and labels
    const decs = [];
    for (let d = 100; d <= hi; d *= 10) decs.push(d);
    const every = decs.length > 5 ? 2 : 1;
    decs.forEach((d, j) => {
      if (j % every) return;
      g += `<line class="sp-grid" x1="${L}" x2="${W - R}" y1="${y(d)}" y2="${y(d)}"/><text class="sp-lab" x="${L - 6}" y="${y(d) + 5}" text-anchor="end">${fmt(d)}</text>`;
    });
    // festival bands and numbers
    const nf = n / 3, curF = Math.floor(s / 3);
    for (let f = 0; f < nf; f++) {
      if (f % 2) g += `<rect class="sp-band" x="${xe(f * 3)}" y="${T}" width="${(xe(f * 3 + 3) - xe(f * 3)).toFixed(1)}" height="${ph}"/>`;
      if (nf <= 8 || f % 2 === 0 || f === curF) g += `<text class="sp-lab sp-f${f === curF && building ? ' is-now' : ''}" x="${x(f * 3 + 1)}" y="${H - 6}" text-anchor="middle">${f + 1}</text>`;
    }
    // the target step line: solid up to tonight, dashed ahead
    let pDone = '', pNext = '';
    for (let i = 0; i < n; i++) {
      const seg = `${xe(i)} ${y(tg[i])}H${xe(i + 1)}`;
      if (i <= s) pDone += (pDone ? 'L' : 'M') + seg;
      else pNext += (pNext ? 'L' : `M${xe(i)} ${y(tg[i - 1] || tg[i])}L`) + seg;
    }
    g += `<path class="sp-tg" d="${pDone}"/><path class="sp-tg is-next" d="${pNext}"/>`;
    if (building && s < n) {
      g += `<line class="sp-now" x1="${x(s)}" x2="${x(s)}" y1="${T}" y2="${T + ph}"/>` +
        `<circle class="sp-nowdot" cx="${x(s)}" cy="${y(tg[s])}" r="4.5"><title>Tonight: show ${s + 1}, target ${fmt(tg[s])}</title></circle>`;
    }
    // Applause dots: ● pass, ✕ miss, ring = sponsored
    const last = dots.length - 1;
    dots.forEach((e, j) => {
      const i = hIdx(e), cx = x(i), cy = y(e.applause || 0), fresh = j === last && lit && lit.fresh ? ' is-new' : '';
      const tip = `<title>Show ${i + 1}, ${esc(showName(i))}: Applause ${fmt(e.applause || 0)} vs ${fmt(e.target)}${e.pass ? ', passed' : ', missed'}${e.sponsored ? ', sponsored' : ''}${e.encore ? ', encore' : ''}</title>`;
      const cross = `M${cx - 4.5} ${cy - 4.5}l9 9m0-9l-9 9`;
      g += `<g class="sp-dot${fresh}">${tip}${e.sponsored ? `<circle class="sp-sp" cx="${cx}" cy="${cy}" r="8"/>` : ''}` +
        (e.pass ? `<circle class="sp-pass" cx="${cx}" cy="${cy}" r="4.5"/>` : `<path class="sp-halo" d="${cross}"/><path class="sp-miss" d="${cross}"/>`) + '</g>';
    });
    const passed = dots.filter(e => e.pass).length, anyMiss = dots.length > passed, anySp = dots.some(e => e.sponsored);
    const aria = `Target curve, log scale: ${n} shows from ${fmt(tg[0])} to ${fmt(tg[n - 1])}. ` +
      (dots.length ? `Your Applause on ${dots.length} show${dots.length > 1 ? 's' : ''}, ${passed} passed.` : 'No shows lit yet.');
    const lg = `<span class="sp-lg"><svg viewBox="0 0 22 10" aria-hidden="true"><path class="sp-tg" d="M1 7H8V3H21"/></svg>Target</span>` +
      `<span class="sp-lg"><svg viewBox="0 0 12 12" aria-hidden="true"><circle class="sp-pass" cx="6" cy="6" r="4.5"/></svg>Applause</span>` +
      (anyMiss ? `<span class="sp-lg"><svg viewBox="0 0 12 12" aria-hidden="true"><path class="sp-miss" d="M1.5 1.5l9 9m0-9l-9 9"/></svg>Miss</span>` : '') +
      (anySp ? `<span class="sp-lg"><svg viewBox="0 0 18 18" aria-hidden="true"><circle class="sp-sp" cx="9" cy="9" r="7.5"/></svg>Sponsored</span>` : '');
    return `<h3 class="bd-h3">Target curve</h3><svg class="sp" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(aria)}">${g}</svg><p class="sp-legend">${lg}</p>`;
  }

  /* =====================================================================
     SHOW LOG — model
     A pure reduction of the §9 event chain:
       fuseLit → (launch, burst, fusion, gainOoh, gainAah, multAah, clear,
       extend, repeat, crowdGain, coinGain, skyAge)* → crowdCheer →
       applause → payout → rainCheck | relight | runLost | runWon.
     Each burst opens a line; the events after it attach to that line.
  ===================================================================== */
  function capture(st) {
    if (!st || !Array.isArray(st.tubes)) return null;
    const s = st.show | 0;
    return {
      s, crowd: st.crowd | 0, sponsored: !!(st.sponsor && st.sponsor.accepted),
      rules: call(sim(), 'rulesFor', st, s) || [], target: tgt(st, s),
      tubes: st.tubes.map(t => ({shell: t && t.shell ? {id: t.shell.id, col: t.shell.col, star: t.shell.star || 1, uid: t.shell.uid || 0, paid: 0} : null, rig: (t && t.rig) || null})),
      fav: undefined
    };
  }
  function newLog(sn) {
    const L = {snap: sn, lines: [], cur: null, byN: {}, pass: 0, shot: 0, cheer: null, app: null, pay: null, notes: [],
      ooh: 0, aah: 1, done: false, live: true, fav: null};
    if (sn) {
      // ♛ as of lighting (§3.3 favourite), computed from the pre-light rack.
      if (sn.fav === undefined) sn.fav = num(call(sim(), 'favourite', sn.tubes, sn.crowd));
      L.fav = sn.fav;
    }
    return L;
  }
  function item(L, it) {
    if (L.app || !L.cur) return;           // nothing attaches before the first burst or after the slam
    L.cur.items.push(it);
    L.cur.v++;
    L.cur.ooh = L.ooh; L.cur.aah = L.aah;
  }
  function totals(L, ev) {
    if (num(ev.ooh) != null) L.ooh = ev.ooh;
    if (num(ev.aah) != null) L.aah = ev.aah;
  }
  function reduce(L, ev) {
    if (!ev || !ev.type) return;
    switch (ev.type) {
      case 'fuseLit':
        if (!L.snap) L.snap = {s: ev.show, tubes: [], crowd: 0, sponsored: false};
        if (num(ev.show) != null) L.snap.s = ev.show;
        if (Array.isArray(ev.rules)) L.snap.rules = ev.rules;
        if (num(ev.target) != null) L.snap.target = ev.target;
        if (num(ev.fav) != null) L.fav = ev.fav;
        break;
      case 'launch': L.shot = ev.shot | 0; break;
      case 'burst': {
        if (L.app) break;
        const id = typeof ev.shell === 'object' && ev.shell ? ev.shell.id : ev.shell;
        const pass = ev.pass | 0;
        if (pass > L.pass) {
          L.pass = pass;
          L.lines.push({sep: true, v: 1, text: pass === 1 && L.snap && (L.snap.rules || []).includes('countdown') ? 'The fuse turns: 1 → ' + tubeCount(L) : 'The fuse turns again'});
        }
        if (num(ev.n) != null) L.byN[ev.n] = {id, col: ev.col};
        L.cur = {
          tube: num(ev.tube), id, col: ev.col || 'W', star: ev.star || 1, shot: L.shot,
          sees: num(ev.sees) ?? (Array.isArray(ev.up) ? ev.up.length : 0), up: Array.isArray(ev.up) ? ev.up.slice() : null,
          dud: !!ev.dud, half: !!ev.half, washed: !!ev.washed, wild: !!ev.wild, last: !!ev.last,
          items: [], v: 0, ooh: L.ooh, aah: L.aah
        };
        L.lines.push(L.cur);
        break;
      }
      case 'fusion': item(L, {k: 'fusion', name: ev.name || cap(ev.key), first: !!ev.first}); break;
      case 'gainOoh': totals(L, ev); item(L, {k: 'ooh', v: ev.v || 0, critic: !!ev.critic, fu: !!ev.fusion}); break;
      case 'gainAah': totals(L, ev); item(L, {k: 'aah', v: ev.v || 0, capped: !!ev.capped, floor: !!ev.floor, rig: ev.rig || null, fu: !!ev.fusion}); break;
      case 'multAah': totals(L, ev); item(L, {k: 'x', v: num(ev.factor) ?? 1, fu: !!ev.fusion}); break;
      case 'clear': item(L, {k: 'clear', v: ev.n | 0}); break;
      case 'extend': item(L, {k: 'extend', by: ev.by || 1, n: ev.n | 0}); break;
      case 'repeat': item(L, {k: 'repeat', id: ev.shell || (L.byN[ev.from] || {}).id, rate: num(ev.rate)}); break;
      case 'crowdGain': item(L, {k: 'crowd', v: ev.v || 0}); break;
      case 'coinGain': item(L, {k: 'coin', v: ev.v || 0, rig: ev.rig || null}); break;
      case 'crowdCheer': totals(L, ev); L.cheer = {v: ev.v || 0, half: !!ev.half}; L.cur = null; break;
      case 'applause':
        L.app = {ooh: num(ev.ooh), aah: num(ev.aah), score: num(ev.score), target: num(ev.target), pass: !!ev.pass,
          encore: !!ev.encore, ratio: num(ev.ratio), short: num(ev.short)};
        L.cur = null;
        break;
      case 'payout': L.pay = ev; break;
      case 'rainCheck': L.notes.push({k: 'rain', text: 'Rain check used. Miss one more show and the run ends.'}); break;
      case 'relight': L.notes.push({k: 'relight', text: 'The crowd stays for one more! Relight the Countdown.'}); break;
      case 'runLost': L.notes.push({k: 'lost', text: 'The crowd went home.'}); break;
      case 'runWon': L.notes.push({k: 'won', text: ev.final ? 'The Afterparty is over. What a run!' : 'Happy New Year!'}); break;
      default: break;
    }
  }
  // At the slam: the history entry is authoritative for the header and the Applause line.
  function settle(L, entry, summary) {
    const a = L.app || (L.app = {});
    const src = entry || summary || {};
    if (num(src.applause) != null) a.score = src.applause;
    if (num(src.ooh) != null) a.ooh = src.ooh;
    if (num(src.aah) != null) a.aah = src.aah;
    if (num(src.target) != null) a.target = src.target;
    if (src.pass != null) a.pass = !!src.pass;
    if (src.encore != null) a.encore = !!src.encore;
    if (L.snap) {
      if (entry && num(hIdx(entry)) != null) L.snap.s = hIdx(entry);
      if (Array.isArray(src.rules)) L.snap.rules = src.rules;
      if (num(src.target) != null) L.snap.target = src.target;
      if (src.sponsored != null) L.snap.sponsored = !!src.sponsored;
    }
    L.done = true; L.live = false; L.cur = null;
  }
  /** Build a complete log from an event list (pure; used at the slam and by tests). */
  function buildLog(events, sn, entry, summary) {
    const L = newLog(sn);
    for (const ev of events || []) reduce(L, ev);
    if (entry || summary || L.app) settle(L, entry, summary);
    return L;
  }
  /* A restored run has history but no trace: re-resolve the last lit rack (history

  function fromHistory(st) {
    const rec = lastOf(hist(st)), O = sim();
    if (!rec || !Array.isArray(rec.rack) || !O || typeof O.resolveShow !== 'function') return null;
    let r = null;
    try { r = O.resolveShow(rec.rack, {rules: rec.rules || [], crowd: rec.crowdAtLight | 0, fav: rec.fav, trace: true}); } catch (e) { return null; }
    if (!r || !Array.isArray(r.trace)) return null;
    const sn = {s: hIdx(rec), crowd: rec.crowdAtLight | 0, sponsored: !!rec.sponsored, rules: rec.rules || [], target: rec.target, tubes: clone(rec.rack), fav: undefined};
    const evs = r.trace.concat([
      {type: 'crowdCheer', v: r.cheer, half: (rec.rules || []).includes('ferry'), ooh: r.ooh, aah: r.aah},
      {type: 'applause', ooh: rec.ooh, aah: rec.aah, score: rec.applause, target: rec.target, pass: rec.pass, encore: rec.encore}
    ]);
    return buildLog(evs, sn, rec);
  }

  /* =====================================================================
     SHOW LOG — view
  ===================================================================== */
  function skeleton() {
    logEl.innerHTML = `<div class="sl-scrim" aria-hidden="true"></div>
<div class="sl-panel">
  <header class="sl-head">
    <div class="sl-title-row"><h2 class="sl-title">Show log</h2><span class="sl-live" hidden><i aria-hidden="true"></i>Live</span>
      <button type="button" class="btn sl-close" data-sl="close" aria-label="Close the show log">✕</button></div>
    <div class="sl-meta"></div>
  </header>
  <p class="sl-key" aria-hidden="true"><span>Bursts</span><span>Running Ooh × Aah</span></p>
  <div class="sl-body">
    <ol class="sl-lines" aria-label="Bursts, in firing order"></ol>
    <div class="sl-sum"></div>
  </div>
  <div class="sl-foot"><button type="button" class="btn sl-book" data-sl="logbook">${icon('book')}Logbook<kbd>L</kbd></button></div>
</div>`;
    panel = logEl.querySelector('.sl-panel');
    P = {meta: logEl.querySelector('.sl-meta'), body: logEl.querySelector('.sl-body'), lines: logEl.querySelector('.sl-lines'),
      sum: logEl.querySelector('.sl-sum'), live: logEl.querySelector('.sl-live')};
    watchEdges(P.body);
    P.body.addEventListener('scroll', () => { const B = P.body; P.follow = B.scrollTop + B.clientHeight >= B.scrollHeight - 48; }, {passive: true});
    logEl.addEventListener('click', e => {
      if (e.target.classList.contains('sl-scrim')) { closeSheet(); return; }
      const b = e.target.closest('[data-sl]');
      if (!b) return;
      if (b.dataset.sl === 'close') closeSheet();
      else if (b.dataset.sl === 'logbook') {
        if (!isDesk()) closeSheet();
        if (G && typeof G.open === 'function') G.open('logbook');
      }
    });
  }

  function metaHTML(L) {
    const sn = L && L.snap;
    if (!sn) {
      const st = G && G.state;
      if (!st || st.phase !== 'build') return '';
      return `<p class="sl-sub">Next up: <span class="num">Show ${(st.show | 0) + 1}</span> · ${esc(showName(st.show | 0))}</p>`;
    }
    // each Headliner / twist as its chip followed by its rule, in plain sight (no hover tooltip)
    const rules = (sn.rules || []).map(id => { const h = hl(id); return `<p class="sl-rx"><span class="sl-rule">${icon(id)}${esc(h.name)}</span>${h.rule ? ` <span class="sl-rt">${esc(h.rule)}</span>` : ''}</p>`; }).join('');
    return `<p class="sl-sub"><span class="num">Show ${sn.s + 1}</span> · ${esc(showName(sn.s))}</p>
<p class="sl-tg"><span>Target <b class="num">${fmt(sn.target || 0)}</b></span>${sn.sponsored ? '<span class="sl-sp">Sponsored ×1.5</span>' : ''}</p>${rules}`;
  }

  // "sees Willow, Peony" (names of the bursts up, §3.2). Beyond two: the count, then every name,
  // repeats grouped ("sees 5: Peony ×3, Willow, Palm"), so nothing hides in a hover tooltip.
  function seesText(ln, L) {
    if (ln.dud) return '';
    if (!ln.sees) return 'empty sky';
    const names = ln.up ? ln.up.map(n => L.byN[n] && shellName(L.byN[n].id)).filter(Boolean) : [];
    if (names.length === ln.sees && names.length <= 2) return 'sees ' + names.join(', ');
    if (!names.length) return `sees ${ln.sees}`;
    const cnt = new Map();
    for (const n of names) cnt.set(n, (cnt.get(n) || 0) + 1);
    const list = [...cnt].map(([n, k]) => (k > 1 ? `${n} ×${k}` : n)).join(', ');
    const more = ln.sees - names.length;
    return `sees ${ln.sees}: ${list}${more > 0 ? ` +${more}` : ''}`;
  }
  function seesFull(ln, L) {
    if (!ln.up || !ln.up.length) return '';
    return ln.up.map(n => L.byN[n] && shellName(L.byN[n].id)).filter(Boolean).join(', ');
  }
  function chipsHTML(ln) {
    let h = '';
    const reps = ln.items.filter(it => it.k === 'repeat');
    let repDone = false;
    for (const it of ln.items) {
      const fu = it.fu ? ' is-fu' : '';
      switch (it.k) {
        case 'fusion': h += `<span class="chip chip-fusion sl-c">✦ ${esc(it.name)}${it.first ? ' <em>new!</em>' : ''}</span>`; break;
        case 'ooh':
          h += it.critic ? `<span class="chip sl-c is-off${fu}">0 Ooh <em>Critic</em></span>` : `<span class="chip sl-c${fu}">+${fmt(it.v)} Ooh</span>`;
          break;
        case 'aah': {
          const why = it.rig ? rigName(it.rig) : it.floor ? 'no ×' : it.capped ? 'capped' : '';
          h += `<span class="chip chip-aah sl-c${fu}">+${fmtA(it.v)} Aah${why ? ` <em>${esc(why)}</em>` : ''}</span>`;
          break;
        }
        case 'x': h += `<span class="chip chip-x sl-c${fu}">${fmtX(it.v)} Aah</span>`; break;
        case 'clear': h += `<span class="sl-t">clears ${it.v}</span>`; break;
        case 'extend': h += `<span class="sl-t">+${it.by} Hang${it.n ? ` (${it.n} up)` : ''}</span>`; break;
        case 'repeat':
          if (repDone) break;
          repDone = true;
          h += `<span class="sl-t">${ln.id === 'cake' ? 'repeats' : 'echoes'} ${esc(reps.slice(0, 2).map(r => shellName(r.id)).join(', '))}${reps.length > 2 ? ' +' + (reps.length - 2) : ''}${reps[0].rate ? ' ' + Math.round(reps[0].rate * 100) + '%' : ''}</span>`;
          break;
        case 'crowd': h += `<span class="sl-t sl-hi">Crowd +${fmt(it.v)}</span>`; break;
        case 'coin': h += `<span class="sl-t sl-hi">+$${it.v}${it.rig ? ' ' + esc(rigName(it.rig)) : ''}</span>`; break;
        default: break;
      }
    }
    return h;
  }
  function lineHTML(ln, L) {
    if (ln.sep) return `<p class="sl-sep">${esc(ln.text)}</p>`;
    const col = ln.col || 'W';
    const isFav = L.fav != null && ln.tube === L.fav;
    const cn = ln.washed ? 'washed out' : ln.wild || col === 'X' ? 'Rainbow' : col !== 'W' ? CNAME[col] || '' : '';
    const star = ln.star > 1 ? `<span class="sl-star num">★${Math.min(3, ln.star)}</span>` : '';   // spelled out, not pips + tooltip
    const flags = (ln.shot > 0 ? `<span class="sl-flag is-shot">burst ${ln.shot + 1}</span>` : '') + (ln.dud ? '<span class="sl-flag is-dud">dud</span>' : '') + (ln.half ? '<span class="sl-flag">½ strength</span>' : '') + (ln.last ? '<span class="sl-flag">last</span>' : '');
    const sees = seesText(ln, L);
    const chips = flags + (sees ? `<span class="sl-sees">${esc(sees)}</span>` : '') + chipsHTML(ln);
    const tot = `<span class="sl-run num">${fmt(Math.floor(ln.ooh))}<i>×</i>${fmtA(ln.aah)}</span>`;
    return `<div class="sl-l1"><span class="sl-tube num">T${ln.tube != null ? ln.tube + 1 : '?'}</span>${shape(ln.wild ? 'X' : col)}<span class="sl-name">${esc(shellName(ln.id))}${cn ? ` <span class="sl-col">(${esc(cn)})</span>` : ''}${star}</span>${isFav ? '<span class="sl-fav">♛ Crowd Favourite</span>' : ''}</div>
<div class="sl-chips">${chips}${tot}</div>`;
  }
  function lineLabel(ln, L) {
    if (ln.sep) return ln.text;
    const full = seesFull(ln, L);
    const gains = [];
    for (const it of ln.items) {
      if (it.k === 'fusion') gains.push('fusion ' + it.name);
      else if (it.k === 'ooh') gains.push(it.critic ? 'no Ooh, the Critic' : `plus ${fmt(it.v)} Ooh`);
      else if (it.k === 'aah') gains.push(`plus ${fmtA(it.v)} Aah${it.rig ? ' from ' + rigName(it.rig) : ''}`);
      else if (it.k === 'x') gains.push(`times ${String(Math.round(it.v * 100) / 100)} Aah`);
      else if (it.k === 'clear') gains.push(`clears ${it.v}`);
      else if (it.k === 'extend') gains.push(`Hang plus ${it.by}`);
      else if (it.k === 'repeat') gains.push(`repeats ${shellName(it.id)}`);
      else if (it.k === 'crowd') gains.push(`Crowd plus ${fmt(it.v)}`);
      else if (it.k === 'coin') gains.push(`plus ${it.v} dollars`);

  function msTask(ms) {

  function msSoFar(ms) {

  }
  function unlocksOf(ms) {
    const u = ms.m.unlocks;
    if (typeof u === 'string') return u;
    if (u && typeof u === 'object' && !Array.isArray(u)) {
      const nm = (u.shells || []).map(id => shellRow(id).name).concat((u.kits || []).map(id => 'the ' + kitRow(id).name + ' kit'), (u.other || []).map(x => /^every fusion shows its/i.test(x) ? 'the first shell of every fusion in the Logbook' : String(x)));

    const names = Array.isArray(u) ? u.map(id => (row(D().SHELLS, id) || row(D().KITS, id) || {name: cap(id)}).name)
      : rows(D().SHELLS).filter(r => r.lock === ms.id).map(r => r.name).concat(rows(D().KITS).filter(k => (k.unlock || k.lock) === ms.id).map(k => 'the ' + k.name + ' kit'));

  function silhouette(ms) {

    const fus = rows(D().FUSIONS).map(f => {
      const key = f.key || (typeof f.id === 'string' && f.id.includes('>') ? f.id : (f.a || f.from) + '>' + (f.b || f.to));
      const [a, b] = key.split('>');

    }).filter(f => f.a && f.b && !(found[f.key] && found[f.key].found) && ok(f.a) && ok(f.b) && isUnlocked(f.lock) &&
      (owned.has(f.a) || (found[f.key] && found[f.key].leftSeen) || (cs[f.a] && cs[f.a].owned)));
    const f = fus.find(x => owned.has(x.a)) || fus[0];
    if (f) return {id: f.a, col: shellRow(f.a).col, label: shellRow(f.a).name + ' → ?', hint: `A fusion is waiting: fire the right shell straight after a ${shellRow(f.a).name}.`};
    for (const m of ms) {

  function keepOptions() {

    if (!list) { const r = call(sim(), 'keepsakeOptions', v.st, v.st.unlocked); list = r && Array.isArray(r.options) ? r.options : null; }

  }
  function keepLocal() {
    const opts = [], seen = new Set();
    for (const s of shellsOf(v.st)) {
      if (rarity(shellRow(s.id)) !== 'C') continue;
      const k = s.id + ':' + s.col;
      if (!seen.has(k)) { seen.add(k); opts.push({id: s.id, col: s.col}); }
    }
    if (!opts.length) {
      const pool = rows(D().SHELLS).filter(r => rarity(r) === 'C' && isUnlocked(r.lock)), rnd = prng(hash(v.seed + '|keep'));
      while (opts.length < 3 && pool.length) {

  }

      (Array.isArray(meta.kits) && meta.kits.includes(k.id)));
  }
  function renownMax() {
    if (unlockedAll()) return 8;

  /* ============================================================
     Charts (inline SVG sized to the container; token colours via CSS)
  ============================================================ */
  const crown = (x, y, cls) => `<path class="${cls}" d="M${x - 8},${y + 5}L${x - 8},${y - 3}L${x - 4},${y + 1}L${x},${y - 6}L${x + 4},${y + 1}L${x + 8},${y - 3}L${x + 8},${y + 5}Z"/>`;
  const cross = (x, y, s) => `<path class="ec-miss" d="M${x - s},${y - s}L${x + s},${y + s}M${x + s},${y - s}L${x - s},${y + s}"/>`;

  function applauseSVG(W) {
    const H = 216, L = 56, Rp = 12, Tp = 18, Bp = 30, pw = W - L - Rp, ph = H - Tp - Bp;
    const N = v.endless || v.last.n > 24 ? Math.min(36, Math.ceil(v.last.n / 3) * 3) : 24;
    const tg = [];
    for (let s = 0; s < N; s++) tg[s] = baseTarget(s);
    const vals = v.shows.map(x => x.applause).concat(tg).filter(x => x > 0);
    if (!vals.length) vals.push(100);
    const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...vals))));
    let hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...vals) * 1.02)));
    if (hi / lo < 100) hi = lo * 100;
    const lg = Math.log10, X = n => L + (n - .5) / N * pw;
    const Y = a => Tp + ph - (lg(Math.max(a, lo)) - lg(lo)) / (lg(hi) - lg(lo)) * ph;
    let s = '';
    const bw = 3 * pw / N;                                         // festival bands + labels
    for (let f = 1; f <= N / 3; f++) {
      const x0 = L + (f - 1) * bw;
      if (f % 2 === 0) s += `<rect class="ec-band" x="${x0}" y="${Tp}" width="${bw}" height="${ph}"/>`;
      if (bw >= 20 || f % 2) s += `<text class="ec-lbl" x="${x0 + bw / 2}" y="${H - 8}" text-anchor="middle">${f}</text>`;
    }
    const dec = Math.round(lg(hi / lo)), stepD = dec > 5 ? 2 : 1;       // decade gridlines
    for (let d = 0; d <= dec; d += stepD) {
      const val = lo * Math.pow(10, d), y = Y(val);
      s += `<line class="ec-grid" x1="${L}" x2="${W - Rp}" y1="${y}" y2="${y}"/><text class="ec-lbl" x="${L - 6}" y="${y + 5}" text-anchor="end">${axisNum(val)}</text>`;
    }
    let tp = '';                                                     // target: dashed step line
    for (let i = 0; i < N; i++) {
      if (!tg[i]) continue;
      const y = Y(tg[i]).toFixed(1), xa = (L + i / N * pw).toFixed(1), xb = (L + (i + 1) / N * pw).toFixed(1);
      tp += (tp && tg[i - 1] ? `L${xa},${y}` : `M${xa},${y}`) + `L${xb},${y}`;
    }
    s += `<path class="ec-target" d="${tp}"/>`;
    const dup = {}, pts = v.shows.map(x => { const k = dup[x.s] = (dup[x.s] || 0) + 1; return {x, px: X(x.n) + (k - 1) * Math.min(6, pw / N * .4), py: Y(x.applause)}; });
    if (pts.length > 1) s += `<path class="ec-line" d="M${pts.map(p => p.px.toFixed(1) + ',' + p.py.toFixed(1)).join('L')}"/>`;
    const ringR = Math.max(7, Math.min(10, pw / N * .62)).toFixed(1);   // rings stay rings, not a chain, when shows are 10 px apart
    for (const p of pts) {                                           // markers
      const {x, px, py} = p, head = x.k === 2;
      const tip = `Show ${x.n}, ${festName(x.f)} ${SLOT[x.k]}: ${fmt(x.applause)} vs ${fmt(x.target)}${x.pass ? '' : ', missed'}${x.sponsored ? ', sponsored' : ''}${x.encore ? ', encore' : ''}`;
      s += `<g><title>${esc(tip)}</title>`;
      if (x.sponsored) s += `<circle class="ec-ring" cx="${px}" cy="${py}" r="${ringR}"/>`;
      if (!x.pass) s += `<circle class="ec-halo" cx="${px}" cy="${py}" r="7"/>${cross(px, py, 5)}` + (head ? crown(px, py - 14, 'ec-crown miss') : '');
      else if (head) s += crown(px, py, 'ec-crown');
      else s += `<circle class="ec-dot" cx="${px}" cy="${py}" r="4.5"/>`;
      s += `<circle class="ec-hit" cx="${px}" cy="${py}" r="12"/></g>`;
    }
    if (v.best && v.best.applause > 0) {                             // direct label: the best show
      // Above the point when there is headroom, else beside it (on the side away from the plot edge):
      // never below, where the earlier, lower shows sit.
      const p = pts.find(q => q.x === v.best), up = p.py - 16 >= Tp + 12;

      const x = up ? p.px : p.px + (anchor === 'end' ? -14 : 14), y = up ? p.py - 16 : p.py + 5;
      s += `<text class="ec-val" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}">${fmt(v.best.applause)}</text>`;
    }
    return `<svg class="end-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-labelledby="end-h-chart end-chart-sum">${s}</svg>`;
  }

  function paretoSVG(items, W) {
    const H = 206, L = 56, Rp = 12, Tp = 14, Bp = 40, pw = W - L - Rp, ph = H - Tp - Bp;
    const maxBars = W < 420 ? 7 : 9;
    let bars = items;
    if (items.length > maxBars) {
      const rest = items.slice(maxBars - 1).reduce((a, b) => a + b.share, 0);
      bars = items.slice(0, maxBars - 1).concat([{key: 'other', name: 'everything else', mono: '…', share: rest}]);
    }
    const slot = pw / bars.length, bw = Math.min(24, slot * .6), Y = q => Tp + ph - q * ph;
    let s = '', cum = 0, vital = -1;
    [0, .5, 1].forEach(q => { s += `<line class="ec-grid" x1="${L}" x2="${W - Rp}" y1="${Y(q)}" y2="${Y(q)}"/><text class="ec-lbl" x="${L - 6}" y="${Y(q) + 5}" text-anchor="end">${q * 100}%</text>`; });

    vital = cums.findIndex(c => c >= .799);
    s += `<line class="ep-80" x1="${L}" x2="${W - Rp}" y1="${Y(.8)}" y2="${Y(.8)}"/><text class="ec-lbl" x="${W - Rp}" y="${Y(.8) + 20}" text-anchor="end">80%</text>`;
    bars.forEach((b, i) => {

        `<path class="${cls}" d="M${x},${Y(0)}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${Y(0)}Z"/>` +
        `<rect class="ec-hit" x="${cx - slot / 2}" y="${Tp}" width="${slot}" height="${ph}"/></g>`;
      const ly = Y(0) + 14;                                            // x label: colour shape + monogram

      const wide = slot >= 56, cyC = wide ? ly : H - 16, k = wide ? 1 : 1.3;

      else if (b.key !== 'other') s += `<path class="ep-shape" style="fill:var(--c-${esc(b.col || 'W')})" d="${shapeD(b.col, cx, ly, 6)}"/>`;
      if (b.key !== 'crowd' || wide) s += `<text class="ec-val" x="${cx}" y="${H - 6}" text-anchor="middle">${esc(b.key === 'crowd' ? 'Crowd' : b.mono)}</text>`;
    });
    let path = '';
    bars.forEach((b, i) => { path += (i ? 'L' : 'M') + (L + slot * (i + .5)).toFixed(1) + ',' + Y(cums[i]).toFixed(1); });
    s += `<path class="ep-cum" d="${path}"/>`;

    return {svg: `<svg class="end-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-labelledby="end-h-pareto end-pareto-cap">${s}</svg>`, bars, vital};
  }
  function paretoCaption(items) {
    let c = 0;

    const names = few.map(it => it.name);

        <div id="end-pareto"><p class="end-wait">Adding up the cheers…</p></div>
      </section>
      <section class="end-sec" aria-labelledby="end-h-keep">
        <h3 id="end-h-keep">Keepsake</h3>
        <p class="end-dim" id="end-keep-d">Take one Common shell into your next run. It starts in the Crate.</p>
        <div class="end-keep" role="radiogroup" aria-labelledby="end-h-keep" aria-describedby="end-keep-d">
          ${keeps.map((k, i) => `<button type="button" role="radio" class="end-kopt" aria-checked="false" data-keep="${i}" tabindex="-1" aria-label="${esc(shellName(k))}">${tokenHTML(k)}<span class="end-kname" lang="en">${esc(shellRow(k.id).name)}</span></button>`).join('')}
          <button type="button" role="radio" class="end-kopt end-knone" aria-checked="true" data-keep="none" tabindex="0"><span class="end-tok end-tok-none" aria-hidden="true">—</span><span class="end-kname">None</span></button>
        </div>
      </section>
      <section class="end-sec" aria-label="More options">

  </div>
  <div class="end-actions">
    <button type="button" id="run-it-back" class="btn btn-primary" data-end="again" data-autofocus autofocus>Run it back<kbd class="end-kbd" aria-hidden="true">R</kbd></button>
    ${canParty ? '<button type="button" class="btn end-party" data-end="party">Afterparty</button>' : ''}
  </div>
</div>`;
    renderMore();
    hydrateTokens(root);
    lastW = 0;
    paintCharts(true);
    savePoster();
    startJobs();
  }

  /* The run's unlocks, in the order they came. After an Afterparty only those new since the win's end
     screen: the core's list covers the whole run, and the win already showed the rest. The win's
     list is remembered per run seed (in memory and, across a reload, in sessionStorage); without it,
     everything up to the season win (m_win and what it opens) counts as shown. */
  const WIN_SEEN = 'oohxaah.endWinSeen';
  const unlockKey = u => u.kind + ':' + u.id;
  let winSeen = null;
  function freshUnlocks(view) {
    const all = (view.lr.newUnlocks || []).map(u => (typeof u === 'string' ? {kind: row(D().SHELLS, u) ? 'shell' : 'other', id: u} : u))
      .filter(u => u && u.id != null);
    const seed = String(view.seed);
    if (view.kind === 'win') {
      winSeen = {seed, keys: all.map(unlockKey)};
      try { sessionStorage.setItem(WIN_SEEN, JSON.stringify(winSeen)); } catch (e) { /* storage blocked: memory only */ }
      return all;
    }
    if (!view.endless) return all;
    let seen = winSeen && winSeen.seed === seed ? winSeen : null;
    if (!seen) { try { const r = JSON.parse(sessionStorage.getItem(WIN_SEEN) || 'null'); if (r && r.seed === seed && Array.isArray(r.keys)) seen = r; } catch (e) { /* ignore */ } }
    if (seen) { const k = new Set(seen.keys); return all.filter(u => !k.has(unlockKey(u))); }
    let cut = -1;
    all.forEach((u, i) => { if (u.id === 'm_win' || u.milestone === 'm_win') cut = i; });
    return all.slice(cut + 1);
  }

  /* "Just unlocked" cards (§7.2): one per milestone reached, naming what it opens; they apply from the next run. */
  function newsHTML(news) {
    if (!news.length) return '';
    const MODE = {afterparty: 'the Afterparty', daily: 'the Daily Show'};
    const groups = [], byMs = {};
    for (const u of news) {
      const key = u.kind === 'milestone' ? u.id : (u.milestone || '');
      let gr = key ? byMs[key] : null;
      if (!gr) { gr = {ms: key, items: []}; groups.push(gr); if (key) byMs[key] = gr; }
      if (u.kind !== 'milestone') gr.items.push(u);
    }
    const card = gr => {
      const shells = gr.items.filter(u => u.kind === 'shell'), fus = gr.items.filter(u => u.kind === 'fusion').length;
      const names = gr.items.map(u => {
        if (u.kind === 'shell') return shellRow(u.id).name;
        if (u.kind === 'kit') return 'the ' + kitRow(u.id).name + ' kit';
        if (u.kind === 'renown') return 'Renown ' + u.id;
        if (u.kind === 'mode') return MODE[u.id] || cap(u.id);
        if (u.kind === 'fusion') return null;
        return (row(D().MILESTONES, u.id) || {}).name || cap(u.id);
      }).filter(Boolean);
      if (fus) names.push(fus > 1 ? fus + ' new fusions' : 'a new fusion');
      if (gr.ms === 'm_win' && !names.length) names.push('Renown 1, the Afterparty and the Daily Show');
      const sh = shells[0] && shellRow(shells[0].id);
      const art = sh ? tokenHTML({id: shells[0].id, col: sh.col === '*' ? 'R' : sh.col}) : '<span class="end-new-ico" aria-hidden="true">★</span>';
      const title = gr.ms ? ((row(D().MILESTONES, gr.ms) || {}).name || cap(String(gr.ms).replace(/^m_/, ''))) + ' ✓' : 'Just unlocked';
      return `<li class="end-new">${art}<span><b>${esc(title)}</b>${names.length ? `<span class="end-new-what">${gr.ms ? 'Unlocks ' : ''}${esc(andList(names))}</span>` : ''}</span></li>`;
    };
    return `<ul class="end-news">${groups.slice(0, 10).map(card).join('')}</ul><p class="end-dim end-news-note">They join from your next run.</p>`;
  }

  function renderMore() {
    const el = root && root.querySelector('#end-more');
    if (!el) return;
    const ks = kits(), rmax = renownMax(), meta = G.meta || {};
    const daily = has(G, 'canDaily') ? !!call(G, 'canDaily') : ((meta.unlocked || []).includes('m_win') || unlockedAll());
    el.innerHTML = `
      <button type="button" class="btn" data-end="replay">Play this seed again</button>
      <button type="button" class="btn" data-end="logbook">Logbook</button>
      <button type="button" class="btn" data-end="kit" aria-expanded="${picker === 'kit'}" aria-controls="end-pick"${ks.length < 2 ? ' aria-disabled="true"' : ''}>Kit: ${esc(kitRow(sel.kit).name)} <span aria-hidden="true">▾</span></button>
      <button type="button" class="btn" data-end="renown" aria-expanded="${picker === 'renown'}" aria-controls="end-pick"${rmax < 1 ? ' aria-disabled="true"' : ''}>Renown ${sel.renown} <span aria-hidden="true">▾</span></button>
      ${daily ? '<button type="button" class="btn" data-end="daily">Daily Show</button>' : ''}
      ${ks.length < 2 || rmax < 1 ? `<p class="end-dim end-more-hint">${ks.length < 2 && rmax < 1 ? 'Milestones open more kits; a win opens Renown.' : ks.length < 2 ? 'Milestones open more kits.' : 'Win a run to raise your Renown.'}</p>` : ''}`;
    const pk = root.querySelector('#end-pick');
    if (!picker) { pk.hidden = true; pk.innerHTML = ''; return; }
    pk.hidden = false;
    if (picker === 'kit') {
      pk.setAttribute('aria-label', 'Choose a kit');
      pk.innerHTML = ks.map(k => `<button type="button" class="end-opt" data-kit="${esc(k.id)}" aria-pressed="${k.id === sel.kit}"><b>${esc(k.name)}</b>${k.text || k.desc || k.rule ? `<span>${esc(k.text || k.desc || k.rule)}</span>` : ''}</button>`).join('');
    } else {
      pk.setAttribute('aria-label', 'Choose a Renown level');
      let h = '';
      for (let l = 0; l <= rmax; l++) h += `<button type="button" class="end-opt" data-renown="${l}" aria-pressed="${l === sel.renown}"><b>Renown ${l}</b><span>${esc(l ? renownText(l) : 'No modifiers')}</span></button>`;
      if (v.fair) h += '<p class="end-dim">Fair Weather is on: wins do not raise your Renown.</p>';
      pk.innerHTML = h;
    }
  }

  function paintCharts(force) {
    if (!root || !v) return;
    const plot = root.querySelector('#end-chart'), cv = root.querySelector('#end-poster');
    const W = Math.floor((plot && plot.clientWidth) || 0);
    if (!W || (!force && W === lastW)) return;
    lastW = W;
    plot.innerHTML = applauseSVG(W);
    if (cv) paintPoster(cv, posterOf(), {width: cv.clientWidth});
    if (out.pareto) paintPareto();
    if (document.fonts && document.fonts.load && !paintCharts.fontWait) {    // repaint once Fraunces arrives
      paintCharts.fontWait = true;
      document.fonts.load('600 26px Fraunces').then(() => { if (cv && cv.isConnected) paintPoster(cv, posterOf(), {width: cv.clientWidth}); }, () => {});
    }
  }
  function paintPareto() {
    const el = root && root.querySelector('#end-pareto');
    if (!el) return;
    const items = out.pareto;
    if (!items || !items.length) { el.innerHTML = '<p class="end-dim">No shows to add up yet.</p>'; return; }
    // Size the chart to the plot's inner box (inside its border) so the SVG draws at 1:1 and its
    // 16px labels render at 16px, not scaled down by max-width.
    let plot = el.querySelector(':scope > .end-plot');
    if (!plot) { el.innerHTML = '<div class="end-plot"></div>'; plot = el.firstChild; }
    const W = Math.floor(plot.clientWidth || 300), p = paretoSVG(items, W);
    el.innerHTML = `<div class="end-plot">${p.svg}</div><p class="end-cap" id="end-pareto-cap">${esc(paretoCaption(items))}</p>
      <ul class="end-key">${p.bars.map((b, i) => `<li${i > p.vital || b.key === 'other' ? ' class="dim"' : ''}>${b.key === 'crowd' ? '<b><svg class="end-key-ico" width="22" height="14" viewBox="-11 -9 22 16" aria-hidden="true"><g class="ep-crowd"><circle cx="-6" cy="-3" r="3"/><circle cx="6" cy="-3" r="3"/><circle cx="0" cy="-5" r="3.4"/><path d="M-11,6q5,-8 11,-8q6,0 11,8z"/></g></svg></b>' : b.key === 'other' ? '<b>…</b>' : `<b>${esc(b.mono)}</b>`} ${esc(b.key === 'crowd' ? 'Crowd' : b.key === 'other' ? 'everything else' : b.name)} <span class="num">${pct(b.share)}</span></li>`).join('')}</ul>`;
  }

  /* ---------- async jobs: near-miss → lesson, then Pareto (all within 1 s) ---------- */
  function startJobs() {
    const deadline = now() + 900, S = sim();
    const finishNear = r => {
      out.nearMiss = r;
      const el = root.querySelector('#end-near');
      if (el) el.innerHTML = nearMissLines(r).map(t => `<p>${esc(t)}</p>`).join('');
    };
    const lesson = r => {          // its own macrotask, after the near-miss text has painted
      const id = job;
      defer(() => {
        if (id !== job) return;
        const t0 = now();
        out.lesson = lessonOf(r);
        if (out.timing) out.timing.lessonMs = now() - t0;
        const ls = root.querySelector('#end-lesson');
        if (ls) ls.textContent = out.lesson;
        pareto();
      });
    };
    const pareto = () => sliced(paretoGen(deadline), items => { out.pareto = items || []; paintPareto(); }, 'pareto');
    if (!v.lost) { out.lesson = lessonOf(null); pareto(); return; }
    const fp = v.fp && v.fp.tubes ? v.fp : null, L = v.last;
    const rules = L.rules.length ? L.rules : (fp && has(S, 'rulesFor') ? call(S, 'rulesFor', fp, fp.show) || [] : []);
    const ctx = {fp, rules, target: L.target, baseTarget: baseTarget(L.s), applause: L.applause};
    // Preferred: the SIM's own §8.6 search as a generator, sliced here. Otherwise the same search on SIM
    // primitives (one resolve per step). Last resort: the SIM's synchronous nearMiss, deferred one slice.
    let gen = null;
    if (fp && has(S, 'nearMissGen')) { try { gen = S.nearMissGen(fp, rules, L.target); } catch (e) { warn('nearMissGen', e); } }
    if (!gen && fp && has(S, 'resolveShow')) gen = nearMissGen(ctx, deadline);
    if (!gen && fp && has(S, 'nearMiss')) gen = (function* () { yield; return call(S, 'nearMiss', fp, rules, L.target); })();
    if (!gen || typeof gen.next !== 'function') { finishNear(null); lesson(null); return; }
    sliced(gen, r => { const nm = normNear(r); finishNear(nm); lesson(nm); }, 'nearMiss');
  }

  /* ---------- persistence through GAME ---------- */
  function savePoster() {
    const p = posterOf();
    if (!p || p.key === savedKey) return;
    savedKey = p.key;
    const list = Array.isArray((G.meta || {}).posters) ? G.meta.posters.slice() : [];
    if (list.some(x => x && x.key === p.key)) return;
    list.push(p);
    call(G, 'setMeta', {posters: list.slice(-5)});
  }
  function setKeep(i) {
    const opts = keepOptions();
    sel.keep = i === 'none' ? null : opts[+i] || null;
    root.querySelectorAll('.end-kopt').forEach(b => {
      const on = b.getAttribute('data-keep') === String(i);
      b.setAttribute('aria-checked', on); b.tabIndex = on ? 0 : -1;
    });
    if (has(G, 'setKeepsake')) call(G, 'setKeepsake', sel.keep);
    else call(G, 'setMeta', {keepsake: sel.keep});
    const A = typeof AUDIO === 'object' && AUDIO;
    call(A, 'ui', 'pluck', {col: sel.keep ? sel.keep.col : 'W'});
  }

  /* ---------- actions ---------- */
  const newSeed = () => Math.random().toString(36).slice(2, 7);
  function leave() {
    job++;
    try { if (has(G, 'top') && G.top() === 'end') G.close('end'); } catch (e) { warn('close', e); }
  }
  function start(o) {
    if (busy) return;
    busy = true;
    leave();
    call(G, 'newRun', Object.assign({kit: sel.kit, renown: sel.renown, keepsake: sel.keep}, o));
  }
  const runItBack = () => start({seed: newSeed()});
  function onClick(e) {
    const b = e.target.closest('button');
    if (!b || !root.contains(b)) return;
    const act = b.getAttribute('data-end');
    if (b.hasAttribute('data-keep')) return setKeep(b.getAttribute('data-keep'));
    if (b.hasAttribute('data-kit')) { sel.kit = b.getAttribute('data-kit'); call(G, 'setMeta', {kit: sel.kit}); return closePicker('kit'); }
    if (b.hasAttribute('data-renown')) {
      sel.renown = +b.getAttribute('data-renown');
      call(G, 'setMeta', {renown: Object.assign({}, typeof (G.meta || {}).renown === 'object' ? G.meta.renown : {max: renownMax()}, {selected: sel.renown})});
      return closePicker('renown');
    }
    switch (act) {
      case 'again': return runItBack();
      case 'replay': return start({seed: v.seed, replay: true});
      case 'party': if (!busy) { busy = true; leave(); call(G, 'enterAfterparty'); } return;
      case 'logbook': backTo = b; return call(G, 'open', 'logbook');
      case 'daily': {
        if (has(G, 'startDaily')) { if (!busy) { busy = true; leave(); call(G, 'startDaily'); } return; }
        const d = new Date(), ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        return start({seed: call(sim(), 'dailySeed', ds) || 'daily-' + ds, kit: 'apprentice', renown: 0, daily: true});
      }
      case 'kit': case 'renown':
        if (b.getAttribute('aria-disabled') === 'true') return;
        picker = picker === act ? null : act;
        renderMore();
        focusSel(picker ? '#end-pick [aria-pressed="true"]' : `[data-end="${act}"]`);
        call(typeof AUDIO === 'object' && AUDIO, 'ui', 'tick');
    }
  }
  function closePicker(which) {
    picker = null;
    renderMore();
    focusSel(`[data-end="${which}"]`);
    call(typeof AUDIO === 'object' && AUDIO, 'ui', 'tick');
  }
  function focusSel(q) { const el = root && root.querySelector(q); if (el) el.focus({preventScroll: false}); }

  /* ---------- 'end'-scope keys ---------- */
  // A control that takes focus is scrolled fully clear of the sticky Run it back bar (and of the
  // top edge); scroll-padding on #end does this for the browser's own focus scrolling, this covers
  // the rest (focus() from script, engines that ignore scroll-padding for focus).
  function keepClearOfBar(e) {
    const t = e.target, bar = root && root.querySelector('.end-actions');
    if (!bar || !t || t === root || bar.contains(t) || !t.getBoundingClientRect) return;
    const r = t.getBoundingClientRect(), b = bar.getBoundingClientRect(), top = root.getBoundingClientRect().top + 8;
    if (!r.height) return;
    if (r.bottom > b.top - 12) root.scrollTop += Math.min(r.bottom - b.top + 12, r.top - top);
    else if (r.top < top) root.scrollTop -= top - r.top;
  }
  function onKey(e) {
    if (!isOpen()) return false;
    const k = e.key, ae = document.activeElement;
    const done = () => { if (e && typeof e.preventDefault === 'function') e.preventDefault(); return true; };
    if (k === 'Escape') {
      if (picker) { closePicker(picker); return done(); }
      return done();                       // nothing to fall back to behind the end screen
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return false;
    if (k === 'r' || k === 'R') { runItBack(); return done(); }
    if (k === 'Enter') {
      const onControl = ae && root.contains(ae) && ae.matches('button,a,input,select,textarea') && ae.id !== 'run-it-back';
      if (onControl) return false;         // let the focused control activate itself
      runItBack();
      return done();
    }
    const arrow = {ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1}[k];
    if (arrow && ae && root.contains(ae)) {
      const group = ae.closest('.end-keep, .end-pick');
      if (!group) return false;
      const items = [...group.querySelectorAll('button')], i = items.indexOf(ae);
      const next = items[(i + arrow + items.length) % items.length];
      if (!next) return false;
      next.focus();
      if (group.classList.contains('end-keep')) setKeep(next.getAttribute('data-keep'));
      return done();
    }
    return false;
  }

  /* ---------- open / lifecycle ---------- */
  function isOpen() { return !!root && !root.hidden; }
  function show(lr) {
    render(lr);
    try { if (!isOpen() || !has(G, 'top') || G.top() !== 'end') call(G, 'open', 'end', {focus: '#run-it-back'}); } catch (e) { warn('open', e); }
    if (root.hidden) root.hidden = false;           // no overlay stack available: show it ourselves
    const focusRIB = () => { const b = root.querySelector('#run-it-back'); if (b) b.focus({preventScroll: true}); root.scrollTop = 0; };
    focusRIB();
    requestAnimationFrame(() => { focusRIB(); paintCharts(false); });
    // The core announces the run end itself (assertive, spec §13); add only the best show, politely.
    if (v.best) call(G, 'announce', `Best show: ${fmt(v.best.applause)} at show ${v.best.n}.`, {assertive: false});
  }

  function init(game) {
    G = game || (typeof GAME === 'object' && GAME) || null;
    root = document.getElementById('end');
    if (!G || !root) return;
    root.addEventListener('click', onClick);
    root.addEventListener('focusin', keepClearOfBar);
    call(G, 'onKey', 'end', onKey);
    call(G, 'on', 'runEnd', p => show((p && p.lastRun) || G.lastRun));
    call(G, 'on', 'runStart', () => { job++; if (isOpen() && has(G, 'top') && G.top() === 'end') call(G, 'close', 'end'); });
    call(G, 'on', 'settings', p => { if (p && (p.key === 'highContrast' || p.key === 'reducedMotion') && isOpen()) { hydrateTokens(root); paintCharts(true); paintPareto(); } });
    call(G, 'on', 'overlay', p => {
      if (!p || p.open) return;
      if (p.name === 'end') { job++; backTo = null; return; }
      // Back from the Logbook: return focus to the button that opened it (the core would pick the first control).
      if (backTo && backTo.isConnected && isOpen() && (!has(G, 'top') || G.top() === 'end')) { backTo.focus({preventScroll: true}); backTo = null; }
    });
    const onResize = () => { if (isOpen()) requestAnimationFrame(() => { paintCharts(false); }); };
    call(G, 'on', 'resize', onResize);
    if (typeof ResizeObserver === 'function') new ResizeObserver(onResize).observe(root);
    else window.addEventListener('resize', onResize);
  }

  return {init, render, show, isOpen, posterOf, paintPoster, result: () => out};
})();

/* ==========================================================================

const UI_MENUS = (() => {

  const ICONS = {

      if (p && p.key === 'highContrast') pictoCache.clear();
      if (isOpen('settings')) syncSettings();
      if (isOpen('logbook') && p && p.key === 'highContrast') renderLogbook();
    });
    call(G, 'on', 'meta', () => { if (isOpen('logbook') && !L.open) renderLogbook(); });
    call(G, 'on', 'change', () => { if (isOpen('pause-menu')) renderPause(true); });
    const noteBuild = () => { if (G.ui === 'BUILD' && G.state) P.lastBuild = Number(G.state.show) || 0; };
    noteBuild();
    call(G, 'on', 'ui', (p) => { if (p && p.to === 'BUILD') noteBuild(); if (isOpen('pause-menu')) renderPause(true); });
    call(G, 'on', 'runStart', () => { P.lastBuild = null; noteBuild(); });
    call(G, 'onKey', 'global', globalKey);
    call(G, 'onKey', 'pause', scoped());
    call(G, 'onKey', 'settings', scoped());
    call(G, 'onKey', 'help', scoped());
    call(G, 'onKey', 'logbook', scoped(logbookKey));
    call(G, 'onKey', 'tapContinue', tapKey);
    document.addEventListener('pointerdown', (e) => {
      if (!armed.size) return;
      const btn = e.target && e.target.closest && e.target.closest('[data-armed]');
      disarmAll(btn && armed.has(btn) ? btn : null);
    }, true);
  }

  return { init, toast, openLogbook, renderLogbook: () => { if (L.panel) renderLogbook(); }, syncSettings };
})();
GAME.boot();
</script>
